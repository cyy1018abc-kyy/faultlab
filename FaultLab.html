  <script>
/* ===== src/ui/store.js ===== */
/* owner: lead | module: store | contract: docs/CONTRACT.md */
(function () {
  'use strict';
  const FL = window.FL = window.FL || {};

  const LS_RUNS = 'faultlab.runs.v1';
  const LS_SESSION = 'faultlab.session.v1';
  const MAX_RUNS = 10;

  let state = baseState();
  const listeners = new Set();
  let clockHandle = null;
  let lastFrameTs = 0;
  let toastSeq = 0;
  let saveTimer = null;

  function baseState() {
    return {
      booted: false,
      page: 'home',
      systemId: 'FL-001',
      draft: null,
      draftDirty: false,
      draftErrors: [],
      draftBaseHash: null,
      activeRun: null,
      baselineRun: null,
      monitorRun: null,
      runs: {},
      currentTime: 0,
      computeState: 'empty',
      playback: { status: 'stopped', speed: 1 },
      selectedComponent: null,
      truthSealed: false,
      mode: 'demo',
      pageState: {
        system: { assumptionsOpen: false, showIntro: false, pendingFlash: false },
        signals: {
          category: 'current', visible: {}, baselineOverlay: false,
          viewWindow: null, zoom: 'full', tableMode: false,
          selectedSignal: null, selectedT: null
        },
        causal: { focusNodeId: null, evidenceOpen: false, monitorOpen: false, residualOpen: false },
        compare: { trialRunId: null, baselineRunId: null, view: 'overlay', signalId: null },
        arena: {
          setup: { systemId: 'FL-001', rounds: 6, seed: 20261027, noise: false, agentIds: [] },
          match: null, running: false
        }
      },
      toasts: [],
      drawer: null,
      modal: null,
      introStep: 0,
      lastError: null,
      lastSession: null
    };
  }

  /* ---------------------------------------------------------------- util */
  function notify(reason) {
    const snapshot = state;
    listeners.forEach((fn) => {
      try { fn(snapshot, reason || 'all'); } catch (err) { console.error('[store] listener error', err); }
    });
  }

  function hashOf(obj) {
    try {
      if (FL.core && FL.core.hashObject) return FL.core.hashObject(obj);
    } catch (e) { /* ignore */ }
    try { return JSON.stringify(obj); } catch (e) { return String(Date.now()); }
  }

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function currentSystem() {
    try { return FL.systems.get(state.systemId); } catch (e) { return null; }
  }

  function duration() {
    return state.activeRun ? state.activeRun.config.duration_s : 60;
  }

  function clampTime(t) {
    const d = duration();
    if (!isFinite(t)) return 0;
    return Math.max(0, Math.min(d, t));
  }

  function runSeq() {
    let max = 0;
    Object.keys(state.runs).forEach((id) => {
      const m = /(\d+)/.exec(id);
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return max + 1;
  }

  function makeLabel(config) {
    const sys = (function () { try { return FL.systems.get(config.systemId); } catch (e) { return null; } })();
    const mode = config.feedback_mode === 'monitor' ? '仅监测' : '闭环';
    if (!config.fault || config.fault.family === 'none') return '无故障基准 · ' + mode;
    let faultDef = null;
    try { faultDef = FL.systems.faults(config.systemId).filter((f) => f.id === config.fault.faultId)[0] || null; } catch (e) { faultDef = null; }
    const name = faultDef ? faultDef.shortLabel : (config.fault.family || '故障');
    const p = (config.fault.params || {});
    const mag = p.magnitude != null ? ('+' === '' ? '' : '') + p.magnitude : '';
    const unit = faultDef && faultDef.params && faultDef.params[0] ? faultDef.params[0].unit : '';
    return mode + ' · ' + name + ' ' + mag + unit + ' @' + config.fault.t_start_s + 's';
  }

  function defaultVisibleMap(run) {
    const map = {};
    (run.signals || []).forEach((s) => {
      if (s.tableOnly) return;
      map[s.id] = !(s.chart && s.chart.defaultVisible === false);
    });
    return map;
  }

  function systemDraft(systemId) {
    try {
      if (FL.systems && FL.systems.defaultConfig) return FL.systems.defaultConfig(systemId);
      if (FL.core && FL.core.createConfig) return FL.core.createConfig(systemId, {});
    } catch (e) { console.error('[store] default config failed', e); }
    return null;
  }

  function validateDraft(draft) {
    try {
      if (FL.core && FL.core.validateConfig) return FL.core.validateConfig(draft);
      if (FL.systems && FL.systems.validateDraft) return FL.systems.validateDraft(draft);
    } catch (e) { console.error('[store] validation failed', e); }
    return { ok: true, errors: [], warnings: [] };
  }

  function updateDirty() {
    if (!state.draft) { state.draftDirty = false; return; }
    const h = hashOf(state.draft);
    state.draftDirty = state.draftBaseHash ? h !== state.draftBaseHash : false;
  }

  function setActiveRun(run, opts) {
    state.activeRun = run || null;
    if (run) {
      state.systemId = run.systemId;
      state.computeState = 'completed';
      state.pageState.signals.category = (run.signals && run.signals[0] && run.signals[0].category) || 'current';
      state.pageState.signals.visible = defaultVisibleMap(run);
      state.pageState.signals.viewWindow = null;
      state.pageState.signals.zoom = 'full';
      state.pageState.compare.trialRunId = run.role === 'baseline' ? null : run.runId;
      if (run.role === 'baseline') state.baselineRun = run;
      if (run.role === 'contrast') state.monitorRun = run;
      state.selectedComponent = state.selectedComponent || defaultComponent(run.systemId);
    } else {
      state.computeState = 'draft_valid';
    }
    if (opts && opts.keepTime !== true) state.currentTime = 0;
    state.playback.status = 'stopped';
  }

  function defaultComponent(systemId) {
    try {
      const sys = FL.systems.get(systemId);
      const anchor = sys.faultAnchors && sys.faultAnchors[sys.faults && sys.faults[0] ? sys.faults[0].family : 'sensor_drift'];
      if (anchor) return anchor;
      const sensor = (sys.components || []).filter((c) => /sensor|controller/.test(c.kind))[0];
      return sensor ? sensor.id : (sys.components && sys.components[0] ? sys.components[0].id : null);
    } catch (e) { return null; }
  }

  function ensureBaselineInternal(reason) {
    const draft = state.draft;
    if (!draft) return null;
    // reuse an existing matching baseline
    const want = {
      systemId: draft.systemId, modelId: draft.modelId, modelVersion: draft.modelVersion,
      duration_s: draft.duration_s, dt_s: draft.dt_s, feedback_mode: draft.feedback_mode
    };
    const candidates = Object.keys(state.runs).map((id) => state.runs[id]).filter((r) => r && r.role === 'baseline');
    for (let i = 0; i < candidates.length; i++) {
      const r = candidates[i];
      const c = r.config;
      if (c.systemId === want.systemId && c.modelVersion === want.modelVersion &&
        c.duration_s === want.duration_s && c.dt_s === want.dt_s &&
        c.feedback_mode === want.feedback_mode &&
        JSON.stringify(c.initial) === JSON.stringify(draft.initial)) {
        state.baselineRun = r;
        return r;
      }
    }
    let cfg;
    try {
      cfg = (FL.core && FL.core.createConfig) ? FL.core.createConfig(draft.systemId, Object.assign(clone(draft), {
        fault: { family: 'none', faultId: null, t_start_s: 20, params: { magnitude: 0 } }
      })) : null;
    } catch (e) { cfg = null; }
    if (!cfg) return null;
    let run;
    try { run = FL.core.simulate(cfg); } catch (e) {
      console.error('[store] baseline simulation failed', e);
      state.lastError = String(e && e.message ? e.message : e);
      return null;
    }
    run.runId = 'Run-' + String(runSeq() + 1).padStart(3, '0');
    run.role = 'baseline';
    run.label = makeLabel(cfg);
    run.createdAt = new Date().toISOString();
    state.runs[run.runId] = run;
    state.baselineRun = run;
    pruneRuns();
    persist();
    if (reason === 'explicit') notify('run');
    return run;
  }

  function pruneRuns() {
    const ids = Object.keys(state.runs);
    if (ids.length <= MAX_RUNS) return;
    const keep = new Set();
    if (state.activeRun) keep.add(state.activeRun.runId);
    if (state.baselineRun) keep.add(state.baselineRun.runId);
    if (state.monitorRun) keep.add(state.monitorRun.runId);
    ids.sort((a, b) => {
      const ta = state.runs[a].createdAt || '';
      const tb = state.runs[b].createdAt || '';
      return tb.localeCompare(ta);
    });
    ids.forEach((id) => {
      if (keep.size >= MAX_RUNS) return;
      keep.add(id);
    });
    Object.keys(state.runs).forEach((id) => { if (!keep.has(id)) delete state.runs[id]; });
  }

  /* ------------------------------------------------------------ persist */
  function persist() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        const runs = Object.keys(state.runs).map((id) => state.runs[id]);
        localStorage.setItem(LS_RUNS, JSON.stringify({ v: 1, runs }));
        localStorage.setItem(LS_SESSION, JSON.stringify({
          v: 1, systemId: state.systemId, draft: state.draft,
          activeRunId: state.activeRun ? state.activeRun.runId : null,
          baselineRunId: state.baselineRun ? state.baselineRun.runId : null,
          systemDraftHash: state.draftBaseHash,
          savedAt: new Date().toISOString()
        }));
      } catch (e) {
        console.warn('[store] persist failed', e);
        // quota fallback: keep only current + baseline
        try {
          const keep = [];
          if (state.activeRun) keep.push(state.activeRun);
          if (state.baselineRun && state.baselineRun !== state.activeRun) keep.push(state.baselineRun);
          localStorage.setItem(LS_RUNS, JSON.stringify({ v: 1, runs: keep }));
        } catch (e2) { /* ignore */ }
      }
    }, 220);
  }

  function loadPersisted() {
    let runs = {};
    let session = null;
    try {
      const raw = localStorage.getItem(LS_RUNS);
      if (raw) {
        const parsed = JSON.parse(raw);
        (parsed.runs || []).forEach((r) => { if (r && r.runId) runs[r.runId] = r; });
      }
    } catch (e) { console.warn('[store] load runs failed', e); }
    try {
      const raw = localStorage.getItem(LS_SESSION);
      if (raw) session = JSON.parse(raw);
    } catch (e) { console.warn('[store] load session failed', e); }
    return { runs, session };
  }

  /* -------------------------------------------------------------- clock */
  function startClock() {
    if (clockHandle) return;
    lastFrameTs = 0;
    const step = (ts) => {
      clockHandle = null;
      if (state.playback.status !== 'playing' || !state.activeRun) return;
      if (!lastFrameTs) lastFrameTs = ts;
      const dtReal = Math.min(0.25, (ts - lastFrameTs) / 1000);
      lastFrameTs = ts;
      const next = state.currentTime + dtReal * (state.playback.speed || 1);
      const d = duration();
      if (next >= d) {
        state.currentTime = d;
        state.playback.status = 'ended';
        notify('time');
        notify('playback');
        return;
      }
      state.currentTime = next;
      notify('time');
      clockHandle = requestAnimationFrame(step);
    };
    clockHandle = requestAnimationFrame(step);
  }

  function stopClock() {
    if (clockHandle) { cancelAnimationFrame(clockHandle); clockHandle = null; }
    lastFrameTs = 0;
  }

  /* ------------------------------------------------------------ actions */
  const actions = {
    startExperiment(systemId, opts) {
      const o = opts || {};
      const sid = systemId || state.systemId;
      let sys;
      try { sys = FL.systems.get(sid); } catch (e) { sys = null; }
      if (!sys) { actions.toast('未找到系统 ' + sid, 'danger'); return { ok: false }; }
      stopClock();
      state.systemId = sid;
      state.draft = systemDraft(sid);
      state.draftBaseHash = null;
      state.draftErrors = [];
      state.draftDirty = false;
      state.activeRun = null;
      state.baselineRun = null;
      state.monitorRun = null;
      state.currentTime = 0;
      state.playback = { status: 'stopped', speed: 1 };
      state.selectedComponent = defaultComponent(sid);
      state.pageState.signals.category = 'current';
      state.pageState.signals.visible = {};
      state.pageState.causal = { focusNodeId: null, evidenceOpen: false, monitorOpen: false, residualOpen: false };
      state.computeState = 'draft_valid';
      state.lastError = null;
      state.page = 'system';
      updateHashIfNeeded('system');
      const res = actions.createRun({ silent: true, initial: true });
      if (res && res.ok) {
        ensureBaselineInternal();
        if (!o.silent) {
          const ev = (res.run.events && res.run.events[0]) || null;
          actions.toast('已按默认配置创建 ' + res.run.runId + '（' + (ev ? 't=' + ev.trigger_s + 's ' + ev.label : '无故障') + '）', 'ok');
        }
      }
      notify('run');
      return res || { ok: false };
    },

    createRun(opts) {
      const o = opts || {};
      const draft = state.draft;
      if (!draft) { actions.toast('没有可运行的配置草稿', 'danger'); return { ok: false, error: 'no-draft' }; }
      const val = validateDraft(draft);
      state.draftErrors = val.errors || [];
      if (!val.ok) {
        actions.toast('参数无效：' + (state.draftErrors[0] ? state.draftErrors[0].message : '请检查输入'), 'danger');
        notify('draft');
        return { ok: false, error: 'invalid', errors: state.draftErrors };
      }
      state.computeState = 'computing';
      notify('run');
      let run;
      try {
        run = FL.core.simulate(clone(draft));
      } catch (e) {
        console.error('[store] simulate failed', e);
        state.computeState = 'failed';
        state.lastError = String(e && e.message ? e.message : e);
        state.draftErrors = [{ field: 'simulate', message: state.lastError }];
        actions.toast('计算失败：' + state.lastError, 'danger');
        notify('run');
        return { ok: false, error: state.lastError };
      }
      run.runId = 'Run-' + String(runSeq()).padStart(3, '0');
      run.role = o.role || (draft.fault && draft.fault.family === 'none' ? 'baseline' : 'fault');
      run.label = run.label || makeLabel(run.config);
      run.createdAt = new Date().toISOString();
      state.runs[run.runId] = run;
      state.draftBaseHash = hashOf(draft);
      state.draftDirty = false;
      if (run.role === 'baseline') {
        state.baselineRun = run;
        state.activeRun = state.activeRun || run;
        state.computeState = 'completed';
      } else {
        setActiveRun(run, { keepTime: o.keepTime === true });
      }
      if (!o.initial) state.currentTime = 0;
      state.playback.status = 'stopped';
      pruneRuns();
      persist();
      notify('run');
      if (!o.silent) actions.toast('已创建 ' + run.runId + ' · ' + run.label, 'ok');
      return { ok: true, run };
    },

    createMonitorContrast() {
      const base = state.activeRun || null;
      if (!base) { actions.toast('请先创建一个运行', 'warn'); return { ok: false }; }
      const cfg = clone(base.config);
      cfg.feedback_mode = 'monitor';
      const val = validateDraft(cfg);
      if (!val.ok) { actions.toast('无法创建仅监测对照：' + val.errors[0].message, 'danger'); return { ok: false }; }
      let run;
      try { run = FL.core.simulate(cfg); } catch (e) {
        actions.toast('对照运行计算失败', 'danger'); return { ok: false };
      }
      run.runId = 'Run-' + String(runSeq()).padStart(3, '0');
      run.role = 'contrast';
      run.label = makeLabel(cfg) + '（对照）';
      run.createdAt = new Date().toISOString();
      state.runs[run.runId] = run;
      state.monitorRun = run;
      state.activeRun = run;
      state.currentTime = 0;
      state.playback.status = 'stopped';
      state.computeState = 'completed';
      pruneRuns();
      persist();
      actions.toast('已创建仅监测对照 ' + run.runId + '：真实电流保持不变，测量电流仍偏高', 'info');
      notify('run');
      return { ok: true, run };
    },

    ensureBaseline(opts) {
      const run = ensureBaselineInternal((opts && opts.explicit) ? 'explicit' : 'silent');
      return run;
    },

    loadRun(runId) {
      const run = state.runs[runId];
      if (!run) { actions.toast('运行 ' + runId + ' 不存在', 'danger'); return false; }
      if (run.role === 'baseline') state.baselineRun = run;
      setActiveRun(run);
      state.draft = clone(run.config);
      state.draftBaseHash = run.configHash;
      state.draftDirty = false;
      state.selectedComponent = defaultComponent(run.systemId);
      state.page = 'system';
      updateHashIfNeeded('system');
      persist();
      notify('run');
      return true;
    },

    deleteRun(runId) {
      if (state.activeRun && state.activeRun.runId === runId) {
        actions.toast('不能删除当前正在查看的运行', 'warn');
        return false;
      }
      delete state.runs[runId];
      if (state.baselineRun && state.baselineRun.runId === runId) state.baselineRun = null;
      if (state.monitorRun && state.monitorRun.runId === runId) state.monitorRun = null;
      persist();
      notify('run');
      return true;
    },

    navigate(pageId) {
      if (state.truthSealed && ['signals', 'causal', 'compare'].indexOf(pageId) >= 0) {
        actions.toast('盲测进行中：真值相关页面已封存，比赛结束后解锁', 'warn');
        return;
      }
      if (state.page === pageId) {
        notify('nav');
        return;
      }
      state.page = pageId;
      updateHashIfNeeded(pageId);
      notify('nav');
    },

    selectComponent(componentId) {
      state.selectedComponent = componentId;
      notify('selection');
    },

    updateDraft(patchOrFn) {
      if (!state.draft) return;
      const next = clone(state.draft);
      if (typeof patchOrFn === 'function') patchOrFn(next);
      else Object.assign(next, patchOrFn);
      state.draft = next;
      const val = validateDraft(next);
      state.draftErrors = val.errors || [];
      updateDirty();
      notify('draft');
    },

    setDraft(next) {
      state.draft = clone(next);
      const val = validateDraft(state.draft);
      state.draftErrors = val.errors || [];
      updateDirty();
      notify('draft');
    },

    resetDraft() {
      state.draft = systemDraft(state.systemId);
      state.draftErrors = [];
      updateDirty();
      actions.toast('草稿已恢复默认参数（历史运行不受影响）', 'info');
      notify('draft');
    },

    setTime(t, opts) {
      const o = opts || {};
      state.currentTime = clampTime(t);
      if (o.pause !== false && state.playback.status === 'playing') {
        state.playback.status = 'paused';
        stopClock();
      }
      notify('time');
    },

    play() {
      if (!state.activeRun) { actions.toast('请先创建运行', 'warn'); return; }
      if (state.playback.status === 'ended' || state.currentTime >= duration()) state.currentTime = 0;
      state.playback.status = 'playing';
      startClock();
      notify('playback');
    },

    pause() {
      if (state.playback.status !== 'playing') return;
      state.playback.status = 'paused';
      stopClock();
      notify('playback');
    },

    togglePlay() {
      if (state.playback.status === 'playing') actions.pause();
      else actions.play();
    },

    replay() {
      if (!state.activeRun) return;
      stopClock();
      state.currentTime = 0;
      state.playback.status = 'playing';
      startClock();
      notify('time');
      notify('playback');
    },

    setSpeed(speed) {
      const allowed = [0.5, 1, 2, 4];
      state.playback.speed = allowed.indexOf(speed) >= 0 ? speed : 1;
      notify('playback');
    },

    jumpToFault() {
      if (!state.activeRun) return;
      const ev = (FL.protocol && FL.protocol.faultEvent) ? FL.protocol.faultEvent(state.activeRun) : null;
      if (!ev) { actions.toast('本运行没有故障事件', 'info'); return; }
      actions.setTime(ev.trigger_s, { pause: true });
    },

    stepEvent(dir) {
      if (!state.activeRun) return;
      const evs = (state.activeRun.events || []).slice().sort((a, b) => a.trigger_s - b.trigger_s);
      if (!evs.length) return;
      let target = null;
      if (dir > 0) {
        target = evs.filter((e) => e.trigger_s > state.currentTime + 0.05)[0] || null;
      } else {
        target = evs.filter((e) => e.trigger_s < state.currentTime - 0.05).slice(-1)[0] || null;

      const prev = state.pageState[pageId] || {};
      state.pageState[pageId] = Object.assign({}, prev, patch || {});

    setChartCategory(category) {
      state.pageState.signals.category = category;

    closeDrawer() { state.drawer = null; notify('view'); },

    }

    state.runs = persisted.runs || {};
    const session = persisted.session || null;
    state.lastSession = session;

    // query params for QA / deep links: ?system=FC-001&page=system&demo=1
    let params = new URLSearchParams();
    try { params = new URLSearchParams(location.search); } catch (e) { /* ignore */ }
    if (params.get('reset') === '1') {
      try { localStorage.removeItem(LS_RUNS); localStorage.removeItem(LS_SESSION); } catch (e) { /* ignore */ }

    }

    state.draft = (session && session.draft && session.draft.systemId === sid) ? clone(session.draft) : systemDraft(sid);
    state.draftErrors = [];
    state.draftBaseHash = (session && session.systemDraftHash) || null;
    updateDirty();
    state.selectedComponent = defaultComponent(sid);

    // restore previous active run into registry refs (not auto-activated: home offers restore)
    // 深链接 ?system=X 时只恢复属于 X 的 Run，避免页面系统与 Run 系统不一致
    const restoredRun = (session && session.activeRunId) ? state.runs[session.activeRunId] : null;
    if (restoredRun && restoredRun.systemId === sid) {
      const r = restoredRun;
      if (r.role === 'baseline') state.baselineRun = r;
      else state.activeRun = r;
      state.draft = clone(r.config);
      state.draftBaseHash = r.configHash;
      state.draftErrors = [];
      updateDirty();
      state.computeState = 'completed';
      state.pageState.signals.category = (r.signals && r.signals[0] && r.signals[0].category) || 'current';
      state.pageState.signals.visible = defaultVisibleMap(r);
    }
    if (session && session.baselineRunId && state.runs[session.baselineRunId] &&
      state.runs[session.baselineRunId].systemId === sid) {
      state.baselineRun = state.runs[session.baselineRunId];
    }

    // page from hash / query
    let page = 'home';
    const hashMatch = /^#\/([a-z]+)/.exec(location.hash || '');
    if (hashMatch) page = hashMatch[1];
    const qPage = params.get('page');
    if (qPage) page = qPage;
    if (!FL.pages || !FL.pages[page]) page = 'home';

    // QA/demo bootstrap: ?demo=1 auto-creates a default fault run (+baseline)
    if (params.get('demo') === '1') {
      state.page = page;
      state.booted = true;
      if (!state.activeRun || state.activeRun.systemId !== sid) {
        state.activeRun = null;
        state.baselineRun = (state.baselineRun && state.baselineRun.systemId === sid) ? state.baselineRun : null;
        state.systemId = sid;
        state.draft = systemDraft(sid);
        actions.startExperiment(sid, { silent: true });
      }
      if (!state.baselineRun || state.baselineRun.systemId !== sid) ensureBaselineInternal();
      state.page = page;
      state.computeState = state.activeRun ? 'completed' : 'draft_valid';
      state.currentTime = params.get('t') ? clampTime(parseFloat(params.get('t'))) : 0;
      updateHashIfNeeded(page);
      notify('boot');
      return;
    }

    state.page = page;
    state.computeState = state.activeRun ? 'completed' : 'draft_valid';
    state.booted = true;
    updateHashIfNeeded(page);
    notify('boot');
  }

  function systemExists(sid) {
    try { return !!(FL.systems && FL.systems.list().filter((s) => s.id === sid).length); } catch (e) { return false; }

  FL.store = {
    getState: () => state,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    init,
    actions,
    stopClock
  };
})();

          vs[i] = toNum(p.v != null ? p.v : p.y);
        } else {
          ts[i] = NaN;
          vs[i] = NaN;
        }
      }
    } else {
      ts = new Float64Array(0);
      vs = new Float64Array(0);
    }

    // 防御：非单调时间轴排序（正常数据无需走这里）
    var sorted = true;
    for (var j = 1; j < n; j++) {
      if (!(ts[j] >= ts[j - 1])) {
        sorted = false;
        break;
      }
    }
    if (!sorted) {
      var idx = new Array(n);
      for (var k = 0; k < n; k++) idx[k] = k;
      idx.sort(function (x, y) { return (ts[x] - ts[y]) || (x - y); });
      var nts = new Float64Array(n);
      var nvs = new Float64Array(n);
      for (var q = 0; q < n; q++) {
        nts[q] = ts[idx[q]];
        nvs[q] = vs[idx[q]];
      }
      ts = nts;
      vs = nvs;
    }
    return { ts: ts, vs: vs, n: n };
  }

  function prepareSeries(raw, index) {
    if (!raw || typeof raw !== 'object') return null;
    var style = normalizeStyle(raw.style);
    var width = Number(raw.width);
    if (!isFinite(width) || width <= 0) width = style === 'dotted' ? 1.4 : 2;
    width = clamp(width, 0.5, 8);
    var opacity = Number(raw.opacity);
    if (!isFinite(opacity)) opacity = 1;
    opacity = clamp(opacity, 0, 1);
    var points = preparePoints(raw.points);
    var id = raw.id != null ? String(raw.id) : 'series-' + index;
    return {
      id: id,
      label: raw.label != null ? String(raw.label) : id,
      unit: raw.unit != null ? String(raw.unit) : '',
      axis: raw.axis === 'right' ? 'right' : 'left',
      style: style,
      width: width,
      opacity: opacity,
      step: !!raw.step,
      colorRaw: raw.color != null ? raw.color
        : (raw.colorToken != null ? raw.colorToken
          : (raw.token != null ? raw.token : 'ink')),
      visible: raw.visible !== false,
      ts: points.ts,
      vs: points.vs,
      n: points.n
    };
  }

  function prepareSeriesList(list) {
    var out = [];
    if (!list || typeof list.length !== 'number') return out;
    for (var i = 0; i < list.length; i++) {
      var s = prepareSeries(list[i], i);
      if (s) out.push(s);
    }
    return out;
  }

  function prepareEvents(list) {
    var out = [];
    if (!list || typeof list.length !== 'number') return out;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e || typeof e !== 'object') continue;
      var t = Number(e.t != null ? e.t : e.trigger_s);
      if (!isFinite(t)) continue;
      out.push({
        t: t,
        label: e.label != null ? String(e.label) : '',
        colorRaw: e.color != null ? e.color : null,
        style: e.style ? String(e.style) : 'fault'
      });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function normalizeXDomain(d, fallback) {
    var fb = Array.isArray(fallback) && fallback.length >= 2 ? [Number(fallback[0]), Number(fallback[1])] : [0, 60];
    if (!isFinite(fb[0]) || !isFinite(fb[1]) || fb[0] === fb[1]) fb = [0, 60];
    if (fb[0] > fb[1]) {
      var tmp = fb[0];
      fb[0] = fb[1];
      fb[1] = tmp;
    }
    if (!d || typeof d.length !== 'number' || d.length < 2) return fb.slice();
    var a = Number(d[0]);
    var b = Number(d[1]);
    if (!isFinite(a) || !isFinite(b)) return fb.slice();
    if (a > b) {
      var tmp2 = a;
      a = b;
      b = tmp2;
    }
    if (Math.abs(b - a) < 1e-9) {
      a -= 0.5;
      b += 0.5;
    }
    return [a, b];
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    var radius = Math.min(r, w / 2, h / 2);
    if (typeof ctx.roundRect === 'function') {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      return;
    }
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.arcTo(x + w, y, x + w, y + radius, radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.arcTo(x + w, y + h, x + w - radius, y + h, radius);
    ctx.lineTo(x + radius, y + h);
    ctx.arcTo(x, y + h, x, y + h - radius, radius);
    ctx.lineTo(x, y + radius);
    ctx.arcTo(x, y, x + radius, y, radius);
    ctx.closePath();
  }

  /* ------------------------------------------------------------------ *
   * 图表实例
   * ------------------------------------------------------------------ */

  function createChart(canvasEl, opts) {
    var canvas = canvasEl;
    if (typeof canvas === 'string') canvas = document.querySelector(canvasEl);
    if (!canvas || !canvas.getContext) {
      throw new Error('FL.chart.create: 需要 <canvas> 元素');
    }
    var ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('FL.chart.create: 无法获取 2d 上下文');

    var o = opts || {};

    var state = {
      destroyed: false,
      width: 0,
      height: 0,
      dpr: 1,
      series: [],
      events: [],
      cursorT: null,
      selectedT: null,
      hover: null,
      xDomain: normalizeXDomain(o.xDomain, [0, 60]),
      defaultXDomain: normalizeXDomain(o.xDomain, [0, 60]),
      userY: null,
      userYRight: null,
      paddings: {
        l: o.paddings && isNum(o.paddings.l) ? o.paddings.l : 56,
        r: o.paddings && isNum(o.paddings.r) ? o.paddings.r : 18,
        t: o.paddings && isNum(o.paddings.t) ? o.paddings.t : 18,
        b: o.paddings && isNum(o.paddings.b) ? o.paddings.b : 30
      },
      heightOpt: isNum(o.height) ? o.height : 320,
      ariaLabel: typeof o.ariaLabel === 'string' ? o.ariaLabel : '实时曲线图',
      themeOverrides: null,
      themeCache: null,
      rafId: 0,
      ro: null,
      drag: null,
      hoverTarget: null,
      cursorStyle: '',
      plot: null,
      yL: null,
      yR: null,
      xTicks: [],
      resetTheme: null
    };

    /* ---------------- 尺寸 / DPR ---------------- */

    function measure() {
      var cssW = canvas.clientWidth || 0;
      var parent = canvas.parentElement;
      if (!cssW && parent) cssW = parent.clientWidth || 0;
      if (!cssW) cssW = 640;
      if (!cssW || !isFinite(cssW)) cssW = 640;

      var cssH = state.heightOpt > 0 ? state.heightOpt : 320;

      if (canvas.style.display !== 'block') canvas.style.display = 'block';
      if (canvas.style.width !== '100%') canvas.style.width = '100%';
      if (canvas.style.height !== cssH + 'px') canvas.style.height = cssH + 'px';

      var dpr = window.devicePixelRatio || 1;
      if (!isFinite(dpr) || dpr <= 0) dpr = 1;
      if (dpr > 3) dpr = 3;
      var bw = Math.max(1, Math.round(cssW * dpr));
      var bh = Math.max(1, Math.round(cssH * dpr));
      if (canvas.width !== bw || canvas.height !== bh) {
        canvas.width = bw;
        canvas.height = bh;
      }
      state.width = cssW;
      state.height = cssH;
      state.dpr = dpr;
    }

    /* ---------------- 主题 ---------------- */

    function instanceTheme() {
      var base = getBaseTheme();
      var ov = state.themeOverrides;
      if (!ov) return base;
      if (state.themeCache) return state.themeCache;
      var colors = {};
      var k;
      for (k in base.colors) colors[k] = base.colors[k];
      if (ov.colors && typeof ov.colors === 'object') {
        for (k in ov.colors) if (ov.colors[k] != null) colors[k] = ov.colors[k];
      }
      for (k in ov) {
        if (k === 'colors' || k === 'fontMono' || k === 'fontBody') continue;
        var alias = TOKEN_ALIAS[k];
        if (alias && ov[k] != null) colors[alias] = ov[k];
      }
      var theme = {
        colors: colors,
        vars: base.vars,
        fontMono: ov.fontMono || base.fontMono,
        fontBody: ov.fontBody || base.fontBody
      };
      state.themeCache = theme;
      return theme;
    }

    /* ---------------- 坐标映射 ---------------- */

    function xToPx(t) {
      var plot = state.plot;
      if (!plot) return null;
      var dom = state.xDomain;
      var span = dom[1] - dom[0];
      if (!(span > 0)) return plot.x;
      return plot.x + ((t - dom[0]) / span) * plot.w;
    }

    function yToPx(v, axis) {
      var plot = state.plot;
      if (!plot || !axis) return null;
      var span = axis.hi - axis.lo;
      if (!(span > 1e-12)) return plot.y + plot.h / 2;
      return plot.y + ((axis.hi - v) / span) * plot.h;
    }

    function tFromPx(px) {
      var plot = state.plot;
      if (!plot) return null;
      var x = clamp(px, plot.x, plot.x + plot.w);
      var dom = state.xDomain;
      return dom[0] + ((x - plot.x) / plot.w) * (dom[1] - dom[0]);
    }

    function localPoint(e) {
      var rect = canvas.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      if (!isFinite(x) || !isFinite(y)) {
        x = e.offsetX;
        y = e.offsetY;
      }
      return { x: x, y: y };
    }

    function inPlot(x, y) {
      var p = state.plot;
      if (!p) return false;
      return x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h;
    }

    function snapTime(t) {
      if (!isFinite(t)) return null;
      var list = state.series;
      var i;
      for (i = 0; i < list.length; i++) {
        if (list[i].visible !== false && list[i].n > 0) {
          var idx = nearestIndex(list[i].ts, list[i].n, t);
          if (idx >= 0) return cleanFloat(list[i].ts[idx]);
          break;
        }
      }
      return Math.round(t * 10) / 10;
    }

    function activeSeries() {
      var out = [];
      for (var i = 0; i < state.series.length; i++) {
        if (state.series[i].visible !== false) out.push(state.series[i]);
      }
      return out;
    }

    function valuesAt(t) {
      var values = {};
      var list = activeSeries();
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var v = valueAtPoint(s, t);
        values[s.id] = v == null || !isFinite(v) ? null : v;
      }
      return values;
    }

    /* ---------------- 刻度 / 轴 ---------------- */

    function axisUnits(side) {
      var units = [];
      var list = activeSeries();
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        if (s.axis !== side) continue;
        if (!hasFiniteData(s)) continue;
        if (s.unit && units.indexOf(s.unit) < 0) units.push(s.unit);
      }
      if (units.length === 0) return '';
      return units.join(' / ');
    }

    /** 序列是否至少有一个有限采样（全 null 的通道不应参与轴标题/轴范围） */
    function hasFiniteData(series) {
      var vs = series.vs;
      for (var i = 0; i < series.n; i++) if (isFinite(vs[i])) return true;
      return false;
    }

    function collectDataRange(side) {
      var min = Infinity;
      var max = -Infinity;
      var found = false;
      var dom = state.xDomain;
      var list = activeSeries();
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        if (s.axis !== side || s.n === 0) continue;
        var i0 = lowerBound(s.ts, s.n, dom[0]);
        var i1 = upperBound(s.ts, s.n, dom[1]) - 1;
        if (i1 < i0) {
          // 视窗内没有采样点：退回整条序列，避免空轴
          i0 = 0;
          i1 = s.n - 1;
        }
        for (var k = i0; k <= i1; k++) {
          var v = s.vs[k];
          if (isFinite(v)) {
            found = true;
            if (v < min) min = v;
            if (v > max) max = v;
          }
        }
      }
      return { min: min, max: max, found: found };
    }

    function computeAxis(side) {
      var user = side === 'right' ? state.userYRight : state.userY;
      if (Array.isArray(user) && user.length >= 2 && isNum(Number(user[0])) && isNum(Number(user[1]))) {
        var scaleU = exactScale(user[0], user[1], side === 'right' ? 4 : 5);
        scaleU.title = axisUnits(side);
        return scaleU;
      }
      var has = false;
      var list = activeSeries();
      for (var i = 0; i < list.length; i++) {
        if (list[i].axis === side && list[i].n > 0 && hasFiniteData(list[i])) {
          has = true;
          break;
        }
      }
      if (!has) {
        // 该侧没有可绘制数据（无序列或全为 null）：不画 fake 轴
        return null;
      }
      var range = collectDataRange(side);
      if (!range.found) return null;
      var scale = niceScale(range.min, range.max, side === 'right' ? 4 : 5);
      scale.title = axisUnits(side);
      return scale;
    }

    function makeXTicks(dom) {
      var span = dom[1] - dom[0];
      var target = span >= 30 ? 6 : (span >= 12 ? 6 : (span >= 4 ? 5 : 4));
      var step = niceNum(span / Math.max(1, target - 1), true);
      var start = Math.ceil(dom[0] / step - 1e-9) * step;
      var ticks = [];
      for (var v = start, i = 0; v <= dom[1] + step * 1e-9 && i < 40; i++, v = start + i * step) {
        ticks.push(cleanFloat(v));
      }
      if (ticks.length < 2) ticks = [cleanFloat(dom[0]), cleanFloat(dom[1])];
      return {
        ticks: ticks,
        step: step,
        decimals: decimalsForStep(step)
      };
    }

    function computeLayout(theme, yL, yR) {
      ctx.font = pxFont(10, theme.fontMono);
      var leftW = 0;
      var i;
      if (yL) {
        for (i = 0; i < yL.ticks.length; i++) {
          var w = ctx.measureText(fmtTick(yL.ticks[i], yL.decimals)).width;
          if (w > leftW) leftW = w;
        }
      }
      var rightW = 0;
      if (yR) {
        for (i = 0; i < yR.ticks.length; i++) {
          var w2 = ctx.measureText(fmtTick(yR.ticks[i], yR.decimals)).width;
          if (w2 > rightW) rightW = w2;
        }
      }
      var leftTitle = !!(yL && yL.title);
      var rightTitle = !!(yR && yR.title);
      var l = Math.max(state.paddings.l, 10 + leftW + (leftTitle ? 14 : 0));
      var r = Math.max(state.paddings.r, 10 + rightW + (rightTitle ? 14 : 0));
      var t = Math.max(state.paddings.t, state.events.length > 0 ? 30 : 16);
      var b = Math.max(state.paddings.b, 34);
      var width = state.width;
      var height = state.height;
      var plot = {
        x: l,
        y: t,
        w: Math.max(10, width - l - r),
        h: Math.max(10, height - t - b)
      };
      state.plot = plot;
      state.yL = yL;
      state.yR = yR;
      state.xTicks = makeXTicks(state.xDomain);
    }

    /* ---------------- 绘制：网格 / 坐标 ---------------- */

    function drawGrid(theme, yL, yR) {
      var plot = state.plot;
      var colors = theme.colors;
      var i;

      // 横向网格（优先左轴；只有右轴序列时用右轴）
      var gridAxis = yL || yR;
      if (gridAxis) {
        ctx.save();
        ctx.lineWidth = 1;
        ctx.strokeStyle = colors.grid;
        ctx.globalAlpha = 0.45;
        ctx.beginPath();
        for (i = 0; i < gridAxis.ticks.length; i++) {
          var gpy = yToPx(gridAxis.ticks[i], gridAxis);
          if (gpy >= plot.y - 0.5 && gpy <= plot.y + plot.h + 0.5) {
            ctx.moveTo(plot.x, gpy + 0.5);
            ctx.lineTo(plot.x + plot.w, gpy + 0.5);
          }
        }
        ctx.stroke();
        ctx.restore();
      }

      // 纵向网格（时间轴）
      var xt = state.xTicks;
      if (xt) {
        ctx.save();
        ctx.lineWidth = 1;
        ctx.strokeStyle = colors.grid;
        ctx.globalAlpha = 0.32;
        ctx.beginPath();
        for (i = 0; i < xt.ticks.length; i++) {
          var v = xt.ticks[i];
          if (v < state.xDomain[0] - 1e-9 || v > state.xDomain[1] + 1e-9) continue;
          var px = xToPx(v);
          ctx.moveTo(px + 0.5, plot.y);
          ctx.lineTo(px + 0.5, plot.y + plot.h);
        }
        ctx.stroke();
        ctx.restore();
      }

      // 零线（当 y 域跨 0）
      if (gridAxis && gridAxis.lo < 0 && gridAxis.hi > 0) {
        var zy = yToPx(0, gridAxis);
        ctx.save();
        ctx.strokeStyle = colors.line2;
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(plot.x, zy + 0.5);
        ctx.lineTo(plot.x + plot.w, zy + 0.5);
        ctx.stroke();
        ctx.restore();
      }

      // 边框
      ctx.save();
      ctx.strokeStyle = colors.axis;
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 1;
      ctx.strokeRect(plot.x + 0.5, plot.y + 0.5, plot.w - 1, plot.h - 1);
      ctx.restore();

      // 左轴刻度 + 标签
      ctx.save();
      ctx.font = pxFont(10, theme.fontMono);
      ctx.fillStyle = colors.ink2;
      ctx.textBaseline = 'middle';
      if (yL) {
        ctx.textAlign = 'right';
        for (i = 0; i < yL.ticks.length; i++) {
          var ly = yToPx(yL.ticks[i], yL);
          if (ly < plot.y - 0.5 || ly > plot.y + plot.h + 0.5) continue;
          ctx.globalAlpha = 1;
          ctx.fillText(fmtTick(yL.ticks[i], yL.decimals), plot.x - 8, ly);
          ctx.strokeStyle = colors.axis;
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.moveTo(plot.x - 4, ly + 0.5);
          ctx.lineTo(plot.x, ly + 0.5);
          ctx.stroke();
        }
      }
      if (yR) {
        ctx.textAlign = 'left';
        for (i = 0; i < yR.ticks.length; i++) {
          var ry = yToPx(yR.ticks[i], yR);
          if (ry < plot.y - 0.5 || ry > plot.y + plot.h + 0.5) continue;
          ctx.globalAlpha = 1;
          ctx.fillText(fmtTick(yR.ticks[i], yR.decimals), plot.x + plot.w + 8, ry);
          ctx.strokeStyle = colors.axis;
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.moveTo(plot.x + plot.w, ry + 0.5);
          ctx.lineTo(plot.x + plot.w + 4, ry + 0.5);
          ctx.stroke();
        }
      }
      ctx.restore();

      // 时间刻度 + 标签
      if (xt) {
        ctx.save();
        ctx.font = pxFont(10, theme.fontMono);
        ctx.fillStyle = colors.ink2;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        var lastRight = -Infinity;
        for (i = 0; i < xt.ticks.length; i++) {
          var tv = xt.ticks[i];
          if (tv < state.xDomain[0] - 1e-9 || tv > state.xDomain[1] + 1e-9) continue;
          var tpx = xToPx(tv);
          var label = fmtTick(tv, xt.decimals);
          var tw = ctx.measureText(label).width;
          if (tpx - tw / 2 < lastRight + 2) continue;
          lastRight = tpx + tw / 2;
          ctx.globalAlpha = 1;
          ctx.fillText(label, tpx, plot.y + plot.h + 16);
          ctx.strokeStyle = colors.axis;
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.moveTo(tpx + 0.5, plot.y + plot.h);
          ctx.lineTo(tpx + 0.5, plot.y + plot.h + 4);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawAxisTitles(theme, yL, yR) {
      var plot = state.plot;
      var colors = theme.colors;
      ctx.save();
      ctx.font = pxFont(9, theme.fontMono);
      ctx.fillStyle = colors.ink3;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (yL && yL.title) {
        ctx.save();
        ctx.translate(10, plot.y + plot.h / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(yL.title, 0, 0);
        ctx.restore();
      }
      if (yR && yR.title) {
        ctx.save();
        ctx.translate(state.width - 10, plot.y + plot.h / 2);
        ctx.rotate(Math.PI / 2);
        ctx.fillText(yR.title, 0, 0);
        ctx.restore();
      }
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('时间 / s', plot.x + plot.w / 2, state.height - 5);
      ctx.restore();
    }

    /* ---------------- 绘制：事件 ---------------- */

    function drawEventMarker(px, color, style, theme) {
      var plot = state.plot;
      if (style === 'fault') {
        var top = plot.y - 12;
        var apex = plot.y - 2;
        ctx.save();
        // 故障三角（形态 + 颜色双通道）
        ctx.beginPath();
        ctx.moveTo(px, apex);
        ctx.lineTo(px - 7, top);
        ctx.lineTo(px + 7, top);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.globalAlpha = 1;
        ctx.fill();
        // 三角内斜纹：避免只靠颜色区分
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(px - 7, top);
        ctx.lineTo(px + 7, top);
        ctx.lineTo(px, apex);
        ctx.closePath();
        ctx.clip();
        ctx.strokeStyle = theme.colors.bg0;
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 1.2;
        for (var hx = -11; hx <= 9; hx += 5) {
          ctx.beginPath();
          ctx.moveTo(px + hx, top);
          ctx.lineTo(px + hx + 12, top + 12);
          ctx.stroke();
        }
        ctx.restore();
        ctx.restore();
      } else {
        // 非故障标记：空心菱形
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = theme.colors.bg1;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(px, plot.y - 11);
        ctx.lineTo(px + 5, plot.y - 6);
        ctx.lineTo(px, plot.y - 1);
        ctx.lineTo(px - 5, plot.y - 6);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawEvents(theme) {
      var plot = state.plot;
      if (!state.events.length) return;
      var dom = state.xDomain;
      var lastLabelRight = -Infinity;
      var lastLabelLeft = Infinity;
      for (var i = 0; i < state.events.length; i++) {
        var ev = state.events[i];
        if (ev.t < dom[0] - 1e-9 || ev.t > dom[1] + 1e-9) continue;
        var px = xToPx(ev.t);
        var color = ev.colorRaw != null ? resolveColor(ev.colorRaw, theme) : theme.colors.fault;
        var style = ev.style || 'fault';

        // 竖向事件线（绘制在序列之下）
        ctx.save();
        ctx.strokeStyle = color;
        ctx.globalAlpha = style === 'fault' ? 0.85 : 0.55;
        ctx.lineWidth = 1;
        ctx.setLineDash(style === 'fault' ? [4, 4] : [2, 4]);
        ctx.beginPath();
        ctx.moveTo(px + 0.5, plot.y);
        ctx.lineTo(px + 0.5, plot.y + plot.h);
        ctx.stroke();
        ctx.restore();

        // 顶部标记
        drawEventMarker(px, color, style, theme);

        // 标签：靠近右边界时右对齐；与相邻标签重叠时跳过（线/三角仍在）
        var label = ev.label || ('事件 ' + fmtSeconds(ev.t));
        ctx.save();
        ctx.font = pxFont(10, theme.fontMono);
        ctx.fillStyle = color;
        ctx.textBaseline = 'alphabetic';
        var tw = ctx.measureText(label).width;
        var x0 = px + 8;
        var align = 'left';
        if (x0 + tw > state.width - 6) {
          x0 = px - 8;
          align = 'right';
        }
        var left = align === 'left' ? x0 : (px - 8 - tw);
        var right = left + tw;
        if (right + 4 < lastLabelLeft || left - 4 > lastLabelRight) {
          ctx.textAlign = align;
          ctx.fillText(label, x0, 13);
          lastLabelLeft = left;
          lastLabelRight = right;
        }
        ctx.restore();
      }
    }

    /* ---------------- 绘制：序列 ---------------- */

    function strokeSeries(series, theme) {
      var plot = state.plot;
      var axis = series.axis === 'right' ? state.yR : state.yL;
      if (!axis || series.n === 0) return;
      var dom = state.xDomain;
      var span = dom[1] - dom[0];
      if (!(span > 0)) return;
      var sx = plot.w / span;
      var sy;
      var axisSpan = axis.hi - axis.lo;
      if (!(Math.abs(axisSpan) > 1e-12)) return;
      sy = plot.h / axisSpan;

      var color = resolveColor(series.colorRaw, theme);
      var ts = series.ts;
      var vs = series.vs;
      var n = series.n;

      ctx.save();
      ctx.globalAlpha = series.opacity;
      ctx.strokeStyle = color;
      ctx.lineWidth = series.width;
      ctx.lineJoin = 'miter';
      ctx.lineCap = 'butt';
      ctx.setLineDash(STYLE_DASH[series.style] || []);
      ctx.beginPath();

      var started = false;
      var lastY = 0;
      for (var i = 0; i < n; i++) {
        var v = vs[i];
        if (!isFinite(v)) {
          started = false;
          continue;
        }
        var px = plot.x + (ts[i] - dom[0]) * sx;
        var py = plot.y + (axis.hi - v) * sy;
        if (!started) {
          ctx.moveTo(px, py);
          started = true;
        } else if (series.step) {
          // 采样保持：先水平，再垂直（跨 20.0 s 跳变不平滑）
          ctx.lineTo(px, lastY);
          ctx.lineTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
        lastY = py;
      }
      ctx.stroke();

      // 单点序列：绘制一个可见点
      if (n === 1 && isFinite(vs[0])) {
        var px1 = plot.x + (ts[0] - dom[0]) * sx;
        var py1 = plot.y + (axis.hi - vs[0]) * sy;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(px1, py1, Math.max(2, series.width + 1), 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }
      ctx.restore();
    }

    function drawAllSeries(theme) {
      var list = activeSeries();
      for (var i = 0; i < list.length; i++) strokeSeries(list[i], theme);
    }

    /* ---------------- 绘制：游标 / 选中 / hover ---------------- */

    function drawTimeBadge(px, t, theme) {
      var plot = state.plot;
      var label = fmtSeconds(t);
      ctx.save();
      ctx.font = pxFont(10, theme.fontMono);
      var tw = ctx.measureText(label).width;
      var bw = tw + 12;
      var bh = 16;
      var bx = clamp(px - bw / 2, plot.x + 2, plot.x + plot.w - bw - 2);
      var by = plot.y + plot.h - bh - 5;
      roundRectPath(ctx, bx, by, bw, bh, 3);
      ctx.fillStyle = theme.colors.bg2;
      ctx.globalAlpha = 0.96;
      ctx.fill();
      ctx.strokeStyle = theme.colors.line2;
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = theme.colors.ink0;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, bx + bw / 2, by + bh / 2 + 0.5);
      ctx.restore();
    }

    function drawCursor(theme) {
      var plot = state.plot;
      var t = state.cursorT;
      if (t == null || !isFinite(t)) return;
      var dom = state.xDomain;
      var inside = t >= dom[0] - 1e-9 && t <= dom[1] + 1e-9;
      var px = inside ? xToPx(t) : (t < dom[0] ? plot.x : plot.x + plot.w);
      if (px == null) return;

      // 游标竖线（白色虚线）
      ctx.save();
      ctx.strokeStyle = theme.colors.cursor;
      ctx.globalAlpha = inside ? 0.9 : 0.3;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(px + 0.5, plot.y);
      ctx.lineTo(px + 0.5, plot.y + plot.h);
      ctx.stroke();
      ctx.restore();

      if (!inside) return;

      // 各序列交点圆点
      var list = activeSeries();
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var axis = s.axis === 'right' ? state.yR : state.yL;
        if (!axis) continue;
        var v = valueAtPoint(s, t);
        if (v == null || !isFinite(v)) continue;
        var py = yToPx(v, axis);
        if (py == null) continue;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fillStyle = resolveColor(s.colorRaw, theme);
        ctx.fill();
        ctx.strokeStyle = theme.colors.bg1;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      drawTimeBadge(px, t, theme);
    }

    function drawSelected(theme) {
      var t = state.selectedT;
      if (t == null || !isFinite(t)) return;
      var dom = state.xDomain;
      if (t < dom[0] - 1e-9 || t > dom[1] + 1e-9) return;
      var px = xToPx(t);
      if (px == null) return;
      var list = activeSeries();
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var axis = s.axis === 'right' ? state.yR : state.yL;
        if (!axis) continue;
        var v = valueAtPoint(s, t);
        if (v == null || !isFinite(v)) continue;
        var py = yToPx(v, axis);
        // 选中数据点：外环强调 + 内点保持序列色（形态可辨）
        ctx.beginPath();
        ctx.arc(px, py, 5.5, 0, Math.PI * 2);
        ctx.strokeStyle = theme.colors.ink0;
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(px, py, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = resolveColor(s.colorRaw, theme);
        ctx.fill();
      }
    }

    function drawHover(theme) {
      var h = state.hover;
      if (!h || h.t == null) return;
      var plot = state.plot;
      var px = xToPx(h.t);
      if (px == null) return;
      // 与游标重合时不再画第二条竖线
      if (state.cursorT != null) {
        var cx = xToPx(state.cursorT);
        if (cx != null && Math.abs(cx - px) < 5) return;
      }
      ctx.save();
      ctx.strokeStyle = theme.colors.ink2;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.moveTo(px + 0.5, plot.y);
      ctx.lineTo(px + 0.5, plot.y + plot.h);
      ctx.stroke();
      ctx.restore();

      var list = activeSeries();
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var axis = s.axis === 'right' ? state.yR : state.yL;
        if (!axis) continue;
        var v = valueAtPoint(s, h.t);
        if (v == null || !isFinite(v)) continue;
        var py = yToPx(v, axis);
        ctx.beginPath();
        ctx.arc(px, py, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = resolveColor(s.colorRaw, theme);
        ctx.fill();
        ctx.strokeStyle = theme.colors.bg1;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawEmptyMessage(theme) {
      var list = activeSeries();
      var any = false;
      var hasSeries = false;
      for (var i = 0; i < list.length; i++) {
        var series = list[i];
        if (series.n > 0) hasSeries = true;
        for (var k = 0; k < series.n; k++) {
          if (isFinite(series.vs[k])) {
            any = true;
            break;
          }
        }
        if (any) break;
      }
      if (any) return;
      var plot = state.plot;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = pxFont(12, theme.fontBody);
      ctx.fillStyle = theme.colors.ink3;
      ctx.fillText(hasSeries ? '该分类在当前场景下没有采样（值为 null）' : '暂无可绘制的信号数据',
        plot.x + plot.w / 2, plot.y + plot.h / 2 - 8);
      ctx.font = pxFont(10, theme.fontMono);
      ctx.globalAlpha = 0.85;
      ctx.fillText(hasSeries ? '例如执行器故障通道只在对应场景下有数据' : '请在左侧勾选信号，或创建实验运行',
        plot.x + plot.w / 2, plot.y + plot.h / 2 + 12);
      ctx.restore();
    }

    /* ---------------- 主绘制 ---------------- */

    function draw() {
      if (state.destroyed || !ctx) return;
      measure();
      var theme = instanceTheme();
      var W = state.width;
      var H = state.height;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'miter';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';

      var yL = computeAxis('left');
      var yR = computeAxis('right');
      computeLayout(theme, yL, yR);
      var plot = state.plot;
      if (!plot || plot.w <= 0 || plot.h <= 0) return;

      drawGrid(theme, yL, yR);
      drawEvents(theme);

      // 序列裁剪在绘图区内
      ctx.save();
      ctx.beginPath();
      ctx.rect(plot.x, plot.y, plot.w, plot.h);
      ctx.clip();
      drawAllSeries(theme);
      ctx.restore();

      drawCursor(theme);
      drawSelected(theme);
      drawHover(theme);
      drawAxisTitles(theme, yL, yR);
      drawEmptyMessage(theme);
    }

    /* ---------------- 调度 ---------------- */

    function scheduleRender() {
      if (state.destroyed) return;
      if (state.rafId) return;
      var raf = window.requestAnimationFrame;
      if (typeof raf === 'function') {
        state.rafId = raf(function () {
          state.rafId = 0;
          try {
            draw();
          } catch (err) {
            if (window.console && window.console.error) {
              window.console.error('[FL.chart] 绘制异常：', err);
            }
          }
        });
      } else {
        state.rafId = 1;
        window.setTimeout(function () {
          state.rafId = 0;
          draw();
        }, 16);
      }
    }

    /* ---------------- 指针交互 ---------------- */

    function setCursorStyle(style) {
      if (state.cursorStyle === style) return;
      state.cursorStyle = style;
      canvas.style.cursor = style;
    }

    function updateHover(pos) {
      if (!pos) return;
      if (!inPlot(pos.x, pos.y)) {
        if (state.hover) {
          state.hover = null;
          scheduleRender();
          if (state.hoverTarget != null) {
            state.hoverTarget = null;
            safeCall(o.onHover, null);
          }
        }
        return;
      }
      var t = tFromPx(pos.x);
      if (t == null) return;
      var snapped = snapTime(t);
      if (snapped == null) return;
      var values = valuesAt(snapped);
      state.hover = { t: snapped, x: pos.x, y: pos.y };
      state.hoverTarget = snapped;
      setCursorStyle(
        state.cursorT != null && Math.abs(pos.x - (xToPx(state.cursorT) || -9999)) < 6 ? 'ew-resize' : 'crosshair'
      );
      scheduleRender();
      safeCall(o.onHover, { t: snapped, values: values, x: pos.x, y: pos.y });
    }

    function emitDrag(t) {
      var snapped = snapTime(t);
      if (snapped == null) return;
      state.cursorT = snapped;
      scheduleRender();
      safeCall(o.onCursorDrag, snapped);
    }

    function onPointerDown(e) {
      if (state.destroyed) return;
      if (e.button != null && e.button !== 0) return;
      var pos = localPoint(e);
      if (!inPlot(pos.x, pos.y)) return;
      var t = tFromPx(pos.x);
      if (t == null) return;
      state.drag = {
        pointerId: e.pointerId,
        startX: pos.x,
        startY: pos.y,
        moved: 0
      };
      try {
        if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      } catch (err) { /* ignore */ }
      setCursorStyle('ew-resize');
      emitDrag(t);
      if (e.preventDefault) e.preventDefault();
    }

    function onPointerMove(e) {
      if (state.destroyed) return;
      var pos = localPoint(e);
      if (state.drag && e.pointerId === state.drag.pointerId) {
        state.drag.moved = Math.max(
          state.drag.moved,
          Math.sqrt(Math.pow(pos.x - state.drag.startX, 2) + Math.pow(pos.y - state.drag.startY, 2))
        );
        var t = tFromPx(pos.x);
        if (t != null) emitDrag(t);
        if (e.preventDefault) e.preventDefault();
        return;
      }
      updateHover(pos);
    }

    function onPointerUp(e) {
      if (state.destroyed) return;
      var drag = state.drag;
      if (!drag || e.pointerId !== drag.pointerId) return;
      state.drag = null;
      try {
        if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
      } catch (err) { /* ignore */ }
      var pos = localPoint(e);
      var t = null;
      if (inPlot(pos.x, pos.y)) t = tFromPx(pos.x);
      if (t == null) t = drag.startX != null ? tFromPx(drag.startX) : null;
      var snapped = t == null ? null : snapTime(t);
      if (snapped != null && drag.moved < 4) {
        // 视为点击：页面据此吸附最近采样点并显示元数据
        safeCall(o.onClick, { t: snapped });
      }
      state.drag = null;
      updateHover(pos);
      scheduleRender();
    }

    function onPointerCancel(e) {
      if (state.destroyed) return;
      if (state.drag && e.pointerId === state.drag.pointerId) state.drag = null;
      scheduleRender();
    }

    function onPointerLeave() {
      if (state.destroyed) return;
      if (state.drag) return;
      if (state.hover) {
        state.hover = null;
        state.hoverTarget = null;
        scheduleRender();
        safeCall(o.onHover, null);
      }
      setCursorStyle('default');
    }

    function bind(el, type, fn, options) {
      el.addEventListener(type, fn, options || false);
      state.listeners.push({ el: el, type: type, fn: fn, options: options || false });
    }

    if (!state.listeners) state.listeners = [];
    bind(canvas, 'pointerdown', onPointerDown);
    bind(canvas, 'pointermove', onPointerMove);
    bind(canvas, 'pointerup', onPointerUp);
    bind(canvas, 'pointercancel', onPointerCancel);
    bind(canvas, 'pointerleave', onPointerLeave);
    canvas.style.touchAction = 'pan-y';

    function onWindowResize() {
      scheduleRender();
    }
    bind(window, 'resize', onWindowResize);

    // 容器宽度自适应（ResizeObserver 可用时监听父容器；否则依赖 window resize）
    if (typeof window.ResizeObserver === 'function') {
      try {
        state.ro = new window.ResizeObserver(function () {
          scheduleRender();
        });
        state.ro.observe(canvas.parentElement || canvas);
      } catch (err) {
        state.ro = null;
      }
    }

    // canvas 可访问性
    if (!canvas.getAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.getAttribute('aria-label')) canvas.setAttribute('aria-label', state.ariaLabel);

    /* ---------------- 公共 API ---------------- */

    var api = {
      el: canvas,

      setSeries: function (list) {
        if (state.destroyed) return api;
        state.series = prepareSeriesList(list);
        scheduleRender();
        return api;
      },

      setEvents: function (list) {
        if (state.destroyed) return api;
        state.events = prepareEvents(list);
        scheduleRender();
        return api;
      },

      setCursor: function (t) {
        if (state.destroyed) return api;
        var v = t == null ? null : Number(t);
        if (v != null && !isFinite(v)) v = null;
        if (v === state.cursorT) return api;
        state.cursorT = v;
        scheduleRender();
        return api;
      },

      setSelectedPoint: function (t) {
        if (state.destroyed) return api;
        var v = t == null ? null : Number(t);
        if (v != null && !isFinite(v)) v = null;
        if (v === state.selectedT) return api;
        state.selectedT = v;
        scheduleRender();
        return api;
      },

      setDomain: function (domain) {
        if (state.destroyed) return api;
        if (!domain || typeof domain !== 'object') return api;
        if ('x' in domain) {
          state.xDomain = domain.x == null ? state.defaultXDomain.slice() : normalizeXDomain(domain.x, state.defaultXDomain);
        }
        if ('y' in domain) {
          if (domain.y == null) state.userY = null;
          else if (Array.isArray(domain.y) && domain.y.length >= 2 && isNum(Number(domain.y[0])) && isNum(Number(domain.y[1]))) {
            state.userY = [Number(domain.y[0]), Number(domain.y[1])];
          }
        }
        if ('yRight' in domain) {
          if (domain.yRight == null) state.userYRight = null;
          else if (Array.isArray(domain.yRight) && domain.yRight.length >= 2 && isNum(Number(domain.yRight[0])) && isNum(Number(domain.yRight[1]))) {
            state.userYRight = [Number(domain.yRight[0]), Number(domain.yRight[1])];
          }
        }
        scheduleRender();
        return api;
      },

      setTheme: function (theme) {
        if (state.destroyed) return api;
        if (!theme || typeof theme !== 'object') {
          state.themeOverrides = null;
        } else {
          var prev = state.themeOverrides || {};
          var merged = {};
          var k;
          for (k in prev) merged[k] = prev[k];
          for (k in theme) merged[k] = theme[k];
          state.themeOverrides = merged;
        }
        state.themeCache = null;
        scheduleRender();
        return api;
      },

      resize: function () {
        if (state.destroyed) return api;
        measure();
        scheduleRender();
        return api;
      },

      render: function () {
        if (state.destroyed) return api;
        scheduleRender();
        return api;
      },

      // 扩展（非契约必需）：页面响应断点时调整逻辑高度
      setHeight: function (h) {
        if (state.destroyed) return api;
        if (isNum(h) && h > 0) {
          state.heightOpt = h;
          scheduleRender();
        }
        return api;
      },

      setAriaLabel: function (text) {
        if (state.destroyed) return api;
        if (typeof text === 'string' && text) canvas.setAttribute('aria-label', text);
        return api;
      },

      getCursor: function () {
        return state.cursorT;
      },

      // 扩展（非契约必需）：QA / 页面自测读取当前布局与视窗
      getLayout: function () {
        if (state.destroyed) return null;
        var plot = state.plot;
        return {
          width: state.width,
          height: state.height,
          plot: plot ? { x: plot.x, y: plot.y, w: plot.w, h: plot.h } : null,
          xDomain: state.xDomain.slice(),
          yL: state.yL ? { lo: state.yL.lo, hi: state.yL.hi } : null,
          yR: state.yR ? { lo: state.yR.lo, hi: state.yR.hi } : null,
          yDomainUser: state.userY ? state.userY.slice() : null,
          cursor: state.cursorT,
          selected: state.selectedT,
          series: state.series.map(function (s) {
            return { id: s.id, unit: s.unit, axis: s.axis, style: s.style, opacity: s.opacity, n: s.n, step: s.step };
          }),
          events: state.events.map(function (e) { return e.t; })
        };
      },

      isDestroyed: function () {
        return state.destroyed;
      },

      destroy: function () {
        if (state.destroyed) return;
        state.destroyed = true;
        if (state.rafId) {
          try {
            if (window.cancelAnimationFrame) window.cancelAnimationFrame(state.rafId);
          } catch (err) { /* ignore */ }
          state.rafId = 0;
        }
        for (var i = 0; i < state.listeners.length; i++) {
          var l = state.listeners[i];
          try {
            l.el.removeEventListener(l.type, l.fn, l.options);
          } catch (err) { /* ignore */ }
        }
        state.listeners = [];
        if (state.ro) {
          try {
            state.ro.disconnect();
          } catch (err) { /* ignore */ }
          state.ro = null;
        }
        if (state.resetTheme) {
          var idx = LIVE_RESET.indexOf(state.resetTheme);
          if (idx >= 0) LIVE_RESET.splice(idx, 1);
        }
        state.series = [];
        state.events = [];
        state.hover = null;
        ctx = null;
      }
    };

    // theme.css 若在图表创建后才加载，可调用 FL.chart.refreshTheme() 重取变量
    state.resetTheme = function () {
      state.themeCache = null;
      scheduleRender();
    };
    LIVE_RESET.push(state.resetTheme);

    // 首帧
    measure();
    getBaseTheme();
    scheduleRender();

    return api;
  }

  /* ------------------------------------------------------------------ *
   * 导出
   * ------------------------------------------------------------------ */

  FL.chart = {
    VERSION: VERSION,
    create: createChart,

    /** 清除 CSS 变量缓存并重绘现存图表（主题晚于图表加载时使用） */
    refreshTheme: function () {
      BASE_THEME = null;
      for (var i = 0; i < LIVE_RESET.length; i++) {
        try {
          LIVE_RESET[i]();
        } catch (err) { /* ignore */ }
      }
    },

    /** 当前解析到的语义色（供页面图例/提示使用；优先用 CSS 变量） */
    palette: function () {
      var t = getBaseTheme();
      var out = {};
      var k;
      for (k in t.colors) out[k] = t.colors[k];

  /* ===================================================================

  function download(filename, text, mime) {
    const type = mime || 'text/plain;charset=utf-8';
    let blob;
    try { blob = new Blob([text], { type }); } catch (e) { blob = new Blob([String(text)], { type: 'text/plain;charset=utf-8' }); }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 900);
    return true;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true).catch(() => legacyCopy(text));
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.setAttribute('readonly', '');
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  }
  function jsonFilename(run, kind) {
    return 'FaultLab_' + (kind || 'manifest') + '_' + (run ? run.runId : 'all') + '_' + stamp() + '.json';
  }
  function reportFilename(run) {
    return 'FaultLab_report_' + run.runId + '_' + stamp() + '.html';
  }

  FL.exporter = {
    csv,
    configManifest,
    htmlReport,
    summaryText,
    evidenceBundle,
    download,
    copyText,
    csvFilename,
    jsonFilename,
    reportFilename,
    _helpers: { esc, num, csvCell, stamp }
  };
})();

    if (!fault || !fault.params || !fault.params.length) return '';
    const p = fault.params[0];

    const num = (typeof v === 'number') ? String(v) : String(v);
    if (fault.family === 'actuator_fault') return '限幅 ' + num + (p.unit || '');
    const sign = (typeof v === 'number' && v >= 0) ? '+' : '';
    return sign + num + (p.unit ? ' ' + p.unit : '');

  function busVoltageText(sysDef) {
    const comps = (sysDef && sysDef.components) || [];
    for (let i = 0; i < comps.length; i++) {
      const c = comps[i];

        const m = /(\d+(?:\.\d+)?)\s*V/.exec(String(c.role || '') + ' ' + String(c.description || ''));

    const sidePrinciple = el('section', { class: 'home-side-card fl-panel home-principle' + (local.principleOpen ? ' is-open' : '') }, [

  function sBaselineBadge(selected) {
    if (selected === 'FL-001') return el('span', { class: 'badge', 'data-tone': 'acc' }, '基准实验');
    return el('span', { class: 'badge', 'data-tone': 'neutral' }, '扩展系统');
  }

  function buildPrincipleDiagram(sysDef, fault) {
    const mag = fault && fault.params && fault.params[0] ? fault.params[0].default : 10;
    const unit = fault && fault.params && fault.params[0] ? (fault.params[0].unit || '') : 'A';
    const t0 = fault ? fault.defaultTime_s : 20;
    const t0x = (8 + t0 / 60 * 604).toFixed(1);
    const positive = typeof mag !== 'number' || mag >= 0;
    const biasLabel = (positive ? '+' : '−') + Math.abs(mag) + (unit ? ' ' + unit : '');

    function svgDefs() {
      return '<defs><marker id="homeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
        '<path d="M0 0 L10 5 L0 10 z" fill="var(--ink-3)"/></marker></defs>';
    }
    function panel(titleCls, title, path, extraCls) {
      return '<div class="home-principle-plot">' +
        '<div class="home-principle-plot-head"><span class="eyebrow ' + titleCls + '">' + title + '</span></div>' +
        '<svg class="home-principle-svg" viewBox="0 0 620 56" preserveAspectRatio="none" aria-hidden="true">' +
        svgDefs() +
        '<line class="hp-grid" x1="8" y1="50" x2="612" y2="50"/>' +
        '<line class="hp-event" x1="' + t0x + '" y1="4" x2="' + t0x + '" y2="50"/>' +
        '<text class="hp-event-label" x="' + (+t0x + 5) + '" y="12">t = ' + t0 + ' s</text>' +
        '<path class="' + extraCls + '" d="' + path + '" marker-end="url(#homeArrow)"/>' +
        '</svg></div>';
    }

    const content = el('div', { class: 'home-principle-content' }, [
      el('div', { class: 'formula home-principle-formula' }, [
        el('span', { class: 'fx-obs' }, 'I_meas(t)'),
        el('span', {}, ' = '),
        el('span', { class: 'fx-acc' }, 'I_true(t)'),
        el('span', {}, ' + '),
        el('span', { class: 'fx-fault' }, 'b(t)'),
        el('span', { class: 'home-formula-note' }, '   ← 偏置只注入测量通道，不直接改变物理量')
      ]),
      el('div', { class: 'formula home-principle-formula is-small' }, [
        'b(t) = 0 (t < ' + t0 + ' s)； b(t) = ' + biasLabel.replace(' ', '') + ' (t ≥ ' + t0 + ' s)'
      ]),
      el('div', { class: 'home-principle-plots', html:
        panel('hp-true', '真实电流 I_true（闭环反馈响应）',
          'M8 18 H' + t0x + ' C ' + (+t0x + 30) + ' 18, ' + (+t0x + 54) + ' 34, ' + (+t0x + 120) + ' 34 H612',
          'hp-line hp-solid') +
        panel('hp-bias', '偏置 b(t)（故障事件，阶跃）',
          'M8 40 H' + t0x + ' V14 H612',
          'hp-line hp-dashed hp-faultline') +
        panel('hp-meas', '测量电流 I_meas = I_true + b(t)（观测通道）',
          'M8 18 H' + t0x + ' V4 C ' + (+t0x + 30) + ' 4, ' + (+t0x + 54) + ' 24, ' + (+t0x + 120) + ' 26 H612',
          'hp-line hp-dashed hp-obsline')
      }),
      el('p', { class: 'home-principle-note' },
        '示意：仅表达“真实值连续、测量值在故障时刻阶跃、闭环后真实值缓慢回落”的定性关系，不含刻度与数值。' +
        '默认场景的精确数值（20 s / +10 A / 60 s）见参数摘要，实际结果以运行数据为准。')
    ]);
    return content;
  }

  /* ------------------------------------------------------------------ */

  function openModelDrawer(sysDef) {
    if (!sysDef) { ui.toast('系统数据尚未就绪', 'warn'); return; }

    const assumptions = (model.assumptions || []).map((a) => el('li', { class: 'home-assume-item' }, [

    ]));

    const equations = (model.equations || []).map((eq) => el('div', { class: 'home-eq' }, [

      ]),

        el('div', { class: 'eyebrow' }, '适用局限 · limitations'),
