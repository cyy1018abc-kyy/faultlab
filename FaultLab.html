.panel-foot { padding: 11px 16px; border-top: 1px solid var(--line-1); }

.fl-card {
  position: relative;
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  transition: border-color .18s, background .18s, transform .18s;
}
.fl-card--hover:hover { border-color: var(--line-3); background: var(--bg-3); transform: translateY(-1px); }
.fl-card--selectable { cursor: pointer; text-align: left; width: 100%; color: inherit; }
.fl-card--selectable[aria-selected="true"] { border-color: rgba(200, 244, 90, .5); background: linear-gradient(180deg, rgba(200, 244, 90, .055), rgba(17, 22, 29, .9)); }
.chamfer { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); }

/* hazard stripe (fault identity) */
.hazard {
  background-image: repeating-linear-gradient(135deg, rgba(255, 95, 109, .22) 0 5px, transparent 5px 10px);
}

/* =========================================================================
   Buttons / segmented / switches
   ========================================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 34px; padding: 0 14px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .025);
  color: var(--ink-0);
  font-family: var(--font-body); font-size: 13px; font-weight: 500;
  text-decoration: none; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s, transform .05s, box-shadow .15s;
}
.btn:hover { background: rgba(255, 255, 255, .06); border-color: var(--line-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .36; cursor: not-allowed; pointer-events: none; }
.btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
.btn-primary {
  background: var(--acc); border-color: var(--acc); color: #0a0d0f; font-weight: 600;
  box-shadow: 0 0 0 1px rgba(200, 244, 90, .18), 0 8px 22px rgba(200, 244, 90, .1);
}
.btn-primary:hover { background: #d6ff72; border-color: #d6ff72; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-1); }
.btn-ghost:hover { background: rgba(255, 255, 255, .05); border-color: transparent; color: var(--ink-0); }
.btn-danger { border-color: rgba(255, 95, 109, .45); color: #ffb3b9; background: rgba(255, 95, 109, .07); }
.btn-danger:hover { background: rgba(255, 95, 109, .14); border-color: rgba(255, 95, 109, .65); }
.btn-sm { height: 27px; padding: 0 9px; font-size: 11.5px; gap: 6px; }
.btn-sm svg { width: 13px; height: 13px; }
.btn-xs { height: 22px; padding: 0 7px; font-size: 10.5px; gap: 5px; }
.btn-xs svg { width: 12px; height: 12px; }
.btn-icon { width: 32px; padding: 0; }
.btn-icon.btn-sm { width: 27px; }
.btn-block { width: 100%; }
.btn[data-loading="true"] { color: transparent; position: relative; }
.btn[data-loading="true"]::after {
  content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid currentColor; border-top-color: transparent;
  animation: spin .8s linear infinite; color: var(--ink-0);
}
@keyframes spin { to { transform: rotate(360deg); } }

.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  border: 1px solid var(--line-1); border-radius: 7px; background: rgba(0, 0, 0, .24);
}
.seg-item {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 26px; padding: 0 11px; border: 0; border-radius: 5px;
  background: transparent; color: var(--ink-2);
  font-size: 12px; white-space: nowrap;
  transition: background .15s, color .15s;
}
.seg-item:hover { color: var(--ink-0); }
.seg-item[aria-pressed="true"] { background: var(--bg-3); color: var(--ink-0); box-shadow: inset 0 0 0 1px var(--line-2); }
.seg-item:disabled { opacity: .35; cursor: not-allowed; }
.seg-item svg { width: 13px; height: 13px; }

.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .sw-track {
  width: 34px; height: 19px; border-radius: 10px; background: var(--bg-4);
  border: 1px solid var(--line-2); position: relative; transition: background .16s, border-color .16s;
  flex: 0 0 34px;
}
.switch .sw-track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
  border-radius: 50%; background: var(--ink-2); transition: transform .16s, background .16s;
}
.switch input:checked + .sw-track { background: rgba(200, 244, 90, .2); border-color: rgba(200, 244, 90, .55); }
.switch input:checked + .sw-track::after { transform: translateX(15px); background: var(--acc); }
.switch input:focus-visible + .sw-track { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.switch input:disabled + .sw-track { opacity: .4; }
.switch .sw-label { font-size: 12px; color: var(--ink-1); }

/* =========================================================================
   Forms
   ========================================================================= */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-1); }
.field-label .fl-unit { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
.field-hint { font-size: 11px; line-height: 1.5; color: var(--ink-3); }
.field-error { display: flex; align-items: flex-start; gap: 6px; font-size: 11.5px; color: #ff9aa2; }
.field-error svg { width: 13px; height: 13px; flex: 0 0 13px; margin-top: 1px; }
.field-row { display: flex; align-items: center; gap: 8px; }
.input {
  height: 32px; padding: 0 10px; width: 100%;
  background: var(--bg-2); color: var(--ink-0);
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: 12.5px;
  transition: border-color .15s, background .15s;
}
.input:hover { border-color: var(--line-3); }
.input:focus { border-color: rgba(200, 244, 90, .55); outline: none; background: var(--bg-3); }
.input::placeholder { color: var(--ink-3); }
.input[aria-invalid="true"] { border-color: rgba(255, 95, 109, .6); }
.input--num { width: 88px; text-align: right; }
select.input { font-family: var(--font-body); font-size: 12.5px; padding-right: 6px; }
.input-unit { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); flex: 0 0 auto; }

.range-wrap { display: flex; align-items: center; gap: 12px; }
.range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 18px; background: transparent; margin: 0;
}
.range::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--acc) 0 var(--range-fill, 0%), var(--bg-4) var(--range-fill, 0%) 100%);
  border: 1px solid var(--line-1);
}
.range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--bg-4); border: 1px solid var(--line-1); }
.range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--acc); }
.range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; margin-top: -6px; border-radius: 50%;
  background: var(--acc); border: 2px solid #0a0d0f;
  box-shadow: 0 0 0 1px rgba(200, 244, 90, .5), 0 0 10px rgba(200, 244, 90, .4);
  cursor: grab;
}
.range::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%; background: var(--acc);
  border: 2px solid #0a0d0f; box-shadow: 0 0 0 1px rgba(200, 244, 90, .5); cursor: grab;
}
.range:disabled::-webkit-slider-thumb { background: var(--ink-3); box-shadow: none; cursor: not-allowed; }
.range:disabled::-webkit-slider-runnable-track { opacity: .4; }
.range:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px; border-radius: 3px; }
.range-val { font-family: var(--font-mono); font-size: 12px; color: var(--ink-0); min-width: 62px; text-align: right; }

/* =========================================================================
   Badges / chips / source tags
   ========================================================================= */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px; border-radius: 3px;
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--line-2); color: var(--ink-2); background: rgba(255, 255, 255, .025);
  white-space: nowrap;
}
.badge[data-tone="ok"] { color: var(--ok); border-color: rgba(95, 227, 161, .4); background: var(--ok-dim); }
.badge[data-tone="warn"] { color: var(--warn); border-color: rgba(255, 209, 102, .4); background: var(--warn-dim); }
.badge[data-tone="danger"] { color: #ffb0b7; border-color: rgba(255, 95, 109, .45); background: var(--fault-dim); }
.badge[data-tone="info"] { color: var(--obs); border-color: rgba(90, 216, 255, .4); background: var(--obs-dim); }
.badge[data-tone="acc"] { color: var(--acc); border-color: rgba(200, 244, 90, .4); background: var(--acc-dim); }
.badge svg { width: 11px; height: 11px; }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  height: 27px; padding: 0 10px;
  border: 1px solid var(--line-1); border-radius: 14px;
  background: rgba(255, 255, 255, .02);
  font-size: 11.5px; color: var(--ink-1);
  white-space: nowrap;
}
.chip b { font-family: var(--font-mono); font-weight: 500; color: var(--ink-0); }
.chip[data-tone="acc"] { border-color: rgba(200, 244, 90, .32); color: var(--acc); background: var(--acc-dim); }
.chip[data-tone="fault"] { border-color: rgba(255, 95, 109, .35); color: #ffb0b7; background: var(--fault-dim); }
.chip svg { width: 12px; height: 12px; }

.source-tag {
  display: inline-flex; align-items: center;
  height: 16px; padding: 0 5px; border-radius: 3px;
  font-family: var(--font-mono); font-size: 9px; letter-spacing: .05em;
  border: 1px solid var(--line-2); color: var(--ink-2); background: rgba(255, 255, 255, .02);
  white-space: nowrap;
}
.source-tag[data-kind="MODEL_STATE"] { color: var(--acc); border-color: rgba(200, 244, 90, .32); background: var(--acc-dim); }
.source-tag[data-kind="OBSERVATION"] { color: var(--obs); border-color: rgba(90, 216, 255, .32); background: var(--obs-dim); }
.source-tag[data-kind="CONTROLLER"] { color: var(--warm); border-color: rgba(255, 178, 87, .32); background: var(--warm-dim); }
.source-tag[data-kind="FAULT_EVENT"] { color: #ffb0b7; border-color: rgba(255, 95, 109, .38); background: var(--fault-dim); }
.source-tag[data-kind="DERIVED"] { color: var(--derived); border-color: rgba(179, 163, 255, .32); background: rgba(179, 163, 255, .1); }
.source-tag[data-kind="MODEL_ASSUMPTION"] { color: var(--ink-2); border-color: var(--line-2); }
.source-tag[data-kind="CONFIG"] { color: var(--ink-2); border-color: var(--line-2); }

/* line-style legend swatch */
.ls-swatch { display: inline-block; width: 22px; height: 0; border-top-width: 2px; border-top-style: solid; flex: 0 0 22px; }
.ls-swatch[data-style="dashed"] { border-top-style: dashed; }
.ls-swatch[data-style="dashdot"] { border-top-style: dashed; }
.ls-swatch[data-style="dotted"] { border-top-style: dotted; border-top-width: 2px; }

/* =========================================================================
   Stats / metric cards
   ========================================================================= */
.stat {
  display: flex; flex-direction: column; gap: 3px;
  padding: 11px 13px 10px; min-width: 0;
  border: 1px solid var(--line-1); border-radius: var(--r-md);
  background: rgba(255, 255, 255, .015);
}
.stat-value {
  font-family: var(--font-display); font-size: 23px; font-weight: 600; line-height: 1.12;
  letter-spacing: .01em; font-variant-numeric: tabular-nums; color: var(--ink-0);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stat-value.is-unavailable { color: var(--ink-3); font-size: 18px; }
.stat-unit { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); margin-left: 3px; }
.stat-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stat-hint { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }
.stat[data-tone="acc"] .stat-value { color: var(--acc); }
.stat[data-tone="obs"] .stat-value { color: var(--obs); }
.stat[data-tone="warm"] .stat-value { color: var(--warm); }
.stat[data-tone="fault"] .stat-value { color: #ff8b94; }
.stat[data-tone="ok"] .stat-value { color: var(--ok); }

/* =========================================================================
   Empty / loading states
   ========================================================================= */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 46px 24px; min-height: 220px;
  color: var(--ink-2);
}
.empty-icon {
  width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
  border: 1px dashed var(--line-2); color: var(--ink-3); background: rgba(255, 255, 255, .02);
}
.empty-icon svg { width: 22px; height: 22px; }
.empty-title { font-family: var(--font-display); font-size: 16px; color: var(--ink-1); letter-spacing: .02em; }
.empty-desc { font-size: 12.5px; color: var(--ink-2); max-width: 44ch; line-height: 1.6; }
.loading {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 46px 24px; color: var(--ink-2); font-size: 13px; min-height: 180px;
}
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .12); border-top-color: var(--acc);
  animation: spin .9s linear infinite;
}
.skeleton {
  background: linear-gradient(90deg, var(--bg-2) 25%, var(--bg-3) 50%, var(--bg-2) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite;
  border-radius: var(--r-sm);
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* =========================================================================
   Overlay: drawer / modal / toast
   ========================================================================= */
.overlay-root { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 210;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  background: rgba(3, 5, 8, .68);
  backdrop-filter: blur(7px);
  pointer-events: auto;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(580px, 100%); max-height: min(82vh, 820px);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #0f141b, #0b0f14);
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2);
  animation: modalIn .22s cubic-bezier(.2, .7, .2, 1);
}
.modal--wide { width: min(840px, 100%); }
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.modal-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 18px 20px 14px; border-bottom: 1px solid var(--line-1);
}
.modal-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.modal-sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.modal-body { padding: 18px 20px; overflow-y: auto; font-size: 13px; color: var(--ink-1); line-height: 1.7; }
.modal-body p + p { margin-top: 10px; }
.modal-foot {
  display: flex; align-items: center; justify-content: flex-end; gap: 9px;
  padding: 13px 20px; border-top: 1px solid var(--line-1);
}
.drawer-backdrop { position: fixed; inset: 0; z-index: 208; background: rgba(3, 5, 8, .45); pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 209;
  width: min(440px, 94vw);
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #0f141b, #0b0f14);
  border-left: 1px solid var(--line-2);
  box-shadow: -24px 0 70px rgba(0, 0, 0, .55);
  animation: drawerIn .24s cubic-bezier(.2, .7, .2, 1);
  pointer-events: auto;
}
@keyframes drawerIn { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.drawer-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 18px 18px 14px; border-bottom: 1px solid var(--line-1);
}
.drawer-body { padding: 16px 18px 24px; overflow-y: auto; font-size: 13px; line-height: 1.7; color: var(--ink-1); }
.toast-root {
  position: fixed; right: 18px; bottom: calc(var(--timeline-h) + 14px);
  z-index: 220; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 9px;
  max-width: 380px; padding: 10px 13px;
  background: rgba(15, 20, 27, .97); border: 1px solid var(--line-2);
  border-radius: var(--r-md); box-shadow: var(--shadow-2);
  font-size: 12.5px; color: var(--ink-1);
  animation: toastIn .22s cubic-bezier(.2, .7, .2, 1);
  pointer-events: auto;
}
.toast svg { width: 15px; height: 15px; flex: 0 0 15px; margin-top: 1px; }
.toast[data-tone="ok"] { border-color: rgba(95, 227, 161, .4); }
.toast[data-tone="ok"] svg { color: var(--ok); }
.toast[data-tone="warn"] { border-color: rgba(255, 209, 102, .4); }
.toast[data-tone="warn"] svg { color: var(--warn); }
.toast[data-tone="danger"] { border-color: rgba(255, 95, 109, .45); }
.toast[data-tone="danger"] svg { color: var(--fault); }
.toast[data-tone="info"] svg { color: var(--obs); }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* popover (system switch) */
.popover-backdrop { position: fixed; inset: 0; z-index: 205; pointer-events: auto; }
.popover {
  position: fixed; z-index: 206;
  min-width: 300px; max-width: min(400px, calc(100vw - 32px));
  background: #0e141b; border: 1px solid var(--line-2); border-radius: var(--r-md);
  box-shadow: var(--shadow-2); padding: 6px;
  animation: modalIn .16s ease;
}
.popover-item {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
  padding: 10px 11px; border: 0; border-radius: 6px;
  background: transparent; color: var(--ink-1); text-align: left;
}
.popover-item:hover { background: var(--bg-3); color: var(--ink-0); }
.popover-item[aria-checked="true"] { background: rgba(200, 244, 90, .06); }
.popover-item .pi-code {
  font-family: var(--font-mono); font-size: 9.5px; color: var(--acc);
  border: 1px solid rgba(200, 244, 90, .3); border-radius: 3px; padding: 1px 5px; margin-top: 1px;
  flex: 0 0 auto;
}
.popover-item .pi-title { font-size: 13px; color: var(--ink-0); }
.popover-item .pi-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; }

/* =========================================================================
   Helpers for data-density pages
   ========================================================================= */
.kv { display: grid; grid-template-columns: minmax(88px, auto) 1fr; gap: 7px 12px; align-items: baseline; }
.kv dt { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.kv dd { margin: 0; font-size: 12.5px; color: var(--ink-1); }
.hint-row { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; color: var(--ink-3); line-height: 1.55; }
.hint-row svg { width: 13px; height: 13px; flex: 0 0 13px; margin-top: 1px; color: var(--ink-3); }
.notice {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 10px 12px; border-radius: var(--r-sm);
  border: 1px solid var(--line-1); background: rgba(255, 255, 255, .02);
  font-size: 11.5px; color: var(--ink-2); line-height: 1.55;
}
.notice svg { width: 14px; height: 14px; flex: 0 0 14px; margin-top: 1px; }
.notice[data-tone="warn"] { border-color: rgba(255, 209, 102, .32); background: var(--warn-dim); color: #e8d29a; }
.notice[data-tone="warn"] svg { color: var(--warn); }
.notice[data-tone="danger"] { border-color: rgba(255, 95, 109, .35); background: var(--fault-dim); color: #f0b6bb; }
.notice[data-tone="danger"] svg { color: var(--fault); }
.notice[data-tone="info"] { border-color: rgba(90, 216, 255, .3); background: var(--obs-dim); color: #b7e9fa; }
.notice[data-tone="info"] svg { color: var(--obs); }
.notice[data-tone="ok"] { border-color: rgba(95, 227, 161, .3); background: var(--ok-dim); color: #b2f0d0; }
.notice[data-tone="ok"] svg { color: var(--ok); }
.formula {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
  padding: 9px 11px; border-radius: var(--r-sm);
  background: rgba(0, 0, 0, .32); border: 1px solid var(--line-1); color: var(--ink-1);
  overflow-x: auto; white-space: pre-wrap; word-break: break-word;
}
.formula .fx-acc { color: var(--acc); }
.formula .fx-obs { color: var(--obs); }
.formula .fx-fault { color: var(--fault); }
.formula .fx-warm { color: var(--warm); }
.tag-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* section rhythm */
.section { padding: 0 0 22px; }
.section + .section { padding-top: 4px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.section-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: .02em; }
.section-sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; line-height: 1.5; }

/* =========================================================================
   Responsive shell
   ========================================================================= */

.pg-causal .cc-mechanism p { font-size: 12.5px; line-height: 1.65; color: var(--ink-1); }

/* ============================================================
   两栏：因果链表 + 解释面板
   ============================================================ */
.pg-causal .cc-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.52fr) minmax(330px, .92fr);
  gap: var(--gap);
  align-items: start;
  margin-top: var(--gap);
}
.pg-causal .cc-chain-body { display: flex; flex-direction: column; gap: 10px; }
.pg-causal .cc-chain-panel,
.pg-causal .cc-side { min-width: 0; }

/* ---------- 三层图例 ---------- */
.pg-causal .cc-legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pg-causal .cc-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .05em;
  color: var(--layer-c, var(--ink-2));
  border: 1px solid var(--layer-bd, var(--line-2));
  background: var(--layer-bg, transparent);
  border-radius: 3px;
  padding: 1px 6px;
  line-height: 16px;
  white-space: nowrap;
}
.pg-causal .cc-legend-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--layer-c, var(--ink-2));
  flex: 0 0 6px;
}
.pg-causal .cc-legend-en { font-size: 8px; color: var(--ink-3); letter-spacing: .04em; }

/* ---------- 链图 ---------- */
.pg-causal .cc-chain-wrap {
  position: relative;
  padding: 19px 2px 21px;
  min-height: 40px;
}
.pg-causal .cc-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}
.pg-causal .cc-edge {
  fill: none;
  stroke: var(--line-2);
  stroke-width: 1.4;
  opacity: .75;
  transition: stroke .16s, opacity .16s;
}
.pg-causal .cc-edge.is-hot {
  stroke: var(--acc);
  stroke-width: 1.8;
  opacity: 1;
  filter: drop-shadow(0 0 4px rgba(200, 244, 90, .45));
}
.pg-causal .cc-edge-labels { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.pg-causal .cc-edge-label {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 9px;
  letter-spacing: .03em;
  color: var(--ink-3);
  background: rgba(7, 10, 14, .92);
  border: 1px solid var(--line-1);
  border-radius: 3px;
  padding: 0 5px;
  line-height: 14px;
  white-space: nowrap;
}
.pg-causal .cc-edge-label.is-vert { transform: translate(8px, -50%); }

.pg-causal .cc-chain {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: minmax(92px, auto);
  gap: 46px 30px;
  position: relative;
  z-index: 1;
}

/* ---------- 节点卡 ---------- */
.pg-causal .cc-node {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: flex-start;
  min-width: 0;
  min-height: 92px;
  padding: 10px 12px 9px 15px;
  text-align: left;
  color: var(--ink-1);
  background: linear-gradient(180deg, var(--bg-2), rgba(11, 15, 20, .92));
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  cursor: pointer;
  z-index: 1;
  transition: border-color .16s, background .16s, opacity .16s, box-shadow .16s;
}
.pg-causal .cc-node::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 2px;
  border-radius: 2px;
  background: var(--layer-c, var(--ink-3));
  opacity: .8;
}
.pg-causal .cc-node::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, var(--layer-bg, transparent), transparent 72%);
  opacity: .55;
  pointer-events: none;
}
.pg-causal .cc-node > * { position: relative; z-index: 1; }
.pg-causal .cc-node:hover { border-color: var(--layer-bd, var(--line-2)); background: var(--bg-3); }
.pg-causal .cc-node .cc-node-order {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .14em;
  color: var(--layer-c, var(--ink-3));
  line-height: 1;
}
.pg-causal .cc-node .cc-node-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pg-causal .cc-node .cc-node-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink-0);
  letter-spacing: .01em;
  word-break: break-word;
}
.pg-causal .cc-node .cc-node-short {
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--ink-2);
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.pg-causal .cc-layer-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  align-self: flex-start;
  margin-top: auto;
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid var(--layer-bd, var(--line-2));
  background: var(--layer-bg, transparent);
  color: var(--layer-c, var(--ink-2));
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .05em;
  line-height: 15px;
  white-space: nowrap;
}
.pg-causal .cc-node-evidence {
  position: absolute;
  top: 8px;
  right: 9px;
  display: inline-flex;
  align-items: center;

  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-3);
}
.pg-causal .cc-node.is-focus {
  border-color: rgba(200, 244, 90, .65);
  background: linear-gradient(180deg, rgba(200, 244, 90, .10), rgba(13, 18, 24, .96));
  box-shadow: 0 0 0 1px rgba(200, 244, 90, .28), 0 8px 26px rgba(0, 0, 0, .42);
}
.pg-causal .cc-node.is-focus .cc-node-title { color: #f4ffe0; }
.pg-causal .cc-node.is-up { border-color: rgba(90, 216, 255, .52); }
.pg-causal .cc-node.is-down { border-color: rgba(200, 244, 90, .42); }
.pg-causal .cc-node.is-dim { opacity: .5; }
.pg-causal .cc-node:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* ---------- 空态与脚注 ---------- */
.pg-causal .cc-chain-empty { padding: 2px 0; }
.pg-causal .cc-chain-empty .empty { min-height: 180px; }
.pg-causal .cc-chain-foot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line-1);
  padding-top: 9px;
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--ink-3);
}
.pg-causal .cc-chain-foot-note { color: var(--ink-3); }

/* ============================================================
   右侧解释面板
   ============================================================ */
.pg-causal .cc-inspector {
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding: 14px 16px 16px;
  min-width: 0;
}
.pg-causal .cc-insp-head { display: flex; align-items: flex-start; gap: 11px; }
.pg-causal .cc-insp-order {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  border: 1px solid var(--layer-bd, var(--line-2));
  background: var(--layer-bg, rgba(255, 255, 255, .03));
  color: var(--layer-c, var(--acc));
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.pg-causal .cc-insp-title-wrap { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pg-causal .cc-insp-title {
  font-family: var(--font-display);
  font-size: 15.5px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink-0);
  letter-spacing: .01em;
  word-break: break-word;
}
.pg-causal .cc-insp-tags { gap: 6px; align-items: center; }
.pg-causal .cc-clock {
  font-size: 10px;
  color: var(--ink-3);
  border: 1px solid var(--line-1);
  border-radius: 3px;
  padding: 1px 6px;
  white-space: nowrap;
}

.pg-causal .cc-block-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.pg-causal .cc-block-hint { font-size: 9.5px; color: var(--ink-3); text-align: right; line-height: 1.4; }

.pg-causal .cc-template {
  border: 1px solid var(--line-1);
  border-left: 2px solid var(--acc);
  border-radius: var(--r-sm);
  background: rgba(200, 244, 90, .045);
  padding: 10px 12px;
}
.pg-causal .cc-sentence {
  font-size: 12.5px;
  line-height: 1.85;
  color: var(--ink-1);
  word-break: break-word;
}
.pg-causal .cc-slot {
  font-weight: 600;
  color: var(--ink-0);
  border-bottom: 1px dotted var(--line-3);
  padding: 0 1px;
}
.pg-causal .cc-slot[data-kind="FAULT_EVENT"] { color: #ffb0b7; }
.pg-causal .cc-slot[data-kind="MODEL_STATE"] { color: var(--acc); }
.pg-causal .cc-slot[data-kind="OBSERVATION"] { color: var(--obs); }
.pg-causal .cc-slot[data-kind="CONTROLLER"] { color: var(--warm); }
.pg-causal .cc-slot[data-kind="CONFIG"] { color: var(--ink-0); }
.pg-causal .cc-template-src { gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }

.pg-causal .cc-detail p { font-size: 12.5px; line-height: 1.7; color: var(--ink-1); }

.pg-causal .cc-values {
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-top: 1px solid var(--line-1);
  padding-top: 11px;
}
.pg-causal .cc-value-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 10px;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px dashed var(--line-1);
}
.pg-causal .cc-value-row:last-of-type { border-bottom: 0; }
.pg-causal .cc-value-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.pg-causal .cc-value-title { font-size: 11.5px; color: var(--ink-1); line-height: 1.4; }
.pg-causal .cc-value-id { font-size: 9px; color: var(--ink-3); line-height: 1.3; }
.pg-causal .cc-value-num { display: inline-flex; align-items: baseline; gap: 4px; justify-content: flex-end; }
.pg-causal .cc-ev-value {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink-0);
  white-space: nowrap;
}
.pg-causal .cc-ev-value.is-unavailable { color: var(--ink-3); font-family: var(--font-body); font-size: 12px; }
.pg-causal .cc-ev-unit { font-size: 10px; color: var(--ink-3); }
.pg-causal .cc-value-src { justify-self: end; }
.pg-causal .cc-value-foot { margin-top: 7px; }

/* ---------- 证据 ---------- */
.pg-causal .cc-evidence-block {
  border-top: 1px solid var(--line-1);
  padding-top: 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.pg-causal .cc-evidence-toggle { align-self: flex-start; }
.pg-causal .cc-ev-list { display: flex; flex-direction: column; gap: 8px; margin-top: 9px; }
.pg-causal .cc-ev-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 10px;
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .015);
}
.pg-causal .cc-ev-head {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 10.5px;
  line-height: 1.5;
}
.pg-causal .cc-ev-run { color: var(--acc); }
.pg-causal .cc-ev-var { color: var(--obs); }
.pg-causal .cc-ev-window { color: var(--ink-2); }
.pg-causal .cc-ev-dot { color: var(--ink-3); }
.pg-causal .cc-ev-note { font-size: 11.5px; line-height: 1.55; color: var(--ink-2); }
.pg-causal .cc-ev-meta { gap: 8px; align-items: center; flex-wrap: wrap; row-gap: 5px; }
.pg-causal .cc-ev-meta .tiny { color: var(--ink-2); }

.pg-causal .cc-insp-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line-1);
  padding-top: 12px;
}
.pg-causal .cc-insp-component {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  border-top: 1px dashed var(--line-1);
  padding-top: 9px;
}

/* ============================================================
   底部三卡：仅监测对照 / 残差公式 / 替代解释
   ============================================================ */
.pg-causal .cc-bottom {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--gap);
  align-items: start;
  margin-top: var(--gap);
}
.pg-causal .cc-bottom-card { min-width: 0; }
.pg-causal .cc-bottom-card .panel-head { padding: 11px 13px; min-height: 42px; }
.pg-causal .cc-bottom-card .panel-head .panel-title { font-size: 13px; }
.pg-causal .cc-bottom-card .panel-head svg { color: var(--ink-2); }
.pg-causal .cc-bottom-body {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 12px 13px 13px;
  font-size: 12px;
}
.pg-causal .cc-card-desc { font-size: 11.5px; line-height: 1.6; color: var(--ink-2); }
.pg-causal .cc-def { display: flex; flex-direction: column; gap: 2px; }
.pg-causal .cc-def .mono { font-size: 10.5px; line-height: 1.5; color: var(--ink-1); }
.pg-causal .cc-def-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
.pg-causal .cc-def-row .cc-def + .cc-def { border-top: 1px dashed var(--line-1); padding-top: 7px; }

/* 对照 mini 表 */
.pg-causal .cc-table-wrap { overflow-x: auto; margin: 0 -2px; }
.pg-causal .cc-mini-table { width: 100%; border-collapse: collapse; font-size: 10.5px; min-width: 290px; }
.pg-causal .cc-mini-table th {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  text-align: left;
  padding: 3px 4px;
  border-bottom: 1px solid var(--line-1);
  white-space: nowrap;
  font-weight: 400;
}
.pg-causal .cc-mini-table th:not(:first-child) { text-align: right; }
.pg-causal .cc-mini-table td { padding: 5px 4px; border-bottom: 1px dashed var(--line-1); vertical-align: top; text-align: right; }
.pg-causal .cc-mini-table td:first-child { text-align: left; }
.pg-causal .cc-mini-table tr:last-child td { border-bottom: 0; }
.pg-causal .cc-mini-name { display: block; font-size: 10.5px; color: var(--ink-1); line-height: 1.35; }
.pg-causal .cc-mini-id { display: block; font-size: 8.5px; color: var(--ink-3); line-height: 1.35; }

/* 残差卡 */
.pg-causal .cc-resid-summary { display: flex; flex-direction: column; gap: 5px; }
.pg-causal .cc-resid-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 5px 0;
  border-bottom: 1px dashed var(--line-1);
}
.pg-causal .cc-resid-row:last-child { border-bottom: 0; }
.pg-causal .cc-resid-name { flex: 1 1 130px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.pg-causal .cc-resid-name > span:first-child { font-size: 11px; color: var(--ink-1); }
.pg-causal .cc-resid-val {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink-0);
  white-space: nowrap;
}
.pg-causal .cc-resid-live { display: flex; flex-direction: column; gap: 9px; }
.pg-causal .cc-resid-time { font-size: 10px; color: var(--ink-3); letter-spacing: .03em; }
.pg-causal .cc-formula-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 9px;
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  background: rgba(0, 0, 0, .2);
}
.pg-causal .cc-formula-block.is-meas { border-color: rgba(200, 244, 90, .24); background: rgba(200, 244, 90, .035); }
.pg-causal .cc-formula-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-1);
}
.pg-causal .cc-formula-block .formula { font-size: 10.5px; line-height: 1.65; padding: 6px 8px; }
.pg-causal .cc-term-chips { gap: 5px; row-gap: 5px; }
.pg-causal .cc-term-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 6px;
  border: 1px solid var(--line-1);
  border-radius: 3px;
  background: rgba(255, 255, 255, .02);
  white-space: nowrap;
}
.pg-causal .cc-term-chip-label { font-size: 9.5px; color: var(--ink-2); }
.pg-causal .cc-term-chip-val { font-family: var(--font-mono); font-size: 10px; color: var(--ink-0); }
.pg-causal .cc-term-table { display: flex; flex-direction: column; }
.pg-causal .cc-term-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 8px;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px dashed var(--line-1);
}
.pg-causal .cc-term-label { display: flex; flex-direction: column; gap: 0; min-width: 0; font-size: 10.5px; color: var(--ink-1); }
.pg-causal .cc-term-label .tiny { font-size: 8.5px; }
.pg-causal .cc-term-value { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-0); white-space: nowrap; }
.pg-causal .cc-term-foot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 10px;
  color: var(--ink-2);

/* 替代解释 */
.pg-causal .cc-alt {

  gap: 2px;

}

.pg-causal .cc-alt-text { font-size: 11px; line-height: 1.55; color: var(--ink-2); }
.pg-causal .cc-bullets { display: flex; flex-direction: column; gap: 5px; list-style: none; }
.pg-causal .cc-bullets li {

.pg-causal .cc-footnote {
  margin-top: 8px;

.pg-causal .cc-no-run {

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 1359px) {
  .pg-causal .cc-bottom { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .pg-causal .cc-chain-panel .panel-head { flex-wrap: wrap; row-gap: 7px; }

  .pg-causal .cc-legend { flex-wrap: wrap; row-gap: 5px; }
}

  .pg-causal .cc-grid { grid-template-columns: minmax(0, 1.35fr) minmax(300px, .95fr); }
  .pg-causal .cc-chain { gap: 40px 22px; }
  .pg-causal .cc-node { padding: 9px 10px 8px 13px; }
  .pg-causal .cc-node .cc-node-title { font-size: 12px; }
  .pg-causal .cc-focus { grid-template-columns: minmax(0, 1fr); }

  .pg-causal .cc-truth-note { text-align: left; max-width: none; }
}
@media (max-width: 1023px) {

/* ============================================================ setup */
.pg-arena .arena-setup { overflow: hidden; }
.pg-arena .arena-setup-body {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px 18px;
  padding: 18px 18px 14px;
}
.pg-arena .arena-setup-body .field { min-width: 0; }
.pg-arena .arena-span-2 { grid-column: span 2; }
.pg-arena .arena-span-3 { grid-column: span 3; }
.pg-arena .arena-setup-body .input--num { width: 122px; }
.pg-arena .arena-agent-wrap { display: flex; flex-direction: column; gap: 8px; }
.pg-arena .arena-agent-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-2);
}

.pg-arena .arena-agent-grid {
  display: grid;

}
.pg-arena .arena-agent-opt {

}

.pg-arena .arena-agent-check {

}
.pg-arena .arena-agent-check::after {
  content: "";
  width: 7px;

}
.pg-arena .arena-agent-check:checked { background: var(--acc); border-color: var(--acc); }
.pg-arena .arena-agent-check:checked::after { transform: rotate(-45deg) scale(1); }
.pg-arena .arena-agent-check:disabled { cursor: not-allowed; opacity: .5; }
.pg-arena .arena-agent-opt-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pg-arena .arena-agent-opt-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

}

.pg-arena .arena-engine-note svg { color: var(--ok); }
.pg-arena .arena-setup-error { margin-top: 2px; }
.pg-arena .arena-setup-actions { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; }

/* ============================================================ progress */

  align-items: center;

}

}

.pg-arena .arena-lb-agent { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pg-arena .arena-lb-name {

}
.pg-arena .arena-lb-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.pg-arena .arena-lb-bar {
  display: block;
  height: 6px;

}

.pg-arena .arena-lb-bar-fill[data-tone="ok"] { background: linear-gradient(90deg, rgba(95, 227, 161, .65), var(--ok)); }

/* ============================================================ round card */

.pg-arena .arena-round-head {

}

.pg-arena .arena-round-sub { margin-top: 3px; font-size: 9.5px; color: var(--ink-3); letter-spacing: .04em; }
.pg-arena .arena-round-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pg-arena .arena-round-tags .chip { height: 23px; font-size: 10.5px; }

/* truth block */
.pg-arena .arena-truth {
  display: flex;

}

.pg-arena .arena-truth-label {

}

/* agent result cards */

  display: grid;

  padding: 14px 16px;
}

  flex-direction: column;

}

  border-color: rgba(90, 216, 255, .28);

}

}

.pg-arena .arena-mark {

.pg-arena .arena-round-foot {

/* ===== src/core/rng.js ===== */
/* owner: core-engine | module: rng | contract: docs/CONTRACT.md */
/* 确定性伪随机数：mulberry32 / gauss / hashSeed。全部由 seed 决定，禁止 Math.random。 */
(function () {
  'use strict';

  var FL = window.FL = window.FL || {};

  function mulberry32(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* FNV-1a 32bit：把字符串（seed / 信号 id）折叠成整数种子 */
  function hashSeed(str) {
    var s = String(str);
    var h = 0x811c9dc5 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i) & 0xff;
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  /* Box-Muller：每次消耗 2 个均匀随机数，返回标准正态样本 */
  function gauss(rand) {
    var u1 = rand();
    var u2 = rand();
    if (!(u1 > 1e-12) || u1 >= 1) u1 = 1e-12;
    return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  }

  /* 按 (seed, signalId) 建立独立序列；同一 seed/同 id 跨运行完全一致 */
  function forSignal(seed, signalId, salt) {
    return mulberry32(hashSeed(String(seed) + '|' + signalId + '|' + String(salt || '')));
  }

  /* 逐采样点独立噪声：不依赖调用顺序，index 决定样本 */
  function noiseAt(seed, signalId, index) {
    var rand = mulberry32(hashSeed(String(seed) + '|' + signalId + '|' + String(index)));
    return gauss(rand);
  }

  FL.rng = {
    mulberry32: mulberry32,
    hashSeed: hashSeed,
    gauss: gauss,
    forSignal: forSignal,
    noiseAt: noiseAt
  };

    unit(v, unit, digits) {

      return s === DASH ? DASH : s + (unit ? ' ' + unit : '');
    },
    time(t, digits) {
      return isNum(t) ? fmt.num(t, digits === undefined ? 1 : digits) + ' s' : DASH;
    },
    clock(t) {
      return isNum(t) ? t.toFixed(1) + ' / 60.0 s' : DASH;
    },
    hash(h, head) {
      if (!h) return DASH;
      return head === false ? h : String(h).slice(0, 8);
    },
    timestamp(iso) {
      if (!iso) return DASH;
      try {
        const d = new Date(iso);
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      } catch (e) { return DASH; }
    }
  };

  /* ---------- 时间轴/采样工具（页面只读 run） ---------- */
  function nearestIndex(run, t) {
    if (!run || !run.timeseries || !run.timeseries.t) return -1;
    const times = run.timeseries.t;
    if (!times.length) return -1;
    const dt = run.config && run.config.dt_s ? run.config.dt_s : 0.1;
    let idx = Math.round((Number(t) - times[0]) / dt);
    if (!isFinite(idx)) idx = 0;
    return Math.max(0, Math.min(times.length - 1, idx));
  }

  function sampleAt(run, signalId, t) {
    if (!run || !run.timeseries) return { value: null, index: -1, t: null };
    const idx = nearestIndex(run, t);
    const arr = run.timeseries.signals ? run.timeseries.signals[signalId] : null;
    return {
      value: arr && idx >= 0 ? arr[idx] : null,
      index: idx,
      t: idx >= 0 ? run.timeseries.t[idx] : null
    };
  }

  function sampleAll(run, t, signalIds) {
    const out = {};
    const idx = nearestIndex(run, t);
    if (!run || !run.timeseries || idx < 0) return out;
    const signals = run.timeseries.signals || {};
    const ids = signalIds && signalIds.length ? signalIds : Object.keys(signals);
    ids.forEach((id) => {
      const arr = signals[id];
      out[id] = arr ? arr[idx] : null;
    });
    return out;
  }

  function slice(run, signalId, t0, t1) {
    if (!run || !run.timeseries) return [];
    const times = run.timeseries.t;
    const arr = run.timeseries.signals ? run.timeseries.signals[signalId] : null;
    if (!arr) return [];
    const out = [];
    for (let i = 0; i < times.length; i++) {
      const t = times[i];
      if (t < t0 || t > t1) continue;
      out.push([t, arr[i]]);
    }
    return out;
  }

  function signalsOf(run) {
    if (run && run.signals && run.signals.length) return run.signals;
    return [];
  }

  function signalById(run, id) {
    const list = signalsOf(run);
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function signalsByCategory(run) {
    const map = {};
    signalsOf(run).forEach((s) => {
      (map[s.category] = map[s.category] || []).push(s);
    });
    return map;
  }

  function categorySignals(run, categoryId) {
    return signalsOf(run).filter((s) => s.category === categoryId);
  }

  function visibleSignals(run, { includeTableOnly = false } = {}) {
    return signalsOf(run).filter((s) => includeTableOnly || !s.tableOnly);
  }

  function metricById(run, metricId) {
    if (!run || !run.metrics) return null;
    for (let i = 0; i < run.metrics.length; i++) if (run.metrics[i].metric_id === metricId) return run.metrics[i];
    return null;
  }

  function faultEvent(run) {
    if (!run || !run.events) return null;
    for (let i = 0; i < run.events.length; i++) {
      const ev = run.events[i];
      if (ev && ev.event_type && ev.event_type !== 'healthy') return ev;
    }
    return run.events[0] || null;
  }

  function validateRun(run) {
    const problems = [];
    if (!run || typeof run !== 'object') return { ok: false, problems: ['run 为空'] };
    if (!run.timeseries || !Array.isArray(run.timeseries.t)) problems.push('缺少 timeseries.t');
    else if (run.timeseries.t.length !== 601) problems.push('采样点不是 601');
    if (!run.signals || !run.signals.length) problems.push('缺少 signals 元数据');
    return { ok: problems.length === 0, problems };
  }

  FL.protocol = {
    VERSION,
    SOURCE_KIND_LIST,
    SOURCE_KINDS,
    sourceMeta,
    fmt,
    isNum,
    nearestIndex,
    sampleAt,
    sampleAll,
    slice,
    signalsOf,
    signalById,
    signalsByCategory,
    categorySignals,
    visibleSignals,
    metricById,
    faultEvent,
    validateRun
  };
})();

  /* ================================================================== */
  /* FL.systems API                                                      */
  /* ================================================================== */
  function clone(v) {
    if (v === null || typeof v !== 'object') return v;
    if (Array.isArray(v)) return v.map(clone);
    var out = {};
    Object.keys(v).forEach(function (k) { out[k] = clone(v[k]); });
    return out;
  }

  function get(systemId) {
    return BY_ID[systemId] || null;
  }

  function requireSystem(systemId) {
    var s = get(systemId);
    if (!s) throw new Error('FL.systems: 未知系统 ' + systemId);
    return s;
  }

  function list() {
    return ALL.map(function (s) {
      return {
        id: s.id,
        experimentCode: s.experimentCode,
        title: s.title,
        shortTitle: s.shortTitle,
        tagline: s.tagline,
        level: s.level,
        available: true,
        defaultFaultFamily: s.faults[0].family
      };
    });
  }

  function signalMap(systemId) {
    var s = requireSystem(systemId);
    var map = {};
    s.signals.forEach(function (sg) { map[sg.id] = sg; });
    return map;
  }

  function faults(systemId) {
    return clone(requireSystem(systemId).faults);
  }

  function faultFor(systemId, family) {
    var s = requireSystem(systemId);
    for (var i = 0; i < s.faults.length; i++) if (s.faults[i].family === family) return clone(s.faults[i]);
    return null;
  }

  function component(systemId, componentId) {
    var s = requireSystem(systemId);
    for (var i = 0; i < s.components.length; i++) if (s.components[i].id === componentId) return clone(s.components[i]);
    return null;
  }

  function defaultConfig(systemId) {
    var s = requireSystem(systemId);
    var f = s.faults[0];
    return {
      schemaVersion: 1,
      systemId: s.id,
      modelId: s.model.model_id,
      modelVersion: s.model.model_version,
      duration_s: s.duration_s,
      dt_s: s.dt_s,
      feedback_mode: s.defaults.feedback_mode,
      fault: {
        family: f.family,
        faultId: f.id,
        t_start_s: f.defaultTime_s,
        params: paramsDefault(f)
      },
      initial: clone(s.defaults.initial),
      noise: clone(s.defaults.noise)
    };

          if (isAct && time >= tStart - 1e-9) target = Math.min(controlTarget, I_cap);
          var step = foStep(I_true, target, isAct ? 0.4 : 1.5, DT_INT);
          I_true = step.y;
          intI += step.integral;
        }
      }
      if (isLoad) intI = (intDemand - intPgen) / V;
      record(k);
    }
    var intPbat = isLoad ? (intDemand - intPgen) : V * intI;
    return {
      series: series,
      integrals: {
        E_load: intDemand,
        E_source: intDemand - intPbat,
        E_bat: intPbat,
        E_bat_meas: intPbat + V * intB,
        intI: intI,
        intB: intB
      }
    };
  }

  /* ---------------- FC-001 燃料电池 ---------------- */
  function simulateFC001(system, cfg, t) {
    var n = t.length - 1;
    var dt = cfg.dt_s;
    var V = 0.4;
    var family = cfg.fault.family;
    var faulted = family !== 'none';
    var tStart = faulted ? cfg.fault.t_start_s : null;
    var magnitude = faulted ? cfg.fault.params.magnitude : 0;
    var monitor = cfg.feedback_mode === 'monitor';
    var load0 = cfg.initial.load_kW;
    var soc0 = cfg.initial.SOC_pct;
    var P_bat_ref = 10;
    var I_fc_base = (load0 - P_bat_ref) / V;
    var isSensor = family === 'sensor_drift';
    var isLoad = family === 'load_step';
    var isAct = family === 'actuator_fault';
    var I_fc_cap = isAct ? I_fc_base * magnitude / 100 : null;

    function bAt(time) { return (isSensor && tStart != null && time >= tStart - 1e-9) ? magnitude : 0; }
    function demandAt(time) { return (isLoad && tStart != null && time >= tStart - 1e-9) ? load0 + magnitude : load0; }

    var series = makeSeries(system, n);
    var I_fc = I_fc_base;
    var I_fc_ref = I_fc_base;
    var intIfc = 0;
    var intB = 0;
    var intDemand = 0;

    function record(k) {
      var time = t[k];
      var b = bAt(time);
      var demand = demandAt(time);
      var iMeas = I_fc + b;
      var pFc = V * I_fc;
      var pFcMeas = V * iMeas;
      var pBat = demand - pFc;
      var pBatEst = demand - pFcMeas;
      series.I_fc_true_A[k] = I_fc;
      series.I_fc_meas_A[k] = iMeas;
      series.I_fc_ref_A[k] = I_fc_ref;
      series.bias_A[k] = b;
      series.I_fc_cap_A[k] = (isAct && time >= tStart - 1e-9) ? I_fc_cap : null;
      series.P_fc_true_kW[k] = pFc;
      series.P_fc_meas_kW[k] = pFcMeas;
      series.I_bat_true_A[k] = pBat / V;
      series.I_bat_meas_A[k] = pBat / V;
      series.P_bat_true_kW[k] = pBat;
      series.P_bat_meas_kW[k] = pBat;
      series.P_bat_est_kW[k] = pBatEst;
      series.P_load_demand_kW[k] = demand;
      series.P_load_served_kW[k] = demand;
      series.V_bus_V[k] = 400;
      series.SOC_true_pct[k] = soc0 - (intDemand - V * intIfc) / (CAP_KWH * 3600) * 100;
      series.SOC_est_pct[k] = soc0 - (intDemand - V * intIfc - V * intB) / (CAP_KWH * 3600) * 100;
      series.r_true_kW[k] = pFc + pBat - demand;
      series.r_meas_kW[k] = pFcMeas + pBat - demand;
      series.valve_cmd_pct[k] = 100;
      series.valve_meas_pct[k] = (isAct && time >= tStart - 1e-9) ? magnitude : 100;
    }

    record(0);
    for (var k = 1; k <= n; k++) {
      for (var j = 0; j < SUB; j++) {
        var time = (k - 1) * SUB * DT_INT + j * DT_INT;
        var b = bAt(time);
        var demand = demandAt(time);
        intDemand += demand * DT_INT;
        intB += b * DT_INT;
        if (isLoad) {
          var refStep = foStep(I_fc_ref, (demand - P_bat_ref) / V, 2.5, DT_INT);
          I_fc_ref = refStep.y;
        }
        var target;
        if (isAct) target = (tStart != null && time >= tStart - 1e-9) ? Math.min(I_fc_ref, I_fc_cap) : I_fc_ref;
        else if (isSensor && !monitor) target = I_fc_ref - b;
        else target = I_fc_ref;
        var step = foStep(I_fc, target, isAct ? 1.5 : 1.2, DT_INT);
        I_fc = step.y;
        intIfc += step.integral;
      }
      record(k);
    }
    return {
      series: series,
      integrals: {
        E_load: intDemand,
        E_source: V * intIfc,
        E_bat: intDemand - V * intIfc,
        E_bat_est: intDemand - V * (intIfc + intB),
        intB: intB
      }
    };
  }

  /* ---------------- GT-001 燃气涡轮 ---------------- */
  function simulateGT001(system, cfg, t) {
    var n = t.length - 1;
    var dt = cfg.dt_s;
    var KJ = 5.0;
    var K_bat = 24;
    var P_bat_ref = 5;
    var Ki = 2.0;
    var tau_g = 2.0;
    var family = cfg.fault.family;
    var faulted = family !== 'none';
    var tStart = faulted ? cfg.fault.t_start_s : null;
    var magnitude = faulted ? cfg.fault.params.magnitude : 0;
    var monitor = cfg.feedback_mode === 'monitor';
    var load0 = cfg.initial.load_kW;
    var soc0 = cfg.initial.SOC_pct;
    var isSensor = family === 'sensor_drift';
    var isLoad = family === 'load_step';
    var isAct = family === 'actuator_fault';
    var P_gen_cap = isAct ? 40 * magnitude / 100 : null;

    function bAt(time) { return (isSensor && tStart != null && time >= tStart - 1e-9) ? magnitude : 0; }
    function demandAt(time) { return (isLoad && tStart != null && time >= tStart - 1e-9) ? load0 + magnitude : load0; }

    var series = makeSeries(system, n);
    var f = 50;
    var P_gen = 25;
    var P_gen_cmd = 25;
    var intPbat = 0;
    var intPgen = 0;
    var intDemand = 0;
    var intResidual = 0;

    function record(k) {
      var time = t[k];
      var b = bAt(time);
      var demand = demandAt(time);
      var pBat = P_bat_ref - K_bat * (f - 50);
      var pRotor = P_gen + pBat - demand;
      series.f_true_Hz[k] = f;
      series.f_meas_Hz[k] = f;
      series.n_meas_rpm[k] = 60 * (f + b);
      series.P_gen_true_kW[k] = P_gen;
      series.P_gen_meas_kW[k] = P_gen;
      series.P_gen_cmd_kW[k] = P_gen_cmd;
      series.P_bat_true_kW[k] = pBat;
      series.P_bat_meas_kW[k] = pBat;
      series.P_load_demand_kW[k] = demand;
      series.P_load_served_kW[k] = demand;
      series.P_rotor_kW[k] = pRotor;
      series.V_bus_V[k] = 400;
      series.SOC_true_pct[k] = soc0 - intPbat / (CAP_KWH * 3600) * 100;
      series.SOC_est_pct[k] = soc0 - intPbat / (CAP_KWH * 3600) * 100;
      series.r_true_kW[k] = P_gen + pBat - demand - pRotor;
      series.r_meas_kW[k] = P_gen + pBat - demand - pRotor;
      series.valve_cmd_pct[k] = clamp(P_gen_cmd / 40 * 100, 0, 100);
      series.valve_meas_pct[k] = (isAct && time >= tStart - 1e-9) ? magnitude : series.valve_cmd_pct[k];
      series.P_gen_cap_kW[k] = (isAct && time >= tStart - 1e-9) ? P_gen_cap : null;
    }

    record(0);
    for (var k = 1; k <= n; k++) {
      for (var j = 0; j < SUB; j++) {
        var time = (k - 1) * SUB * DT_INT + j * DT_INT;
        var b = bAt(time);
        var demand = demandAt(time);
        var pBat = P_bat_ref - K_bat * (f - 50);
        var residual = P_gen + pBat - demand;

        var fGov = (monitor && isSensor) ? f : f + b;
        var cmdNext = clamp(P_gen_cmd + Ki * (50 - fGov) * DT_INT, 0, 40);
        var genStep = foStep(P_gen, cmdNext, tau_g, DT_INT);
        var genBefore = P_gen;
        P_gen = genStep.y;
        if (isAct && tStart != null && time >= tStart - 1e-9) P_gen = Math.min(P_gen, P_gen_cap);

        f += residual / KJ * DT_INT;

        var pbatEnd = P_bat_ref - K_bat * (f - 50);
        intPgen += 0.5 * (genBefore + P_gen) * DT_INT;
        intPbat += 0.5 * (pBat + pbatEnd) * DT_INT;
        intDemand += demand * DT_INT;
        intResidual += residual * DT_INT;
        P_gen_cmd = cmdNext;
      }
      record(k);
    }
    return {
      series: series,
      integrals: {
        E_load: intDemand,
        E_source: intPgen,
        E_bat: intPbat,
        E_rotor: KJ * (f - 50),
        intResidual: intResidual
      }
    };
  }

  /* ================================================================== */
  /* 观测噪声（仅 OBSERVATION 通道，确定性；默认关闭）                     */
  /* ================================================================== */
  function applyNoise(system, cfg, series) {
    var noise = cfg.noise;
    if (!noise || !noise.enabled || !(noise.level > 0)) return;
    var seed = noise.seed;
    var level = noise.level;

    system.signals.forEach(function (sg) {
      if (sg.sourceKind !== 'OBSERVATION') return;
      if (!(sg.noiseSigma > 0)) return;
      var arr = series[sg.id];
      if (!arr) return;
      for (var k = 0; k < arr.length; k++) {
        if (arr[k] === null) continue;
        arr[k] = arr[k] + level * sg.noiseSigma * FL.rng.noiseAt(seed, sg.id, k);
      }
    });

    var k;
    if (system.id === 'FL-001') {
      for (k = 0; k < series.I_bat_meas_A.length; k++) {
        series.P_bat_meas_kW[k] = 0.4 * series.I_bat_meas_A[k];
        series.r_meas_kW[k] = series.P_gen_true_kW[k] + series.P_bat_meas_kW[k] - series.P_load_served_kW[k];
      }
    } else if (system.id === 'FC-001') {
      for (k = 0; k < series.I_fc_meas_A.length; k++) {
        series.P_fc_meas_kW[k] = 0.4 * series.I_fc_meas_A[k];
        series.P_bat_meas_kW[k] = 0.4 * series.I_bat_meas_A[k];
        series.P_bat_est_kW[k] = series.P_load_demand_kW[k] - series.P_fc_meas_kW[k];
        series.r_meas_kW[k] = series.P_fc_meas_kW[k] + series.P_bat_meas_kW[k] - series.P_load_served_kW[k];
      }
    } else if (system.id === 'GT-001') {
      for (k = 0; k < series.f_meas_Hz.length; k++) {
        series.r_meas_kW[k] = series.P_gen_meas_kW[k] + series.P_bat_meas_kW[k] - series.P_load_served_kW[k] - series.P_rotor_kW[k];
      }
    }
  }

  /* ================================================================== */
  /* 事件 / 快照 / 真值                                                  */
  /* ================================================================== */
  var EVENT_TYPE = { sensor_drift: 'sensor_bias', load_step: 'load_step', actuator_fault: 'actuator_limit' };
  var TARGET_SIGNAL = {
    'FL-001': { sensor_drift: 'bias_A', load_step: 'P_load_demand_kW', actuator_fault: 'I_bat_cap_A' },
    'FC-001': { sensor_drift: 'bias_A', load_step: 'P_load_demand_kW', actuator_fault: 'I_fc_cap_A' },
    'GT-001': { sensor_drift: 'n_meas_rpm', load_step: 'P_load_demand_kW', actuator_fault: 'P_gen_cap_kW' }
  };

  function buildLabel(system, cfg) {
    var mode = cfg.feedback_mode === 'monitor' ? '仅监测' : '闭环';
    if (cfg.fault.family === 'none') return mode + ' · 无故障基准';
    var def = findFaultDef(system, cfg.fault.family);
    var p = def && def.params[0] ? def.params[0] : { unit: '', precision: 0 };
    return mode + ' · ' + (def ? def.shortLabel : '故障') + ' ' + formatAmount(cfg.fault.params.magnitude, p) +
      ' @' + Number(cfg.fault.t_start_s).toFixed(1) + 's';
  }

  function buildRole(cfg) {
    if (cfg.fault.family === 'none') return 'baseline';
    if (cfg.feedback_mode === 'monitor') return 'contrast';
    return 'fault';
  }

  function buildEvents(system, cfg, t, series) {
    var family = cfg.fault.family;
    if (family === 'none') return [];
    var def = findFaultDef(system, family);
    var p = def && def.params[0] ? def.params[0] : { unit: '', precision: 0 };
    var target = def ? def.target : 'none';
    var comp = findComponent(system, target);
    var tStart = cfg.fault.t_start_s;
    var magText = formatAmount(cfg.fault.params.magnitude, p);
    var targetSignal = (TARGET_SIGNAL[system.id] && TARGET_SIGNAL[system.id][family]) || 'P_load_demand_kW';
    var label = (def ? def.label : '故障') + ' ' + magText + ' @ ' + tStart.toFixed(1) + ' s';
    return [{
      event_id: 'EV-001',
      event_type: EVENT_TYPE[family] || 'fault',
      trigger_s: tStart,
      target_signal: targetSignal,
      target_component: target,
      magnitude: cfg.fault.params.magnitude,
      unit: p.unit,
      phase: 'onset',
      label: label,
      description: def ? def.description : '',
      target_component_label: comp ? comp.label : target,
      preSnapshotId: 'EV-001-pre',
      postSnapshotId: 'EV-001-post'
    }];
  }

  function buildSnapshots(system, cfg, t, series, events) {
    if (!events.length) return [];
    var ev = events[0];
    var dt = cfg.dt_s;
    var iPre = clamp(Math.round((ev.trigger_s - dt) / dt), 0, t.length - 1);
    var iPost = clamp(Math.round(ev.trigger_s / dt), 0, t.length - 1);
    function varsAt(idx) {
      var out = {};
      system.signals.forEach(function (sg) { out[sg.id] = series[sg.id] ? series[sg.id][idx] : null; });
      return out;
    }
    return [
      { snapshotId: ev.preSnapshotId, event_id: ev.event_id, t_s: t[iPre], phase: 'pre', variables: varsAt(iPre) },
      { snapshotId: ev.postSnapshotId, event_id: ev.event_id, t_s: t[iPost], phase: 'post', variables: varsAt(iPost) }
    ];
  }

  function buildTruth(system, cfg) {
    var family = cfg.fault.family;
    if (family === 'none') {
      return {
        faultFamily: 'none', faultId: null, faultActiveFrom_s: null, faultDuration_s: 0,
        peakMagnitude: 0, unit: '', effectiveFeedbackMode: 'healthy', affectedComponent: 'none'
      };
    }
    var def = findFaultDef(system, family);
    var p = def && def.params[0] ? def.params[0] : { unit: '' };
    return {
      faultFamily: family,
      faultId: cfg.fault.faultId,
      faultActiveFrom_s: cfg.fault.t_start_s,
      faultDuration_s: roundTo(cfg.duration_s - cfg.fault.t_start_s, 6),
      peakMagnitude: cfg.fault.params.magnitude,
      unit: p.unit,
      effectiveFeedbackMode: cfg.feedback_mode,
      affectedComponent: def ? def.target : 'none'
    };
  }

  /* ================================================================== */
  /* 因果链生成（模板来自 systems.js，数值证据来自 run）                    */
  /* ================================================================== */
  function interpolate(template, facts) {
    if (typeof template !== 'string') return '';
    return template.replace(/\{([A-Za-z0-9_]+)\}/g, function (m, key) {
      var v = facts[key];
      return v === undefined || v === null ? '—' : String(v);
    });
  }

  function buildCausalFacts(ctx) {
    var system = ctx.system;
    var cfg = ctx.config;
    var series = ctx.series;
    var t = ctx.t;
    var metrics = ctx.metrics;
    var dt = cfg.dt_s;
    var dur = cfg.duration_s;
    var tStart = cfg.fault.t_start_s;
    var family = cfg.fault.family;
    var def = findFaultDef(system, family);
    var param = def && def.params[0] ? def.params[0] : { unit: '', precision: 0 };
    var mag = cfg.fault.params.magnitude;
    var comp = findComponent(system, def ? def.target : '');

    function idxAt(time) { return clamp(Math.round(time / dt), 0, t.length - 1); }
    function at(id, time, precision) {
      var arr = series[id];
      if (!arr) return '—';
      return fmtVal(arr[idxAt(time)], precision);
    }
    function rangeValues(id, fromTime, toTime) {
      var arr = series[id];
      if (!arr) return null;
      var i0 = idxAt(fromTime);
      var i1 = idxAt(toTime);
      var min = Infinity;
      var max = -Infinity;
      for (var i = i0; i <= i1; i++) {
        var v = arr[i];
        if (v === null || !isFinite(v)) continue;
        if (v < min) min = v;
        if (v > max) max = v;
      }
      if (!isFinite(min) || !isFinite(max)) return null;
      return { min: min, max: max };
    }
    function metricVal(id) {
      var m = findMetric(metrics, id);
      if (!m || m.unavailable || m.value === null || m.value === undefined) return null;
      return m.value;
    }
    function metricFmt(id, precision) {
      var v = metricVal(id);
      return v === null ? '—' : fmtVal(v, precision);
    }
    function maxAbsFrom(id, fromTime) {
      var r = rangeValues(id, fromTime, dur);
      return r ? Math.max(Math.abs(r.min), Math.abs(r.max)) : null;
    }

    var facts = {
      t0: Number(tStart).toFixed(1),
      mag: formatMagnitude(mag, param.precision),
      unit: param.unit || '',
      sign: mag >= 0 ? '+' : '',
      faultLabel: def ? def.label : '故障',
      targetComponent: comp ? comp.label : (def ? def.target : '—')
    };

    if (system.id === 'FL-001') {
      var P_cap = Math.max(0, cfg.initial.load_kW);
      facts.I_meas_pre = at('I_bat_meas_A', tStart - 0.1, 2);
      facts.I_meas_post = at('I_bat_meas_A', tStart, 2);
      facts.I_true_post = at('I_bat_true_A', tStart, 2);
      facts.I_meas_26 = at('I_bat_meas_A', tStart + 6, 2);
      facts.I_true_26 = at('I_bat_true_A', tStart + 6, 2);
      facts.I_true_60 = at('I_bat_true_A', dur, 2);
      facts.I_ref = at('I_ref_A', tStart + 1, 2);
      facts.I_target = family === 'sensor_drift' ? fmtVal((P_cap - 20) / 0.4 - mag, 2) : at('I_ref_A', tStart + 1, 2);
      facts.P_bat_20 = at('P_bat_true_kW', tStart, 2);
      facts.P_bat_60 = at('P_bat_true_kW', dur, 2);
      facts.P_gen_20 = at('P_gen_true_kW', tStart, 2);
      facts.P_gen_60 = at('P_gen_true_kW', dur, 2);
      facts.P_load_60 = at('P_load_demand_kW', dur, 2);
      facts.P_load_pre = at('P_load_demand_kW', tStart - 0.1, 2);
      facts.P_load_post = at('P_load_demand_kW', tStart, 2);
      facts.r_meas_peak = fmtVal(maxAbsFrom('r_meas_kW', tStart), 2);
      facts.r_true_max = fmtVal(maxAbsFrom('r_true_kW', 0), 2);
      facts.E_bat = metricFmt('E_bat_kWh', 5);
      facts.E_gen = metricFmt('E_source_kWh', 5);
      facts.E_load = metricFmt('E_load_kWh', 5);
      facts.SOC_err = metricFmt('SOC_err_pp', 5);
      var iPk = rangeValues('I_bat_true_A', tStart, dur);
      facts.I_peak = iPk ? fmtVal(iPk.max, 2) : '—';
      var capVal = family === 'actuator_fault' ? null : null;
      facts.I_cap = at('I_bat_cap_A', dur, 2);
      if (facts.I_cap === '—' && family === 'actuator_fault') facts.I_cap = fmtVal(((P_cap - 20) / 0.4) * mag / 100, 2);
      void capVal;
      void facts.P_gen_20;
    } else if (system.id === 'FC-001') {
      facts.I_fc_meas_pre = at('I_fc_meas_A', tStart - 0.1, 2);
      facts.I_fc_meas_post = at('I_fc_meas_A', tStart, 2);
      facts.I_fc_pre = at('I_fc_true_A', tStart, 2);
      facts.I_fc_ref = at('I_fc_ref_A', tStart + 1, 2);
      facts.I_fc_target = fmtVal(Number(facts.I_fc_ref) - mag, 2);
      facts.I_fc_true_60 = at('I_fc_true_A', dur, 2);
      facts.P_fc_60 = at('P_fc_true_kW', dur, 2);
      facts.P_bat_60 = at('P_bat_true_kW', dur, 2);
      facts.I_bat_60 = at('I_bat_true_A', dur, 2);
      facts.I_fc_ref_60 = at('I_fc_ref_A', dur, 2);
      facts.I_fc_cap = at('I_fc_cap_A', Math.max(tStart + 0.1, 0), 2);
      if (facts.I_fc_cap === '—' && family === 'actuator_fault') facts.I_fc_cap = fmtVal(50 * mag / 100, 2);
      facts.r_meas_peak = fmtVal(maxAbsFrom('r_meas_kW', tStart), 2);
      facts.r_true_max = fmtVal(maxAbsFrom('r_true_kW', 0), 2);
      facts.E_load = metricFmt('E_load_kWh', 5);
      facts.E_fc = metricFmt('E_source_kWh', 5);
      facts.E_bat = metricFmt('E_bat_kWh', 5);
      facts.SOC_err = metricFmt('SOC_err_pp', 5);
      facts.valve_cmd = at('valve_cmd_pct', dur, 0);
      facts.valve_meas = at('valve_meas_pct', dur, 0);
      facts.valve_meas_pre = at('valve_meas_pct', tStart - 0.1, 0);
      facts.P_load_pre = at('P_load_demand_kW', tStart - 0.1, 2);
      facts.P_load_post = at('P_load_demand_kW', tStart, 2);
    } else if (system.id === 'GT-001') {
      facts.n_rpm = formatMagnitude(mag * 60, 1);
      facts.f_gov_post = fmtVal(50 + mag, 1);
      facts.f_meas_pre = at('f_meas_Hz', tStart - 0.1, 1);
      facts.f_true_60 = at('f_true_Hz', dur, 2);
      facts.P_bat_60 = at('P_bat_true_kW', dur, 2);
      facts.P_gen_60 = at('P_gen_true_kW', dur, 2);
      facts.P_load_60 = at('P_load_demand_kW', dur, 2);
      facts.P_load_pre = at('P_load_demand_kW', tStart - 0.1, 2);
      facts.P_load_post = at('P_load_demand_kW', tStart, 2);
      facts.r_meas_peak = fmtVal(maxAbsFrom('r_meas_kW', 0), 2);
      facts.r_true_max = fmtVal(maxAbsFrom('r_true_kW', 0), 2);
      var fRange = rangeValues('f_true_Hz', tStart, dur);
      facts.f_nadir = fRange ? fmtVal(fRange.min, 2) : '—';
      facts.f_nadir_dev = fRange ? fmtVal(fRange.min - 50, 2) : '—';
      var pbatRange = rangeValues('P_bat_true_kW', tStart, dur);

      runId: runId,
      runShortHash: configHash.slice(0, 8),
      systemId: system.id,
      label: label,
      role: role,
      createdAt: createdAt,
      status: 'completed',
      config: deepClone(cfg),
      configHash: configHash,
      modelHash: modelHash,
      engineVersion: ENGINE_VERSION,
      modelManifest: deepClone(manifest),

  /* ================================================================== */

    if (!arr) throw new Error('FL.core.sampleAt：未知信号 ' + signalId);

    var dt = run.config.dt_s;

    return { value: arr[idx], index: idx, t: ts[idx] };
  }

  function sampleAll(run, time, options) {
    options = options || {};

    if (!run || !run.timeseries) return out;
    var categories = options.categories || null;
    var visible = options.visible || null;
    var dt = run.config.dt_s;
    var idx = clamp(Math.round(time / dt), 0, run.timeseries.t.length - 1);
    (run.signals || []).forEach(function (sg) {
      if (categories && categories.indexOf(sg.category) === -1) return;
      if (visible && visible[sg.id] === false) return;

    options = options || {};

    var arr = run.timeseries.signals[signalId];
    var dt = run.config.dt_s;
    var i0 = clamp(Math.round(t0 / dt), 0, ts.length - 1);
    var i1 = clamp(Math.round(t1 / dt), 0, ts.length - 1);
    var step = Math.max(1, Math.round(options.step || 1));
    var out = [];
    if (i0 <= i1) {
      for (var i = i0; i <= i1; i += step) out.push([ts[i], arr[i]]);

    var bLoad = baselineRun.timeseries.signals.P_load_demand_kW;
    var tLoad = trialRun.timeseries.signals.P_load_demand_kW;
    var sameLoad = allEqualNumbers(bLoad, tLoad, 1e-9);
    addCheck('load-profile', '负载需求曲线一致', sameLoad,
      sameLoad ? '两个运行的负载需求曲线一致' : '负载需求曲线不一致（如 load_step），不能把差异归因于传感器/执行器故障');

        typeof bm.value === 'number' && typeof tm.value === 'number') {

    var findings = [];
    var warnings = [];
    checks.forEach(function (c) { if (c.status === 'fail') warnings.push(c.label + '：' + c.message); });

    function pairOf(id) {

    }

    var pBat = pairOf('E_bat_kWh');
    if (pBat && pBat.delta !== null) {
      findings.push({
        id: 'F1',
        title: '电池真实电能变化',
        text: '试验组电池真实电能（带符号）相对基准变化 ' + signed(pBat.delta, 5) + ' kWh' +
          (pBat.delta < 0 ? '：电池真实放电减少，这部分需求由电源侧补足，不是能量损失。' : '。'),

    var pSrc = pairOf('E_source_kWh');
    if (pSrc && pSrc.delta !== null) {
      findings.push({
        id: 'F2',
        title: '电源真实电能变化',
        text: '试验组电源真实电能相对基准变化 ' + signed(pSrc.delta, 5) + ' kWh，用于补偿电池侧的变化；总负载需求仍由两侧共同满足。',

      findings.push({
        id: 'F3',
        title: '焦点信号实际变化量',
        text: '从故障时刻起，' + (pFocal.trial.signal_label || pFocal.trial.signal_id || '焦点信号') +
          ' 的实际变化量为 ' + signed(pFocal.trial.value, 2) + ' ' + pFocal.deltaUnit + '（focal_change，可用于替代"诊断延迟"表述）。',

        title: 'SOC 估计误差',
        text: '试验组 SOC 估计误差（估计−真实）为 ' + signed(pSocErr.trial.value, 5) + ' pp，来自测量/估计口径偏差，不代表真实能量差异。',
        metric_ids: ['SOC_err_pp'],

        metric_ids: ['max_abs_r_meas_kW', 'max_abs_r_true_kW'],

    return {
      valid: !failed,
      diffAllowed: diffAllowed,
      checks: checks,
      pairs: pairs,

      warnings: warnings,
      baselineRunId: baselineRun.runId,

  }

  /* ================================================================== */
  /* fmt：优先委托 FL.protocol.fmt（Lead 提供），否则本地兜底              */
  /* ================================================================== */

    var prev = null;
    for (var i = 0; i < arr.length; i++) {

      if (!isNum(v)) { prev = null; continue; }

    if (!arr) return null;

    for (var i = 0; i < arr.length; i++) {

    if (!arr) return null;
    var startIdx = indexAt(t, tStart);

    for (var i = startIdx; i < arr.length; i++) {
      if (!isNum(arr[i])) continue;
      if (Math.abs(arr[i] - 50) > tol) lastBad = i;
    }

    if (lastBad >= arr.length - 1) return null;

    if (!system || !system.faults) return null;
    for (var i = 0; i < system.faults.length; i++) if (system.faults[i].family === family) return system.faults[i];

  }

  function compute(ctx) {
    var system = ctx.system;
    var cfg = ctx.config;
    var t = ctx.t;
    var series = ctx.series;
    var runId = ctx.runId;
    var duration = cfg.duration_s;
    var family = cfg.fault.family;
    var faulted = family !== 'none';
    var tStart = faulted ? cfg.fault.t_start_s : null;
    var def = findFaultDef(system, family);
    var param = def && def.params[0] ? def.params[0] : { unit: '', precision: 2 };
    var magnitude = faulted ? cfg.fault.params.magnitude : null;
    var noiseEnabled = !!(cfg.noise && cfg.noise.enabled);

    var metrics = [];
    function mk(id, label, value, unit, precision, method, extra) {
      var available = isNum(value);
      var m = {
        metric_id: id,
        label: label,
        value: available ? value : null,
        unit: unit || '',
        precision: precision == null ? 3 : precision,
        time_window: [0, duration],
        method: method || '',
        source_run_ids: [runId],
        source_kind: 'DERIVED',
        focal: false,
        unavailable: !available
      };
      if (extra) {
        Object.keys(extra).forEach(function (k) { m[k] = extra[k]; });
      }

    var eLoad = integrate(t, series.P_load_demand_kW);
    var eServed = integrate(t, series.P_load_served_kW);

      if (isNum(integrals.E_load)) eServed = integrals.E_load;
      if (isNum(integrals.E_source)) eSource = integrals.E_source;
      if (isNum(integrals.E_bat)) eBat = integrals.E_bat;
    }
    var srcLabel = system.id === 'FC-001' ? '电堆真实电能' : '发电机真实电能';

    mk('E_load_kWh', '负载需求电能', eLoad === null ? null : eLoad / 3600, 'kWh', 5,
      '∫ P_load,demand dt / 3600（需求，非实际服务）');
    mk('E_load_served_kWh', '负载实际服务电能', eServed === null ? null : eServed / 3600, 'kWh', 5,
      '∫ P_load,served dt / 3600');
    mk('E_source_kWh', srcLabel, eSource === null ? null : eSource / 3600, 'kWh', 5,
      '∫ ' + srcSig + ' dt / 3600（' + srcLabel + '）');
    mk('E_bat_kWh', '电池真实电能（带符号）', eBat === null ? null : eBat / 3600, 'kWh', 5,
      '∫ P_bat,true dt / 3600；放电为正');

    /* ---- SOC ---- */
    var socTrueEnd = lastValue(series.SOC_true_pct);
    var socEstEnd = lastValue(series.SOC_est_pct);
    mk('SOC_true_end_pct', '真实 SOC 末值', socTrueEnd, '%', 5,
      '由真实电池功率积分得到的 SOC（末采样值）');
    mk('SOC_est_end_pct', '估计 SOC 末值', socEstEnd, '%', 5,
      '由测量/估计链路积分得到的 SOC（末采样值）');
    var socErr = (isNum(socTrueEnd) && isNum(socEstEnd)) ? (socEstEnd - socTrueEnd) : null;
    mk('SOC_err_pp', 'SOC 估计误差（估计−真实）', socErr, 'pp', 5,
      'SOC_est − SOC_true，单位百分**点** pp');

    /* ---- 残差 ---- */
    mk('max_abs_r_true_kW', '最大真实功率平衡残差', maxAbs(series.r_true_kW), 'kW', 6,
      'max |r_true|，理想模型下趋近 0');
    mk('max_abs_r_meas_kW', '最大测量一致性残差', maxAbs(series.r_meas_kW), 'kW', 4,
      'max |r_meas|；故障期非零来自测量偏差，不是能量损失');

    /* ---- 故障元数据 ---- */
    mk('fault_active_s', '故障激活时刻', faulted ? tStart : null, 's', 1,
      faulted ? '故障事件 onset 时刻' : '无故障运行');
    mk('fault_duration_s', '故障持续时长', faulted ? (duration - tStart) : 0, 's', 1,
      faulted ? 'duration_s − t_start_s（故障持续到仿真结束）' : '无故障运行，时长为 0');
    mk('fault_peak_magnitude', '故障峰值幅值', faulted ? magnitude : null, param.unit || '', 2,
      faulted ? ('故障参数 magnitude，单位 ' + (param.unit || '—')) : '无故障运行');

    var modeValue = faulted ? cfg.feedback_mode : 'healthy';
    metrics.push({
      metric_id: 'effective_mode',
      label: '实际生效的控制模式',
      value: modeValue,
      unit: '',
      precision: 0,
      time_window: [0, duration],
      method: '配置的 feedback_mode；无故障时记为 healthy',
      source_run_ids: [runId],
      source_kind: 'CONFIG',
      focal: false,
      unavailable: false
    });

    /* ---- focal_change：从故障时刻起的实际焦点信号变化量 ---- */
    var focalSig = FOCAL_SIGNAL[system.id];
    var focalMeta = null;
    if (system.signals) {
      for (var i = 0; i < system.signals.length; i++) if (system.signals[i].id === focalSig) focalMeta = system.signals[i];
    }
    var focalValue = null;
    if (faulted && focalSig) {
      var fEnd = valueAt(t, series[focalSig], duration);
      var fStart = valueAt(t, series[focalSig], tStart);
      if (isNum(fEnd) && isNum(fStart)) focalValue = fEnd - fStart;
    }
    mk('focal_change', '焦点信号实际变化量（故障时刻→结束）', focalValue,
      focalMeta ? focalMeta.unit : '', 2,
      faulted ? ('∫ 从 t_start_s 到 duration_s 的 ' + focalSig + ' 变化量（末值−故障时刻值）') : '无故障运行，不适用',
      {
        focal: true,
        signal_id: focalSig,
        signal_label: focalMeta ? focalMeta.label : focalSig,
        time_window: faulted ? [tStart, duration] : [0, duration]
      });

    /* ---- GT-001 专属：频率最低点 / 恢复时间 / 转子动能 ---- */
    if (system.id === 'GT-001') {
      var fArr = series.f_true_Hz;
      var fMin = minValue(fArr, 0);
      var fStartIdx = faulted ? indexAt(t, tStart) : 0;
      var fMinAfter = minValue(fArr, fStartIdx);
      mk('f_nadir_Hz', '真实频率最低点', fMinAfter, 'Hz', 3,
        '故障后真实频率的最小值（转子惯量响应）');
      var recovery = faulted ? recoveryTime(t, fArr, tStart, FREQ_RECOVERY_TOL) : null;
      mk('f_recovery_s', '频率恢复时间（|Δf| ≤ 0.1 Hz）', recovery, 's', 1,
        '故障后最后一次 |f−50| > 0.1 Hz 之后的时间；未完全恢复记为不可用', { focal: false });
      var fFirst = valueAt(t, fArr, 0);
      var fLast = valueAt(t, fArr, duration);
      var eRotor = (isNum(fFirst) && isNum(fLast)) ? (5.0 * (fLast - fFirst)) / 3600 : null;
      mk('E_rotor_kWh', '转子动能变化（电能当量）', eRotor, 'kWh', 6,
        'K_J × (f_end − f_start) / 3600，K_J = 5.0 kW·s/Hz');
      void fMin;
      void noiseEnabled;
    }

    return metrics;
  }

  FL.core.metrics = { compute: compute };
})();

  <script>

          ' s / post@' + snapshots[1].t_s.toFixed(1) + ' s 快照含 ' + Object.keys(snapshots[0].variables).length + ' 个变量')
        : ('事件窗口检查失败：网格' + (gridAligned ? 'OK' : '异常') + '，事件' + (evAligned ? 'OK' : '异常') +
          '，pre 快照' + (preOk ? 'OK' : '异常') + '，post 快照' + (postOk ? 'OK' : '异常'));
