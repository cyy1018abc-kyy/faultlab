          el('div', { class: 'cp-finding-main' }, [
            el('div', { class: 'cp-finding-title' }, [
              el('span', {}, finding.title || '发现'),
              finding.severity ? UI.badge(finding.severity === 'info' ? '信息' : String(finding.severity), {
                tone: finding.severity === 'warn' ? 'warn' : finding.severity === 'danger' ? 'danger' : 'info'
              }) : null
            ]),
            el('div', { class: 'cp-finding-text' }, finding.text || ''),
            (finding.metric_ids && finding.metric_ids.length) ? chips : null
          ])
        ]));
      });
    }
    if (comp && comp.warnings && comp.warnings.length) {
      findBody.appendChild(el('div', { class: 'cp-warning-list' }, [
        el('div', { class: 'eyebrow mb-8' }, '对比警告'),
        el('ul', { class: 'cp-bullets' }, comp.warnings.map((w) => el('li', {}, w)))
      ]));
    }
    findCard.appendChild(findBody);
    grid.appendChild(findCard);

    const limCard = el('section', { class: 'fl-panel cp-lim-card' });
    limCard.appendChild(el('div', { class: 'panel-head' }, [
      el('div', { class: 'panel-head-main' }, [
        el('span', { class: 'panel-title' }, '模型局限与数据性质'),
        el('span', { class: 'panel-sub' }, '解释结论前必须阅读')
      ])
    ]));
    const limBody = el('div', { class: 'panel-body cp-lim-body' });
    const limits = (system && system.model && system.model.limitations) || [];
    if (limits.length) {
      limBody.appendChild(el('ul', { class: 'cp-bullets' }, limits.map((t) => el('li', {}, t))));
    } else {
      limBody.appendChild(el('p', { class: 'muted small' }, '模型未提供局限条目。'));
    }
    limBody.appendChild(el('div', { class: 'cp-data-nature' }, [
      UI.badge('数据性质：L0 行为级演示', { tone: 'warn', icon: 'flask' }),
      el('p', {}, '数据性质：解析/行为级（L0）演示数据，不是 Simulink 运行结果、不是现场数据、也不是实测结论。' +
        '所有结论可回溯到运行 ID、模型哈希与配置哈希。')
    ]));
    if (data.baseline && data.trial) {
      limBody.appendChild(el('div', { class: 'cp-ids mono' }, [
        el('span', {}, '基准 ' + data.baseline.runId + ' · model ' + FMT.hash(data.baseline.modelHash) + ' · config ' + FMT.hash(data.baseline.configHash)),
        el('span', {}, '试验 ' + data.trial.runId + ' · model ' + FMT.hash(data.trial.modelHash) + ' · config ' + FMT.hash(data.trial.configHash))
      ]));
    }
    limCard.appendChild(limBody);
    grid.appendChild(limCard);
    host.appendChild(grid);
  }

  /* -------------------------------------------------------------- exports */
  function busyButton(btn, fn) {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.dataset.loading = 'true';
    let settled = false;
    const finish = (err) => {
      if (settled) return;
      settled = true;
      btn.removeAttribute('data-loading');
      btn.disabled = false;
      if (err) act('toast', (btn.dataset.label || '导出') + '失败：' + (err && err.message ? err.message : String(err)), 'danger');
    };
    try {
      const res = fn();
      if (res && typeof res.then === 'function') res.then(() => finish(null)).catch((e) => finish(e));
      else delayFrame(() => finish(null));
    } catch (e) {
      finish(e);
    }
  }

  function validationFailed(data) {
    if (data.comparison && data.comparison.valid === false) return true;
    return !!(data.trial && data.trial.quality && data.trial.quality.some((q) => q.status === 'fail'));
  }

  function exportButtons(data) {
    const exporter = apiRef.exporter;
    const trial = data.trial;
    const baseline = data.baseline;
    const comp = data.comparison;
    const system = systemOf((trial && trial.systemId) || apiRef.getState().systemId);
    const failed = validationFailed(data);
    const buttons = [];

    const make = (label, icon, handler, opts) => {
      const o = opts || {};
      const btn = el('button', {
        class: 'btn ' + (o.primary ? 'btn-primary' : 'btn-ghost') + ' btn-sm cp-export-btn',
        type: 'button',
        disabled: !!o.disabled,
        title: o.title || label,
        dataset: { label: label },
        on: { click: () => { if (!o.disabled) busyButton(btn, handler); } }
      }, [UI.icon(icon, { size: 13 }), el('span', {}, label)]);
      return btn;
    };

    buttons.push(make('下载试验 CSV', 'download', () => {
      if (!exporter || !exporter.csv) throw new Error('导出模块 FL.exporter 未就绪');
      const text = exporter.csv(trial);
      const name = exporter.csvFilename(trial);
      exporter.download(name, text, 'text/csv;charset=utf-8');
      act('toast', '已导出试验 CSV：' + name, 'ok');
    }, { primary: true, disabled: !trial || !exporter, title: trial ? '导出 ' + trial.runId + ' 的 601 点原始采样' : '需要试验运行' }));

    buttons.push(make('下载配置清单 JSON', 'copy', () => {
      if (!exporter || !exporter.configManifest) throw new Error('导出模块 FL.exporter 未就绪');
      const manifest = exporter.configManifest(trial);
      const name = exporter.jsonFilename(trial, 'config-manifest');
      exporter.download(name, JSON.stringify(manifest, null, 2), 'application/json;charset=utf-8');
      act('toast', '已导出配置清单：' + name, 'ok');
    }, { disabled: !trial || !exporter, title: trial ? '导出运行配置、模型清单、质量检查与哈希' : '需要试验运行' }));

    buttons.push(make('下载 HTML 报告', 'external', () => {
      if (!exporter || !exporter.htmlReport) throw new Error('导出模块 FL.exporter 未就绪');
      const html = exporter.htmlReport({ baseline: baseline, trial: trial, comparison: comp, system: system });
      const name = exporter.reportFilename(trial);
      exporter.download(name, html, 'text/html;charset=utf-8');
      act('toast', failed ? '已导出 HTML 报告（已标记验证未通过，仅排障用途）' : '已导出 HTML 报告：' + name, failed ? 'warn' : 'ok');
    }, { disabled: !trial || !exporter, title: trial ? '生成自包含 HTML 报告（含配置、指标、校验与可信度标签）' : '需要试验运行' }));

    buttons.push(make('复制分享摘要', 'copy', () => {
      if (!exporter || !exporter.summaryText || !exporter.copyText) throw new Error('导出模块 FL.exporter 未就绪');
      const text = exporter.summaryText({ baseline: baseline, trial: trial, comparison: comp });
      return exporter.copyText(text).then((ok) => {
        act('toast', ok ? '分享摘要已复制到剪贴板' : '复制失败：浏览器未授权剪贴板，请手动查看摘要', ok ? 'ok' : 'warn');
        if (!ok) throw new Error('剪贴板不可用');
      });
    }, { disabled: !trial || !exporter, title: trial ? '复制一段纯文本对比摘要（含一致性检查结果）' : '需要试验运行' }));

    buttons.push(make('下载证据包 JSON', 'shield', () => {
      if (!exporter || !exporter.evidenceBundle) throw new Error('导出模块 FL.exporter 未就绪');
      const bundle = exporter.evidenceBundle({ baseline: baseline, trial: trial, comparison: comp });
      const name = exporter.jsonFilename(trial, failed ? 'evidence_validation_failed' : 'evidence');
      exporter.download(name, JSON.stringify(bundle, null, 2), 'application/json;charset=utf-8');
      act('toast', failed ? '已导出证据包（validation_failed：内容已标注验证未通过）' : '已导出证据包：' + name, failed ? 'warn' : 'ok');
    }, { disabled: !trial || !exporter, title: trial ? '导出数据/配置/事件/校验与哈希；验证未通过时文件名与内容都会标注' : '需要试验运行' }));

    return buttons;
  }

  function renderExport(data) {
    const host = refs.export;
    UI.clear(host);
    const panel = el('section', { class: 'fl-panel cp-export' });
    const exporterReady = !!(apiRef.exporter && apiRef.exporter.csv);
    const failed = validationFailed(data);
    panel.appendChild(el('div', { class: 'panel-head' }, [
      el('div', { class: 'panel-head-main' }, [
        el('span', { class: 'panel-title' }, '导出与分享'),
        el('span', { class: 'panel-sub' }, '导出基于不可变 Run 与其完整原始数据')
      ]),
      el('div', { class: 'cp-export-status' }, [
        failed
          ? UI.badge('验证未通过 · 仅排障用途', { tone: 'danger', icon: 'warning' })
          : (data.comparison ? UI.badge('演示级校验通过', { tone: 'ok', icon: 'check' }) : UI.badge('等待对比数据', { tone: 'neutral', icon: 'clock' }))
      ])
    ]));
    const body = el('div', { class: 'panel-body cp-export-body' });
    const row = el('div', { class: 'cp-export-row' });
    exportButtons(data).forEach((b) => row.appendChild(b));
    body.appendChild(row);
    [
      'CSV 导出试验运行的 601 点全精度采样；配置清单含 config / model / quality / hashes。',
      'HTML 报告是自包含文件；证据包在 validation_failed 时会在文件名与内容中标注「验证未通过」，不生成"验证通过"字样。',
      '分享摘要为纯文本，可用于提交排障材料。'
    ].forEach((n) => body.appendChild(el('p', { class: 'cp-export-note' }, n)));
    if (!exporterReady) {
      body.appendChild(el('div', { class: 'notice', 'data-tone': 'warn' }, [
        UI.icon('warning', { size: 14 }),
        el('div', {}, '导出模块 FL.exporter 尚未就绪，导出按钮暂不可用。')
      ]));
    }
    panel.appendChild(body);
    host.appendChild(panel);
  }

  /* ----------------------------------------------------------- render all */
  function renderAll(state) {
    const runs = resolveRuns(state);
    const cmp = getComparison(runs.baseline, runs.trial);
    const data = {
      state: state,
      list: runs.list,
      baseline: runs.baseline,
      trial: runs.trial,
      comparison: cmp.result,
      comparisonError: cmp.error
    };
    lastData = data;

    renderHead(data);
    renderNotices(data);
    renderEmpty(data);
    const both = !!(runs.baseline && runs.trial);
    refs.metrics.hidden = !both;
    refs.view.hidden = !both;
    refs.findings.hidden = !both;
    if (both) {
      renderMetrics(data);
      renderView(data);
      renderFindings(data);
    } else {
      UI.clear(refs.metrics);
      UI.clear(refs.view);
      UI.clear(refs.findings);
    }
    renderExport(data);
    refs.head.hidden = false;
    refs.notices.hidden = false;
    refs.export.hidden = false;
  }

  function syncCursor(state) {
    charts.forEach((item) => {
      try { item.chart.setCursor(state.currentTime); } catch (e) { /* ignore */ }
    });
    if (refs && refs.viewNow && refs.viewNow.isConnected) refs.viewNow.textContent = 't = ' + FMT.time(state.currentTime);
  }

  function renderKey(state) {
    const ps = pageState(state);
    const runs = resolveRuns(state);
    return [
      runs.baseline ? runs.baseline.runId : 'no-base',
      runs.trial ? runs.trial.runId : 'no-trial',
      ps.view || 'overlay',
      ps.signalId || '',
      runs.list.length,
      checksOpen ? 'c1' : 'c0',
      Object.keys(expandedCats).filter((k) => expandedCats[k]).join(','),
      state.truthSealed ? 'sealed' : 'open',
      state.mode || ''
    ].join('|');
  }

  function onResize() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      charts.forEach((item) => { try { item.chart.resize(); } catch (e) { /* ignore */ } });
    }, 140);
  }

  /* ------------------------------------------------------------- page def */
  pages['compare'] = {
    id: 'compare',
    label: '结果对比',
    navLabel: '对比',
    mount(root, api) {
      apiRef = api;
      el = api.el;
      UI = api.ui;
      FMT = api.fmt;
      buildSkeleton(root);
      window.addEventListener('resize', onResize);
    },
    update(state, reason) {
      if (!refs) return;
      if (state.truthSealed) {
        const key = 'sealed';
        if (key !== lastKey) {
          lastKey = key;
          destroyCharts();
          UI.clear(refs.head);
          UI.clear(refs.notices);
          UI.clear(refs.metrics);
          UI.clear(refs.view);
          UI.clear(refs.findings);
          UI.clear(refs.export);
          refs.empty.hidden = false;
          UI.clear(refs.empty);
          const panel = el('div', { class: 'fl-panel cp-empty-panel' });
          panel.appendChild(UI.emptyState({
            icon: 'lock', title: '盲测进行中：真值相关页面已封存',
            desc: '比赛结束后结果对比页自动解锁。'
          }));
          refs.empty.appendChild(panel);
        }
        return;
      }
      if (state.page !== 'compare') {
        lastKey = '';
        return;
      }
      const key = renderKey(state);
      if (key !== lastKey) {
        lastKey = key;
        renderAll(state);
      } else if (reason === 'time' || reason === 'playback' || reason === 'run' || reason === 'all') {
        syncCursor(state);
      }
    }
  };
})();

  <script>
/* ===== src/ui/pages/arena.js ===== */
/* owner: arena-agents | module: page-arena | contract: docs/CONTRACT.md */
/* =========================================================================
   Agent 竞技场页面

   - 口径说明：评分权重、盲测设计、内置确定性 Agent 强项/弱项
   ========================================================================= */
(function () {
  'use strict';
  const FL = window.FL = window.FL || {};
  const pages = FL.pages = FL.pages || {};

  const FAMILY_LABEL = {
    sensor_drift: '传感器漂移',

    actuator_fault: '执行器异常',

    threshold: '阈值规则',
    'model-based': '模型残差',
    statistical: '统计变点',
    probabilistic: '概率模型',
    fusion: '多信号融合',
    'rule-based': '规则',
    external: '外部导入'
  };
  const DIMS = [
    ['detection', '检测'],
    ['family', '家族'],
    ['component', '部件'],
    ['magnitude', '幅值'],
    ['latency', '延迟'],
    ['calibration', '校准']
  ];
  const FALLBACK_SPEC = {
    weights: { detection: 0.20, family: 0.25, component: 0.10, magnitude: 0.15, latency: 0.15, calibration: 0.15 },
    falseAlarmPenalty: 10,
    latencyWindow_s: 12,
    healthyRatio: 0.2
  };
  const FALLBACK_AGENTS = [
    { id: 'sensor-limit', name: '固定阈值报警', family: 'threshold', description: '固定阈值越限报警基线。', strengths: '简单、快。', weaknesses: '不分析指令-反馈偏差。' },
    { id: 'fusion', name: '多信号融合', family: 'fusion', description: '多信号融合诊断。', strengths: '覆盖全面。', weaknesses: '阈值人工设定。' }
  ];

  let api = null;
  let ui = null;
  let h = null;
  const refs = {};
  const local = {
    built: false,
    running: false,
    showTruth: true,
    externalAgents: [],
    extSeq: 0,
    matchError: '',
    renderKey: '',
    progress: 0,
    progressText: '',
    autorunPending: false,
    agentCatalog: []
  };

  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function ns() { return (api && api.FL) || FL; }
  function fmt() { return (api && api.fmt) ? api.fmt : FL.protocol.fmt; }  function arenaState() {
    const st = api.getState();
    return (st.pageState && st.pageState.arena) || {};
  }
  function setupState() {
    const a = arenaState();
    return a.setup || { systemId: 'FL-001', rounds: 6, seed: 20261027, noise: false, agentIds: [] };
  }
  function scoringSpec() {

  function catalog() {

    }

  }
  function systemList() {

      const list = api.systems && api.systems.list ? api.systems.list() : [];

    } catch (e) { /* ignore */ }

      { id: 'FL-001', title: '电池储能系统', shortTitle: '电池储能', experimentCode: 'FL-001' },
      { id: 'FC-001', title: '燃料电池系统', shortTitle: '燃料电池', experimentCode: 'FC-001' },
      { id: 'GT-001', title: '燃气涡轮系统', shortTitle: '燃气涡轮', experimentCode: 'GT-001' }
    ];
  }
  function systemTitle(systemId) {
    const list = systemList();
    for (let i = 0; i < list.length; i++) if (list[i].id === systemId) return list[i].shortTitle || list[i].title || systemId;
    return systemId;
  }
  function componentMap(systemId) {
    const map = {};

      const sys = api.systems.get(systemId);

    } catch (e) { /* ignore */ }
    return map;
  }
  function componentLabel(map, id) {
    if (!id || id === 'none') return '无';
    return map[id] || id;
  }
  function familyLabel(id) { return FAMILY_LABEL[id] || id || '—'; }

  function magText(mag) {
    if (!mag || !isNum(mag.value)) return '—';
    const unit = mag.unit || '';
    const digits = unit === '%' ? 0 : (unit === 'Hz' ? 2 : 1);
    return fmt().num(mag.value, digits) + (unit ? ' ' + unit : '');
  }
  function modeLabel(mode) {
    if (mode === 'monitor') return '仅监测';

  }
  function pctOrDash(v) {
    if (!isNum(v)) return '—';
    return fmt().num(v * 100, 1) + '%';
  }
  function scoreTone(total) {
    if (!isNum(total)) return 'neutral';
    if (total >= 90) return 'ok';
    if (total >= 70) return 'warn';
    return 'danger';
  }
  function arenaReady() {

  function downloadText(filename, text, mime) {
    const F = ns();

      }
    } catch (e) { /* fall through */ }
    try {
      const blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: filename, class: 'sr-only' });
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {

        URL.revokeObjectURL(url);

      return true;
    } catch (e) {
      return false;
    }
  }

  /* ===================================================================
     mount / build
     =================================================================== */
  function mount(rootEl, pageApi) {

  function buildHero() {

  function buildSealBanner() {
    refs.sealBanner = h('div', { class: 'arena-seal', hidden: true, role: 'status', 'aria-live': 'polite' }, [
      h('span', { class: 'arena-seal-icon' }, [ui.icon('lock', { size: 18 })]),

  function buildProgress() {

    refs.progressText = h('span', { class: 'arena-progress-text' }, '准备生成隐藏场景…');

      h('div', { class: 'arena-progress-head' }, [
        h('span', { class: 'arena-progress-icon' }, [ui.icon('lock', { size: 16 })]),

        ]),

    const rows = DIMS.map(([key, label]) => h('tr', {}, [
      h('td', {}, label),
      h('td', { class: 'mono num' }, fmt().num((w[key] || 0) * 100, 0) + '%'),
      h('td', { class: 'arena-spec-rule' }, specRuleText(key))
    ]));
    const agents = local.agentCatalog;
    const roster = agents.map((a) => h('div', { class: 'arena-roster-item' }, [
      h('div', { class: 'arena-roster-head' }, [
        h('span', { class: 'arena-roster-name' }, a.name),
        ui.badge(agentFamilyLabel(a.family), { tone: a.family === 'fusion' ? 'acc' : 'neutral' })
      ]),
      h('p', { class: 'arena-roster-desc' }, a.description || ''),
      h('p', { class: 'arena-roster-strength' }, [h('strong', {}, '强项 '), a.strengths || '—']),
      h('p', { class: 'arena-roster-weak' }, [h('strong', {}, '弱项 '), a.weaknesses || '—'])
    ]));
    return h('section', { class: 'fl-panel arena-spec' }, [
      h('div', { class: 'panel-head' }, [
        h('div', { class: 'panel-head-main' }, [
          h('span', { class: 'eyebrow' }, 'CALIBRATION'),
          h('span', { class: 'panel-title' }, '口径说明'),
          h('span', { class: 'panel-sub' }, '评分公式、盲测设计与算法边界')
        ])
      ]),
      h('div', { class: 'panel-body arena-spec-body' }, [
        h('div', { class: 'arena-spec-col' }, [
          h('div', { class: 'eyebrow mb-8' }, '评分权重（单轮 100 分）'),
          h('table', { class: 'arena-table' }, [
            h('thead', {}, [h('tr', {}, [h('th', {}, '维度'), h('th', {}, '权重'), h('th', {}, '口径')])]),
            h('tbody', {}, rows)
          ]),
          h('p', { class: 'arena-spec-note' }, '总分 = 100 × Σ(权重 × 得分) − 10 × 健康局误报，单轮最低 0 分；排行榜取各轮平均分。盲测数据包只含观测样本与评分口径，不含真值。'),
          h('div', { class: 'eyebrow mb-8 mt-16' }, '盲测设计'),
          h('ul', { class: 'arena-list' }, [
            h('li', {}, '每轮约 20% 概率为健康局；轮数 ≥3 时若随机结果没有健康局，会把中间一轮替换为健康局，保证误报率有数据可查。'),
            h('li', {}, '故障家族、幅值、注入时刻在故障目录范围内随机；闭环/仅监测模式随机；观测噪声可选且确定性。'),
            h('li', {}, 'Agent 只收到 blindVisible 观测流，按 0.1 s 顺序在线 observe；t=60 s 统一收卷。'),
            h('li', {}, '比赛期间 truthSealed=true，shell 禁用真值相关页面；结束后自动解封并揭晓真值。'),
            h('li', {}, '导出帧 truth_sealed:true，递归扫描禁止 truth / *_true_* / bias / cap / 故障配置字段。')
          ])
        ]),
        h('div', { class: 'arena-spec-col' }, [
          h('div', { class: 'eyebrow mb-8' }, '内置 Agent 名单（确定性算法，非 LLM）'),
          h('div', { class: 'arena-roster' }, roster.length ? roster : h('div', { class: 'notice', 'data-tone': 'warn' }, 'FL.agents 未就绪。')),
          h('p', { class: 'arena-spec-note mt-12' }, '对外协议版本 arena_version: "0.1"，为未来真实 AI / LLM Agent 预留。当前页面运行时只运行上述确定性算法。')
        ])
      ])
    ]);
  }

  function specRuleText(key) {
    if (key === 'detection') return '故障局正确报警 / 健康局未报警';
    if (key === 'family') return '故障家族正确（健康局按未报警计）';
    if (key === 'component') return '受影响部件正确（健康局按未报警计）';
    if (key === 'magnitude') return 'max(0, 1 − |估计−真值|/真值)，单位一致';
    if (key === 'latency') return 'max(0, 1 − (首报时刻−故障时刻)/12 s)';
    if (key === 'calibration') return '1 − Brier(confidence, 是否故障)';
    return '';
  }

  /* ===================================================================
     setup interactions
     =================================================================== */
  function applySetupPatch(patch) {
    const cur = setupState();
    const next = Object.assign({}, cur, patch || {});
    api.actions.setArenaState({ setup: next });
    syncSetupControls(next, false);
  }

  function onAgentSelectionChange() {
    let selected = [];
    refs.agentGrid.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
      if (cb.checked) selected.push(cb.value);
    });
    if (!selected.length) {
      const first = refs.agentGrid.querySelector('input[type="checkbox"]');
      if (first) first.checked = true;
      selected = first ? [first.value] : [];
      showSetupError('至少保留 1 个 Agent，已自动恢复选择。');
    } else if (!local.running) {
      showSetupError('');
    }
    const cur = setupState();
    api.actions.setArenaState({ setup: Object.assign({}, cur, { agentIds: selected }) });
    updateAgentCount(selected.length);
  }

  function updateAgentCount(n) {
    refs.agentCount.textContent = '已选 ' + n + ' / ' + local.agentCatalog.length;
  }

  function setAllAgents(checked) {
    if (checked) {
      refs.agentGrid.querySelectorAll('input[type="checkbox"]').forEach((cb) => { cb.checked = true; });
      onAgentSelectionChange();
    } else {
      refs.agentGrid.querySelectorAll('input[type="checkbox"]').forEach((cb, i) => { cb.checked = i === 0; });
      onAgentSelectionChange();
      showSetupError('至少保留 1 个 Agent。');
    }
  }

  function selectedAgentIds() {
    const out = [];
    refs.agentGrid.querySelectorAll('input[type="checkbox"]').forEach((cb) => { if (cb.checked) out.push(cb.value); });
    return out;
  }

  function showSetupError(msg) {
    if (!refs.setupError) return;
    refs.setupError.textContent = msg || '';
    refs.setupError.hidden = !msg;
  }

  function lockSetup(locked) {
    const disableAll = (el, flag) => {
      if (!el) return;
      el.querySelectorAll('button, input, select, textarea').forEach((n) => { n.disabled = !!flag; });
    };
    disableAll(refs.systemSeg, locked);
    disableAll(refs.roundsSeg, locked);
    refs.seedInput.disabled = locked;
    refs.noiseSwitch.input.disabled = locked;
    refs.selectAllBtn.disabled = locked;
    refs.clearAllBtn.disabled = locked;
    refs.agentGrid.querySelectorAll('input').forEach((n) => { n.disabled = locked; });
    refs.startBtn.disabled = locked || !arenaReady();
    refs.clearResultBtn.disabled = locked;
    refs.agentGrid.querySelectorAll('.arena-agent-opt').forEach((n) => n.classList.toggle('is-locked', !!locked));
  }

  function collectSetup() {
    const cur = setupState();
    const seedVal = parseInt(refs.seedInput.value, 10);
    return {
      systemId: cur.systemId || 'FL-001',
      rounds: Number(cur.rounds) || 6,
      seed: isFinite(seedVal) && seedVal >= 0 ? seedVal : 20261027,
      noise: !!(refs.noiseSwitch.input && refs.noiseSwitch.input.checked),
      agentIds: selectedAgentIds()
    };
  }

  function validateSetup(setup) {
    if (!setup.agentIds.length) return '请至少选择 1 个 Agent。';
    if (!isNum(setup.rounds) || setup.rounds < 1) return '轮数无效。';
    if (!isNum(setup.seed) || setup.seed < 0) return '随机种子必须是非负整数。';
    try {
      if (api.systems && api.systems.get) api.systems.get(setup.systemId);
    } catch (e) {
      return '系统 ' + setup.systemId + ' 不可用。';
    }
    return '';
  }

  /* ===================================================================
     盲测流程（try/finally 保证解封）
     =================================================================== */
  function startMatch() {
    if (local.running) return;
    if (!arenaReady()) {
      showSetupError('核心引擎 / Agent 套件尚未就绪，暂时无法开始盲测。');
      api.toast('核心引擎尚未就绪，无法开始盲测', 'warn');
      return;
    }
    const setup = collectSetup();
    const err = validateSetup(setup);
    if (err) { showSetupError(err); return; }
    showSetupError('');
    local.running = true;
    local.matchError = '';
    local.progress = 0;
    local.progressText = '正在生成隐藏场景与盲观测流…';
    local.showTruth = true;
    local.externalAgents = [];
    local.extSeq = 0;
    local.renderKey = '';
    refs.progressPanel.hidden = false;
    refs.sealBanner.hidden = false;
    refs.results.hidden = true;
    refs.startBtn.disabled = true;
    updateProgressUi();
    // 先上锁 / 封存真值，再计算；finally 中保证解锁
    api.actions.setArenaState({ setup: setup, running: true, match: null });
    api.actions.setTruthSealed(true);
    refs.sealBanner.hidden = false;
    setTimeout(() => { runCompute(setup); }, 60);
  }

  function runCompute(setup) {
    let match = null;
    let error = null;
    try {
      match = ns().arena.createMatch(setup, {
        onProgress: (p) => {
          local.progress = p.rounds ? (p.index / p.rounds) : 0;
          updateProgressUi(p.index, p.rounds);
        }
      });
    } catch (e) {
      error = e;
      console.error('[arena] createMatch failed', e);
    } finally {
      finishMatch(setup, match, error);
    }
  }

  function finishMatch(setup, match, error) {
    local.running = false;
    if (error) local.matchError = String(error && error.message ? error.message : error);
    local.progress = 1;
    try {
      api.actions.setArenaState({ setup: setup, running: false, match: match || null });
    } catch (e) {
      console.error('[arena] setArenaState failed', e);
    } finally {
      // 无论正常/异常中断都必须解封真值并退出 running
      try {
        api.actions.setArenaState({ running: false });
      } catch (e2) { /* ignore */ }
      try { api.actions.setTruthSealed(false); } catch (e3) { /* ignore */ }
    }
    refs.progressPanel.hidden = true;
    refs.sealBanner.hidden = true;
    refs.renderKey = '';
    syncAll(api.getState(), 'arena');
    if (error) {
      api.toast('盲测失败：' + local.matchError, 'danger');
    } else {
      const top = match && match.leaderboard && match.leaderboard[0];
      api.toast('盲测完成' + (top ? '：' + top.name + ' 平均 ' + fmt().num(top.avgScore, 1) + ' 分领先' : '') + '；真值已解封', 'ok');
    }
  }

  function updateProgressUi(index, rounds) {
    const total = rounds || (refs.progressPanel && setupState().rounds) || 6;
    const pct = Math.round((local.progress || 0) * 100);
    if (refs.progressFill) refs.progressFill.style.width = Math.max(3, pct) + '%';
    if (refs.progressPct) refs.progressPct.textContent = pct + '%';
    if (refs.progressText) {
      refs.progressText.textContent = index
        ? '已完成 ' + index + ' / ' + total + ' 轮：仿真 → 盲观测回放 → 逐 Agent 诊断 → 评分'
        : local.progressText;
    }
    if (refs.progressPanel && refs.progressPanel.querySelector('[role="progressbar"]')) {
      refs.progressPanel.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', String(pct));
    }
  }

  function clearMatch() {
    if (local.running) return;
    local.matchError = '';
    local.externalAgents = [];
    local.extSeq = 0;
    local.showTruth = true;
    local.renderKey = '';
    refs.results.hidden = true;
    api.actions.setArenaState({ running: false, match: null });
    syncAll(api.getState(), 'arena');
    api.toast('已清空本场结果', 'info');
  }

  function scheduleAutorun() {
    let params;
    try { params = new URLSearchParams(location.search); } catch (e) { return; }
    if (params.get('autorun') !== '1') return;
    local.autorunPending = true;
    setTimeout(() => {
      if (!local.autorunPending) return;
      local.autorunPending = false;
      const patch = {};
      const sid = params.get('system');
      if (sid) {
        try { api.systems.get(sid); patch.systemId = sid; } catch (e) { /* ignore */ }
      }
      const rounds = parseInt(params.get('rounds'), 10);
      if (isFinite(rounds) && [3, 6, 10].indexOf(rounds) >= 0) patch.rounds = rounds;
      const seed = parseInt(params.get('seed'), 10);
      if (isFinite(seed) && seed >= 0) patch.seed = seed;
      if (params.get('noise') === '1') patch.noise = true;
      if (Object.keys(patch).length) applySetupPatch(patch);
      startMatch();
    }, 450);
  }

  /* ===================================================================
     sync / update
     =================================================================== */
  function syncAll(state, reason) {
    if (!local.built) return;
    const arena = (state.pageState && state.pageState.arena) || {};
    const setup = arena.setup || setupState();
    const running = !!arena.running;
    syncSetupControls(setup, running);
    syncHero(arena);
    refs.sealBanner.hidden = !running;
    refs.progressPanel.hidden = !running;
    if (running) updateProgressUi();
    const match = arena.match || null;
    const key = [
      running ? 'run' : 'idle',
      match ? match.id : 'none',
      local.showTruth ? 'truth' : 'masked',
      local.matchError,
      local.externalAgents.map((a) => a.id + ':' + Object.keys(a.rounds || {}).length).join(','),
      local.agentCatalog.map((a) => a.id).join(',')
    ].join('|');
    if (key !== local.renderKey) {
      local.renderKey = key;
      renderResults(match, running);
      renderExternalList();
    }
    refs.importBtn.disabled = running || !match;
    refs.clearResultBtn.disabled = running || !match;
    if (refs.importStatus) {
      if (!match) {
        refs.importStatus.textContent = '尚无比赛结果：先完成一场盲测，再导入外部诊断。';
        refs.importStatus.setAttribute('data-tone', 'warn');
      } else {
        refs.importStatus.textContent = '本场可评分轮次：第 1–' + match.rounds.length + ' 轮；轮次编号与导出的盲测数据包 round.index 一致。';
        refs.importStatus.setAttribute('data-tone', 'info');
      }
    }
    refs.results.hidden = running || (!match && !local.matchError);
    renderEngineNote();
  }

  function syncSetupControls(setup, locked) {
    const s = setup || {};
    try { refs.systemSeg.setValue(s.systemId || 'FL-001'); } catch (e) { /* ignore */ }
    try { refs.roundsSeg.setValue(Number(s.rounds) || 6); } catch (e) { /* ignore */ }
    if (document.activeElement !== refs.seedInput) {
      refs.seedInput.value = String(s.seed == null ? 20261027 : s.seed);
    }
    if (refs.noiseSwitch && refs.noiseSwitch.input) {
      refs.noiseSwitch.setChecked(!!s.noise);
    }
    const allIds = local.agentCatalog.map((a) => a.id);
    const chosen = (s.agentIds && s.agentIds.length) ? s.agentIds : allIds;
    refs.agentGrid.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
      cb.checked = chosen.indexOf(cb.value) >= 0;
    });
    updateAgentCount(refs.agentGrid.querySelectorAll('input:checked').length);
    lockSetup(locked);
    refs.startBtn.querySelector('span').textContent = locked ? '盲测进行中…' : (arenaState().match ? '再赛一场' : '开始盲测');
    refs.startBtn.disabled = locked || !arenaReady();
  }

  function syncHero(arena) {
    const running = !!arena.running;
    const match = arena.match || null;
    let text = '待开始';
    let tone = 'neutral';
    if (running) { text = '盲测进行中 · 真值封存'; tone = 'danger'; }
    else if (local.matchError) { text = '计算失败'; tone = 'danger'; }
    else if (match) {
      const healthy = (match.rounds || []).filter((r) => r.truth && r.truth.healthy).length;
      text = '已揭晓 · ' + match.rounds.length + ' 轮 · ' + healthy + ' 个健康局';
      tone = 'ok';
    }
    refs.heroStatus.textContent = text;
    refs.heroStatus.setAttribute('data-tone', tone);
    if (match) {
      refs.heroMeta.textContent = systemTitle(match.systemId) + ' · seed ' + match.setup.seed +
        ' · ' + (match.rounds.length) + ' 轮'; 
    } else {
      refs.heroMeta.textContent = '内置确定性算法 · 盲测真值封存';
    }
  }

  function renderEngineNote() {
    ui.clear(refs.engineNote);
    if (!arenaReady()) {
      refs.engineNote.setAttribute('data-tone', 'warn');
      refs.engineNote.appendChild(ui.icon('warning', { size: 13 }));
      refs.engineNote.appendChild(h('span', {}, '核心引擎或 Agent 模块尚未就绪，盲测按钮暂不可用。'));
    } else {
      refs.engineNote.setAttribute('data-tone', '');
      refs.engineNote.appendChild(ui.icon('check', { size: 13 }));
      refs.engineNote.appendChild(h('span', {}, '就绪：' + local.agentCatalog.length + ' 个内置确定性诊断算法（非 LLM），三系统可用。'));
    }
  }

  /* ===================================================================
     results rendering
     =================================================================== */
  function renderResults(match, running) {
    ui.clear(refs.results);
    if (running) return;
    if (!match) {
      if (local.matchError) {
        refs.results.appendChild(h('section', { class: 'fl-panel arena-error-panel' }, [
          h('div', { class: 'panel-head' }, [h('div', { class: 'panel-head-main' }, [
            h('span', { class: 'eyebrow' }, 'ERROR'), h('span', { class: 'panel-title' }, '盲测未完成')
          ])]),
          h('div', { class: 'panel-body' }, [
            h('div', { class: 'notice', 'data-tone': 'danger' }, [ui.icon('warning', { size: 14 }), h('span', {}, local.matchError)]),
            h('p', { class: 'arena-spec-note mt-12' }, '真值已解封，可修改设置后重新开始。')
          ])
        ]));
      }
      return;
    }
    refs.results.appendChild(renderLeaderboard(match));
    const roundsWrap = h('div', { class: 'arena-rounds' });
    match.rounds.forEach((round) => roundsWrap.appendChild(renderRoundCard(match, round)));
    refs.results.appendChild(roundsWrap);
  }

  function externalRows(match) {
    return local.externalAgents.map((agent) => {
      const entries = Object.keys(agent.rounds || {}).map(Number).filter((idx) => {
        return match.rounds.some((r) => r.index === idx);
      }).map((idx) => ({ round: match.rounds.filter((r) => r.index === idx)[0], item: agent.rounds[idx] }));
      const scores = entries.map((e) => e.item.score.total);
      const faultEntries = entries.filter((e) => e.round && !e.round.truth.healthy);
      const healthyEntries = entries.filter((e) => e.round && e.round.truth.healthy);
      let detected = 0;
      let latencySum = 0;
      let latencyN = 0;
      let famCorrect = 0;
      faultEntries.forEach((e) => {
        const d = e.item.diagnosis;
        if (d.faultDetected) {
          detected += 1;
          if (isNum(d.detectTime_s) && isNum(e.round.truth.t_fault)) {
            latencySum += Math.max(0, d.detectTime_s - e.round.truth.t_fault);
            latencyN += 1;
          }
          if (d.faultType === e.round.truth.faultFamily) famCorrect += 1;
        }
      });
      let falseAlarms = 0;
      healthyEntries.forEach((e) => { if (e.item.diagnosis.faultDetected) falseAlarms += 1; });
      return {
        agentId: agent.id,
        name: agent.name,
        family: 'external',
        source: 'external',
        avgScore: scores.length ? Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 10) / 10 : null,
        detectionRate: faultEntries.length ? detected / faultEntries.length : null,
        avgLatency: latencyN ? Math.round((latencySum / latencyN) * 100) / 100 : null,
        falseAlarmRate: healthyEntries.length ? falseAlarms / healthyEntries.length : null,
        familyAcc: faultEntries.length ? famCorrect / faultEntries.length : null,
        coverage: entries.length + '/' + match.rounds.length,
        totalScore: scores.reduce((a, b) => a + b, 0)
      };
    });
  }

  function renderLeaderboard(match) {
    const rows = match.leaderboard.map((r) => Object.assign({}, r, {
      coverage: (match.rounds.length) + '/' + match.rounds.length,
      source: 'builtin'
    })).concat(externalRows(match));
    rows.sort((a, b) => {
      const sa = isNum(a.avgScore) ? a.avgScore : -1;
      const sb = isNum(b.avgScore) ? b.avgScore : -1;
      if (sb !== sa) return sb - sa;
      return String(a.name).localeCompare(String(b.name));
    });
    const healthyCount = match.rounds.filter((r) => r.truth.healthy).length;
    refs.truthToggle = h('button', {
      class: 'btn btn-ghost btn-sm', type: 'button',
      'aria-pressed': String(local.showTruth),
      title: local.showTruth ? '隐藏真值，重新以盲测视角查看诊断' : '显示真值',
      on: {
        click: () => {
          local.showTruth = !local.showTruth;
          local.renderKey = '';
          syncAll(api.getState(), 'arena');
        }
      }
    }, [ui.icon(local.showTruth ? 'eye-off' : 'eye', { size: 13 }), h('span', {}, local.showTruth ? '隐藏真值' : '显示真值')]);
    refs.exportMatchBtn = h('button', {
      class: 'btn btn-ghost btn-sm', type: 'button',
      on: { click: () => exportMatch(match) }
    }, [ui.icon('download', { size: 13 }), h('span', {}, '导出整场数据包')]);

    const head = h('div', { class: 'panel-head arena-lb-head' }, [
      h('div', { class: 'panel-head-main' }, [
        h('span', { class: 'eyebrow' }, 'LEADERBOARD'),
        h('span', { class: 'panel-title' }, '排行榜'),
        h('span', { class: 'panel-sub' }, systemTitle(match.systemId) + ' · seed ' + match.setup.seed +
          ' · ' + match.rounds.length + ' 轮 · ' + healthyCount + ' 个健康局')
      ]),
      h('div', { class: 'arena-lb-actions' }, [refs.truthToggle, refs.exportMatchBtn])
    ]);
    const body = h('div', { class: 'panel-body arena-lb-body' });
    const headRow = h('div', { class: 'arena-lb-headrow' }, [
      h('span', {}, '名次'), h('span', {}, 'Agent'), h('span', {}, '综合分'), h('span', {}),
      h('span', {}, '检出率'), h('span', {}, '平均延迟'), h('span', {}, '误报率'),
      h('span', {}, '家族准确率'), h('span', {}, '覆盖')
    ]);
    body.appendChild(headRow);
    rows.forEach((row, i) => {
      const pct = isNum(row.avgScore) ? Math.max(0, Math.min(100, row.avgScore)) : 0;
      const isExt = row.source === 'external';
      body.appendChild(h('div', {
        class: 'arena-lb-row' + (i === 0 ? ' is-top' : ''),
        dataset: { source: isExt ? 'external' : 'builtin' }
      }, [
        h('span', { class: 'arena-rank' }, String(i + 1).padStart(2, '0')),
        h('span', { class: 'arena-lb-agent' }, [
          h('span', { class: 'arena-lb-name' }, row.name),
          h('span', { class: 'arena-lb-tags' }, [
            isExt ? ui.badge('外部导入', { tone: 'info' }) : ui.badge('内置', { tone: 'neutral' }),
            h('span', { class: 'arena-lb-family' }, isExt ? '外部诊断提交' : agentFamilyLabel(row.family))
          ])
        ]),
        h('span', { class: 'arena-lb-score' }, [
          h('strong', { class: 'num', 'data-tone': scoreTone(row.avgScore) }, isNum(row.avgScore) ? fmt().num(row.avgScore, 1) : '—'),
          h('span', { class: 'arena-lb-score-unit' }, '/ 100')
        ]),
        h('span', { class: 'arena-lb-bar-cell' }, [
          h('span', { class: 'arena-lb-bar' }, [h('span', { class: 'arena-lb-bar-fill', 'data-tone': scoreTone(row.avgScore), style: { width: pct + '%' } })])
        ]),
        h('span', { class: 'arena-lb-metric mono', 'data-label': '检出' }, pctOrDash(row.detectionRate)),
        h('span', { class: 'arena-lb-metric mono', 'data-label': '延迟' }, isNum(row.avgLatency) ? fmt().num(row.avgLatency, 2) + ' s' : '—'),
        h('span', { class: 'arena-lb-metric mono', 'data-label': '误报' }, pctOrDash(row.falseAlarmRate)),
        h('span', { class: 'arena-lb-metric mono', 'data-label': '家族' }, pctOrDash(row.familyAcc)),
        h('span', { class: 'arena-lb-metric mono', 'data-label': '覆盖' }, row.coverage || '—')
      ]));
    });
    if (!rows.length) body.appendChild(h('div', { class: 'empty' }, [h('div', { class: 'empty-title' }, '暂无排行榜')]));
    return h('section', { class: 'fl-panel arena-lb' }, [head, body]);
  }

  function renderRoundCard(match, round) {
    const truth = round.truth;
    const truthVisible = local.showTruth;
    const compMap = componentMap(match.systemId);
    const head = h('div', { class: 'arena-round-head' }, [
      h('span', { class: 'arena-round-no mono' }, 'R' + String(round.index).padStart(2, '0')),
      h('div', { class: 'arena-round-head-main' }, [
        h('div', { class: 'arena-round-title' }, truthVisible
          ? (truth.healthy ? '健康局' : truth.faultFamilyLabel)
          : '第 ' + round.index + ' 轮 · 真值已隐藏'),
        h('div', { class: 'arena-round-sub mono' }, 'configHash ' + fmt().hash(round.configHash || '') +
          ' · ' + round.samples.length + ' 样本 × ' + round.observables.length + ' 观测通道')
      ]),
      h('div', { class: 'arena-round-tags' }, truthVisible ? [
        truth.healthy ? ui.badge('无故障注入', { tone: 'ok' }) : ui.badge(truth.faultFamilyLabel, { tone: 'danger' }),
        truth.healthy ? null : ui.chip(modeLabel(truth.feedbackMode)),
        truth.healthy ? null : ui.chip('部件 ' + (truth.componentLabel || componentLabel(compMap, truth.component))),
        truth.healthy ? null : ui.chip('幅值 ' + magText(truth.magnitude)),
        truth.healthy ? null : ui.chip('t = ' + fmt().time(truth.t_fault))
      ] : [
        ui.badge('真值封存', { tone: 'warn' }),
        local.showTruth ? null : ui.chip('点击排行榜「显示真值」揭晓')
      ])
    ]);

    const truthBlock = truthVisible
      ? h('div', { class: 'arena-truth' + (truth.healthy ? ' is-healthy' : '') }, truth.healthy
        ? [h('span', { class: 'arena-truth-label' }, '本轮判定'), h('strong', {}, '健康局（无故障）'), h('span', { class: 'muted' }, '所有 Agent 的期望行为是「未报警」；误报将扣 10 分。')]
        : [
          truthItem('故障家族', truth.faultFamilyLabel),
          truthItem('受影响部件', truth.componentLabel || componentLabel(compMap, truth.component)),
          truthItem('故障幅值', magText(truth.magnitude)),
          truthItem('注入时刻', fmt().time(truth.t_fault)),
          truthItem('生效模式', modeLabel(truth.feedbackMode)),
          truthItem('持续时长', truth.active_s != null ? fmt().num(truth.active_s, 1) + ' s' : '—'),
          truthItem('最快报警', truth.detectedAt == null ? '无 Agent 报警' : fmt().time(truth.detectedAt))
        ])
      : h('div', { class: 'arena-truth is-masked' }, [
        ui.icon('lock', { size: 14 }),
        h('span', {}, '真值已隐藏：仅显示各 Agent 的诊断、得分与解释，便于以盲测视角复盘。')
      ]);

    const resultsWrap = h('div', { class: 'arena-result-grid' });
    round.results.forEach((result) => resultsWrap.appendChild(renderAgentResult(match, round, result)));
    local.externalAgents.forEach((agent) => {
      const item = agent.rounds && agent.rounds[round.index];
      if (item) {
        resultsWrap.appendChild(renderAgentResult(match, round, {
          agentId: agent.id,
          name: agent.name,
          source: 'external',
          family: 'external',
          diagnosis: item.diagnosis,
          score: item.score
        }));
      } else {
        resultsWrap.appendChild(h('div', { class: 'arena-result is-missing' }, [
          h('div', { class: 'arena-result-head' }, [
            h('span', { class: 'arena-result-name' }, agent.name),
            ui.badge('外部导入', { tone: 'info' })
          ]),
          h('div', { class: 'arena-result-missing' }, [ui.icon('x', { size: 13 }), h('span', {}, '未提交本轮诊断，不计入平均分')])
        ]));
      }
    });

    const foot = h('div', { class: 'arena-round-foot' }, [
      h('span', { class: 'muted small' }, truthVisible ? '本轮数据包不含真值；导出后可直接交给外部 Agent 重放。' : '导出数据包始终不含真值。'),
      h('button', {
        class: 'btn btn-ghost btn-sm', type: 'button',
        on: { click: () => exportRound(match, round.index) }
      }, [ui.icon('download', { size: 13 }), h('span', {}, '导出第 ' + round.index + ' 轮盲测包')])
    ]);
    return h('article', { class: 'fl-panel arena-round' }, [head, truthBlock, resultsWrap, foot]);
  }

  function truthItem(label, value) {
    return h('div', { class: 'arena-truth-item' }, [
      h('span', { class: 'arena-truth-k' }, label),
      h('span', { class: 'arena-truth-v' }, value == null ? '—' : String(value))
    ]);
  }

  function renderAgentResult(match, round, result) {
    const truth = round.truth;
    const d = result.diagnosis || {};
    const isExt = result.source === 'external';
    const showTruth = local.showTruth;
    const compMap = componentMap(match.systemId);
    const detected = d.faultDetected === true;
    const familyTxt = detected ? familyLabel(d.faultType) : '判定健康';
    const compTxt = detected ? componentLabel(compMap, d.component) : '—';
    const familyCorrect = showTruth && !truth.healthy && detected && d.faultType === truth.faultFamily;
    const componentCorrect = showTruth && !truth.healthy && detected && d.component === truth.component;
    const score = result.score || {};
    const total = score.total;
    const head = h('div', { class: 'arena-result-head' }, [
      h('div', { class: 'arena-result-id' }, [
        h('span', { class: 'arena-result-name' }, result.name),
        isExt ? ui.badge('外部导入', { tone: 'info' }) : ui.badge(agentFamilyLabel(result.family), { tone: result.family === 'fusion' ? 'acc' : 'neutral' }),
        detected
          ? ui.badge(familyTxt, { tone: (showTruth && d.faultType === truth.faultFamily) ? 'ok' : (showTruth ? 'danger' : 'neutral') })
          : ui.badge('健康', { tone: (showTruth && !truth.healthy) ? 'danger' : 'ok' })
      ]),
      h('div', { class: 'arena-result-score' }, [
        h('strong', { class: 'num', 'data-tone': scoreTone(total) }, isNum(total) ? fmt().num(total, 1) : '—'),
        h('span', {}, '/ 100')
      ])
    ]);
    const diagLine = h('div', { class: 'arena-result-diagnosis' }, [
      detected ? [
        h('span', {}, '家族 '),
        h('strong', {}, familyTxt),
        showTruth ? h('span', { class: 'arena-mark', 'data-ok': String(familyCorrect) }, familyCorrect ? '✓' : '✗') : null,
        h('span', { class: 'arena-sep' }, '·'),
        h('span', {}, '部件 '),
        h('strong', {}, compTxt),
        showTruth ? h('span', { class: 'arena-mark', 'data-ok': String(componentCorrect) }, componentCorrect ? '✓' : '✗') : null,
        h('span', { class: 'arena-sep' }, '·'),
        h('span', {}, '幅值 '),
        h('strong', {}, magText(d.magnitude)),
        h('span', { class: 'arena-sep' }, '·'),
        h('span', {}, '首报 '),
        h('strong', {}, isNum(d.detectTime_s) ? fmt().time(d.detectTime_s) : '—')
      ] : [
        h('span', {}, '未报警；置信度 '),
        h('strong', {}, fmt().num(d.confidence, 2)),
        showTruth ? h('span', { class: 'arena-mark', 'data-ok': String(truth.healthy) }, truth.healthy ? '✓' : '✗') : null
      ]
    ]);
    const confLine = h('div', { class: 'arena-result-conf mono' }, detected
      ? '置信度 ' + fmt().num(d.confidence, 3) + (score.falseAlarm ? ' · 健康局误报 −10' : '')
      : '置信度 ' + fmt().num(d.confidence, 3) + (score.falseAlarm ? ' · 误报 −10' : ''));

    const breakdown = h('div', { class: 'arena-breakdown' });
    DIMS.forEach(([key, label]) => {
      const v = isNum(score[key]) ? score[key] : 0;
      const weight = (weights()[key] || 0);
      breakdown.appendChild(h('div', { class: 'arena-break-row', title: label + ' 权重 ' + fmt().num(weight * 100, 0) + '%' }, [
        h('span', { class: 'arena-break-label' }, label),
        h('span', { class: 'arena-break-bar' }, [h('span', {
          class: 'arena-break-fill',
          'data-tone': v >= 0.9 ? 'ok' : v >= 0.5 ? 'warn' : 'danger',
          style: { width: Math.round(v * 100) + '%' }
        })]),
        h('span', { class: 'arena-break-val mono' }, fmt().num(v, 2)),
        h('span', { class: 'arena-break-weight mono' }, fmt().num(weight * 100, 0) + '%')
      ]));
    });

    return h('div', { class: 'arena-result', dataset: { source: isExt ? 'external' : 'builtin' } }, [
      head,
      diagLine,
      confLine,
      breakdown,
      h('p', { class: 'arena-result-explain' }, d.explanation || '（无解释）')
    ]);
  }

  /* ===================================================================
     exports
     =================================================================== */
  function exportRound(match, roundIndex) {
    try {
      const bundle = ns().arena.exportRoundBundle(match, roundIndex);
      const filename = 'FaultLab_arena_' + match.systemId + '_seed' + match.setup.seed + '_round' + roundIndex + '.json';
      const ok = downloadText(filename, JSON.stringify(bundle, null, 2), 'application/json;charset=utf-8');
      if (ok) api.toast('已导出第 ' + roundIndex + ' 轮盲测数据包（truth_sealed）', 'ok');
      else api.toast('导出失败：浏览器未允许下载', 'danger');
    } catch (e) {
      api.toast('导出失败：' + (e && e.message ? e.message : e), 'danger');
    }
  }

  function exportMatch(match) {
    try {
      const bundle = ns().arena.exportMatchBundle(match);
      const filename = 'FaultLab_arena_' + match.systemId + '_seed' + match.setup.seed + '_allRounds.json';
      const ok = downloadText(filename, JSON.stringify(bundle, null, 2), 'application/json;charset=utf-8');
      if (ok) api.toast('已导出整场盲测数据包（truth_sealed）', 'ok');
      else api.toast('导出失败：浏览器未允许下载', 'danger');
    } catch (e) {
      api.toast('导出失败：' + (e && e.message ? e.message : e), 'danger');
    }
  }

  /* ===================================================================
     外部诊断导入
     =================================================================== */
  function showImportErrors(errors, fatal) {
    ui.clear(refs.importErrors);
    if (!errors || !errors.length) {
      refs.importErrors.hidden = true;
      return;
    }
    refs.importErrors.hidden = false;
    refs.importErrors.setAttribute('data-tone', fatal ? 'danger' : 'warn');
    refs.importErrors.appendChild(h('div', { class: 'arena-import-error-head' }, [
      ui.icon(fatal ? 'warning' : 'info', { size: 13 }),
      h('strong', {}, fatal ? '导入失败' : '部分轮次未评分')
    ]));
    const ul = h('ul', {});
    errors.slice(0, 12).forEach((e) => {
      ul.appendChild(h('li', {}, h('span', { class: 'mono' }, (e.path || '$') + '：') + ' ' + (e.message || String(e))));
    });
    if (errors.length > 12) ul.appendChild(h('li', {}, '……另有 ' + (errors.length - 12) + ' 条'));
    refs.importErrors.appendChild(ul);
  }

  function importExternal() {
    if (local.running) { api.toast('盲测进行中，暂不能导入外部诊断', 'warn'); return; }
    const match = arenaState().match;
    if (!match) { showImportErrors([{ path: '$', message: '请先完成一场盲测，再导入外部诊断。' }], true); return; }
    if (!ns().arena || typeof ns().arena.parseExternalBundle !== 'function') {
      showImportErrors([{ path: '$', message: 'FL.arena 未就绪，无法解析外部诊断。' }], true);
      return;
    }
    const text = String(refs.importText.value || '').trim();
    if (!text) { showImportErrors([{ path: '$', message: '请粘贴 JSON 或先选择文件。' }], true); return; }
    const parsed = ns().arena.parseExternalBundle(text);
    if (!parsed.ok) { showImportErrors(parsed.errors, true); return; }
    const errors = [];
    const rounds = {};
    parsed.data.rounds.forEach((item) => {
      const round = match.rounds.filter((r) => r.index === item.round)[0];
      if (!round) {
        errors.push({ path: '$[round=' + item.round + ']', message: '本场比赛没有第 ' + item.round + ' 轮' });
        return;
      }
      try {
        const score = ns().arena.scoreExternalDiagnosis(match, item.round, item.diagnosis);
        rounds[item.round] = { diagnosis: item.diagnosis, score: score };
      } catch (e) {
        errors.push({ path: '$[round=' + item.round + ']', message: String(e && e.message ? e.message : e) });
      }
    });
    if (!Object.keys(rounds).length) {
      showImportErrors(errors.length ? errors : [{ path: '$', message: '没有可评分的轮次' }], true);
      return;
    }
    local.extSeq += 1;
    const agent = {
      id: 'ext-' + local.extSeq,
      name: parsed.data.agentName || ('外部 Agent ' + local.extSeq),
      source: 'external',
      rounds: rounds
    };
    local.externalAgents.push(agent);
    showImportErrors(errors, false);
    refs.importText.value = '';
    local.renderKey = '';
    syncAll(api.getState(), 'arena');
    api.toast('已导入外部诊断「' + agent.name + '」：' + Object.keys(rounds).length + ' 轮，已加入排行榜', 'ok');
  }

  function clearExternal() {
    if (!local.externalAgents.length) { api.toast('没有可清空的外部结果', 'info'); return; }
    local.externalAgents = [];
    local.renderKey = '';
    showImportErrors([], false);
    syncAll(api.getState(), 'arena');
    api.toast('已清空外部导入结果', 'info');
  }

  function removeExternal(id) {
    local.externalAgents = local.externalAgents.filter((a) => a.id !== id);
    local.renderKey = '';
    syncAll(api.getState(), 'arena');
  }

  function renderExternalList() {
    ui.clear(refs.extList);
    if (!local.externalAgents.length) {
      refs.extList.hidden = false;
      refs.extList.appendChild(h('div', { class: 'arena-ext-empty' }, '尚未导入外部诊断。'));
      return;
    }
    local.externalAgents.forEach((agent) => {
      const rows = externalRows(arenaState().match || { rounds: [] });
      const row = rows.filter((r) => r.agentId === agent.id)[0];
      refs.extList.appendChild(h('div', { class: 'arena-ext-item' }, [
        h('div', { class: 'arena-ext-main' }, [
          h('span', { class: 'arena-ext-name' }, agent.name),
          ui.badge('外部导入', { tone: 'info' }),
          h('span', { class: 'arena-ext-meta mono' }, '覆盖 ' + (row ? row.coverage : '—') +
            ' · 均分 ' + (row && isNum(row.avgScore) ? fmt().num(row.avgScore, 1) : '—'))
        ]),
        h('button', {
          class: 'btn btn-ghost btn-xs', type: 'button', 'aria-label': '移除外部 Agent ' + agent.name,
          on: { click: () => removeExternal(agent.id) }
        }, [ui.icon('x', { size: 12 })])
      ]));
    });
  }

  /* ===================================================================
     update / export page module
     =================================================================== */
  function update(state, reason) {
    if (!local.built) return;
    // 竞技场不依赖全局仿真时间；播放/时间/全局 toast 更新时跳过，避免每帧重排 DOM。
    if (reason === 'time' || reason === 'playback' || reason === 'toast') return;
    syncAll(state, reason || 'update');
  }

  pages.arena = {
    id: 'arena',
    label: 'Agent 竞技场',
    navLabel: '竞技场',
    mount: mount,
    update: update
  };
})();

</script>
  <!-- shell & boot -->
  <script>
/* ===== src/ui/shell.js ===== */
/* owner: lead | module: shell | contract: docs/CONTRACT.md */
(function () {
  'use strict';
  const FL = window.FL = window.FL || {};
  const ui = FL.ui;
  const h = ui.h;
  const fmt = FL.protocol.fmt;

  const PAGES = [
    { id: 'home', index: '01' },
    { id: 'system', index: '02' },
    { id: 'signals', index: '03' },
    { id: 'causal', index: '04' },
    { id: 'compare', index: '05' },
    { id: 'arena', index: '06', ext: true }
  ];
  const TRUTH_PAGES = ['signals', 'causal', 'compare'];

  const refs = {};
  const pageRoots = {};
  let booted = false;
  let lastPage = null;
  let lastToastKey = '';
  let lastRunKey = null;
  let lastNavKey = null;
  let popover = null;

  const api = {
    FL,
    get actions() { return FL.store.actions; },
    getState: () => FL.store.getState(),
    el: h,
    ui,
    get chart() { return FL.chart; },
    get core() { return FL.core; },
    get systems() { return FL.systems; },
    get protocol() { return FL.protocol; },
    get exporter() { return FL.exporter; },

    toast: (m, t) => FL.store.actions.toast(m, t),
    navigate: (p) => FL.store.actions.navigate(p),

  /* ===================================================================
     build DOM
     =================================================================== */
  function buildShell() {
    const app = document.getElementById('app');
    ui.clear(app);

    /* ---- header ---- */
    const brand = h('a', { class: 'brand', href: '#/home', 'aria-label': 'FaultLab 首页' }, [
      h('span', { class: 'brand-mark' }, [ui.icon('pulse', { size: 22 })]),
      h('span', { class: 'brand-text' }, [
        h('span', { class: 'brand-name' }, ['FAULT', h('em', {}, 'LAB')]),
        h('span', { class: 'brand-sub' }, ['Virtual Energy Lab · V0.1'])
      ])
    ]);

    refs.systemSwitch = h('button', {

  }

  /* ===================================================================
     timeline
     =================================================================== */
  function buildTimeline() {
    refs.btnReplay = tlBtn('replay', '重播', '重播（不重新计算）');
    refs.btnFault = tlBtn('flag', '故障点', '跳到故障点');
    refs.btnPrev = tlBtn('skipback', '事件', '上一个事件');
    refs.btnPlay = h('button', { class: 'tl-btn tl-play', type: 'button', title: '播放/暂停（空格）' }, [
      ui.icon('play', { size: 15 }), h('span', {}, '播放')
    ]);
    refs.btnPlay.addEventListener('click', () => FL.store.actions.togglePlay());
    refs.btnNext = tlBtn('skipforward', '事件', '下一个事件');

    refs.btnReplay.addEventListener('click', () => FL.store.actions.replay());
    refs.btnFault.addEventListener('click', () => FL.store.actions.jumpToFault());
    refs.btnPrev.addEventListener('click', () => FL.store.actions.stepEvent(-1));
    refs.btnNext.addEventListener('click', () => FL.store.actions.stepEvent(1));

    refs.speedButtons = {};
    const speed = h('div', { class: 'tl-speed', role: 'group', 'aria-label': '播放速度' });
    [0.5, 1, 2, 4].forEach((s) => {
      const b = h('button', { type: 'button', 'aria-pressed': String(s === 1) }, s + 'x');
      b.addEventListener('click', () => FL.store.actions.setSpeed(s));
      refs.speedButtons[s] = b;
      speed.appendChild(b);
    });

    refs.tlNow = h('span', { class: 'tl-now' }, '0.0');
    refs.tlTotal = h('span', { class: 'tl-total' }, '/ 60.0 s');
    refs.tlState = h('span', { class: 'tl-state', 'data-status': 'stopped' }, '未运行');
    refs.tlHint = h('span', { class: 'tl-hint' }, '空格 播放/暂停 · ←/→ ±0.1s · Shift ±1s · Home/End 0/60s');
    const readout = h('div', { class: 'tl-readout' }, [
      refs.tlNow, refs.tlTotal, refs.tlState, h('span', { class: 'spacer' }), refs.tlHint
    ]);

    refs.miniCanvas = h('canvas', { class: 'tl-mini', 'aria-hidden': 'true' });
    refs.rail = h('div', {
      class: 'tl-rail is-empty', role: 'slider', tabindex: '0',
      'aria-label': '仿真时间线', 'aria-valuemin': '0', 'aria-valuemax': '60', 'aria-valuenow': '0'
    }, [
      h('div', { class: 'tl-fill' }),
      h('div', { class: 'tl-handle' })
    ]);
    refs.tlFill = refs.rail.querySelector('.tl-fill');
    refs.tlHandle = refs.rail.querySelector('.tl-handle');
    refs.tlTicks = h('div', { class: 'tl-ticks', 'aria-hidden': 'true' });
    const railWrap = h('div', { class: 'tl-rail-wrap' }, [refs.miniCanvas, refs.rail, refs.tlTicks]);

    bindRail();
    refs.tlTrack = h('div', { class: 'tl-track' }, [readout, railWrap]);

    return h('footer', { class: 'app-timeline', 'aria-label': '仿真时间线与播放控制' }, [
      h('div', { class: 'tl-controls' }, [
        refs.btnReplay, refs.btnFault, refs.btnPrev, refs.btnPlay, refs.btnNext, speed
      ]),
      refs.tlTrack
    ]);
  }

  function tlBtn(iconName, label, title) {
    return h('button', { class: 'tl-btn', type: 'button', title: title || label }, [
      ui.icon(iconName, { size: 15 }), h('span', {}, label)
    ]);
  }

  function bindRail() {
    let dragging = false;
    function seek(ev) {
      const st = FL.store.getState();
      if (!st.activeRun) return;
      const rect = refs.rail.getBoundingClientRect();
      if (!rect.width) return;
      const ratio = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
      const d = st.activeRun.config.duration_s;
      FL.store.actions.setTime(ratio * d, { pause: true });
    }
    refs.rail.addEventListener('pointerdown', (e) => {
      const st = FL.store.getState();
      if (!st.activeRun) return;
      dragging = true;
      try { refs.rail.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      seek(e);
      e.preventDefault();
    });
    refs.rail.addEventListener('pointermove', (e) => { if (dragging) seek(e); });
    refs.rail.addEventListener('pointerup', () => { dragging = false; });
    refs.rail.addEventListener('pointercancel', () => { dragging = false; });
    refs.rail.addEventListener('keydown', (e) => {
      const st = FL.store.getState();
      if (!st.activeRun) return;
      if (e.key === 'ArrowLeft') { FL.store.actions.setTime(st.currentTime - (e.shiftKey ? 1 : 0.1), { pause: true }); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { FL.store.actions.setTime(st.currentTime + (e.shiftKey ? 1 : 0.1), { pause: true }); e.preventDefault(); }
      else if (e.key === 'Home') { FL.store.actions.setTime(0, { pause: true }); e.preventDefault(); }
      else if (e.key === 'End') { FL.store.actions.setTime(st.activeRun.config.duration_s, { pause: true }); e.preventDefault(); }
    });
  }

  /* ===================================================================
     render
     =================================================================== */
  function onState(state, reason) {
    if (!booted) return;
    try {
      renderHeader(state);
      renderNav(state);
      renderTimeline(state, reason);
      renderToasts(state);
      renderPage(state, reason);
    } catch (err) {
      console.error('[shell] render error', err);
    }
  }

  function renderHeader(state) {
    let sys = null;
    try { sys = FL.systems.get(state.systemId); } catch (e) { sys = null; }
    if (sys) {
      refs.systemSwitch.querySelector('.sw-code').textContent = sys.experimentCode;
      refs.systemSwitch.querySelector('.sw-title').textContent = sys.title;
      refs.hdrModel.lastChild.textContent = (sys.level || 'L0').split('·')[0].trim();
      document.title = 'FaultLab · ' + sys.title + (state.activeRun ? ' · ' + state.activeRun.runId : ' · 未创建运行');
    }
    refs.modeFlag.dataset.mode = state.mode;
    refs.modeFlag.textContent = state.mode === 'blind' ? '盲测 · 真值封存' : '演示模式';
    if (state.activeRun) {
      refs.hdrRun.dataset.status = state.computeState === 'computing' ? 'computing' : 'completed';
      refs.hdrRun.lastChild.textContent = state.activeRun.runId + ' · ' + (state.computeState === 'computing' ? '计算中' : '已完成');
    } else {
      refs.hdrRun.dataset.status = 'empty';
      refs.hdrRun.lastChild.textContent = '未创建运行';
    }
  }

  function renderNav(state) {
    const sealedKey = state.truthSealed ? '1' : '0';
    if (lastNavKey === state.page + '|' + sealedKey) return;
    lastNavKey = state.page + '|' + sealedKey;
    PAGES.forEach((p) => {
      const el = refs.navItems[p.id];
      if (!el) return;
      if (p.id === state.page) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
      const shouldDisable = state.truthSealed && TRUTH_PAGES.indexOf(p.id) >= 0;
      if (shouldDisable) {
        el.setAttribute('aria-disabled', 'true');
        el.setAttribute('title', '盲测进行中：真值相关页面已封存');
      } else {
        el.removeAttribute('aria-disabled');
        const def = (FL.pages && FL.pages[p.id]) || {};
        el.setAttribute('title', def.label || p.id);
      }
    });
  }

  function renderToasts(state) {
    let root = document.getElementById('toast-root');
    if (!root) {
      root = h('div', { id: 'toast-root', class: 'toast-root', 'aria-live': 'polite' });
      document.body.appendChild(root);
    }
    const key = (state.toasts || []).map((t) => t.id).join(',');
    if (key === lastToastKey) return;
    lastToastKey = key;
    ui.clear(root);
    (state.toasts || []).forEach((t) => {
      root.appendChild(h('div', { class: 'toast', 'data-tone': t.tone || 'info', role: 'status' }, [
        ui.icon(t.tone === 'danger' || t.tone === 'warn' ? 'warning' : t.tone === 'ok' ? 'check' : 'info', { size: 15 }),
        h('div', {}, t.message)
      ]));
    });
  }

  function renderTimeline(state, reason) {
    const run = state.activeRun;
    const hasRun = !!run;
    const d = hasRun ? run.config.duration_s : 60;
    const t = state.currentTime || 0;
    const ratio = d > 0 ? Math.max(0, Math.min(1, t / d)) : 0;

    refs.tlNow.textContent = fmt.num(t, 1);
    refs.tlTotal.textContent = '/ ' + fmt.num(d, 1) + ' s';
    const status = hasRun ? state.playback.status : 'stopped';
    refs.tlState.dataset.status = status;
    refs.tlState.textContent = status === 'playing' ? '播放中' : status === 'paused' ? '已暂停'
      : status === 'ended' ? '已结束' : hasRun ? '就绪' : '未运行';
    refs.tlFill.style.width = (ratio * 100) + '%';
    refs.tlHandle.style.left = (ratio * 100) + '%';
    refs.rail.setAttribute('aria-valuenow', String(t.toFixed(1)));
    refs.rail.setAttribute('aria-valuemax', String(d));
    refs.rail.classList.toggle('is-empty', !hasRun);

    const playing = status === 'playing';
    refs.btnPlay.classList.toggle('is-playing', playing);
    ui.clear(refs.btnPlay);
    refs.btnPlay.appendChild(ui.icon(playing ? 'pause' : 'play', { size: 15 }));
    refs.btnPlay.appendChild(h('span', {}, playing ? '暂停' : '播放'));

    [refs.btnReplay, refs.btnPrev, refs.btnFault, refs.btnNext].forEach((b) => {
      if (hasRun) b.removeAttribute('disabled'); else b.setAttribute('disabled', '');
    });
    Object.keys(refs.speedButtons).forEach((s) => {
      refs.speedButtons[s].setAttribute('aria-pressed', String(Number(s) === (state.playback.speed || 1)));
    });

    const key = hasRun ? run.runId : 'none';
    if (key !== lastRunKey) {
      lastRunKey = key;
      rebuildTicks(d);
      rebuildFaultMarks(run);
      renderMini(run);
    }
    if (reason === 'time' || reason === 'run' || reason === 'playback' || reason === 'boot') renderMini(run);
  }

  function rebuildTicks(d) {
    ui.clear(refs.tlTicks);
    const step = d <= 12 ? 1 : d <= 30 ? 2 : 5;
    for (let s = 0; s <= d + 0.001; s += step) {
      const span = h('span', { class: s % 10 === 0 ? 'major' : '' });
      span.style.left = (s / d * 100) + '%';
      refs.tlTicks.appendChild(span);
    }
  }

  function rebuildFaultMarks(run) {
    Array.from(refs.rail.querySelectorAll('.tl-fault-mark')).forEach((n) => n.remove());
    if (!run) return;
    const d = run.config.duration_s || 60;
    (run.events || []).filter((e) => e.event_type && e.event_type !== 'healthy').forEach((ev, i) => {
      const mark = h('div', { class: 'tl-fault-mark' });
      mark.style.left = ((ev.trigger_s / d) * 100) + '%';
      if (i === 0) {
        mark.appendChild(h('span', { class: 'tl-fault-label' }, '故障 ' + fmt.num(ev.trigger_s, 1) + ' s'));
      }
      refs.rail.appendChild(mark);
    });
  }

  function renderMini(run) {
    const cv = refs.miniCanvas;
    if (!cv) return;
    const wrap = cv.parentElement;
    const w = Math.max(10, wrap.clientWidth);
    const hgt = 28;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hgt * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(hgt * dpr);
    }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, hgt);
    if (!run || !run.timeseries) return;
    const signals = run.timeseries.signals;
    let id = null;
    let arr = null;
    const preferred = (run.signals || []).filter((s) => s.sourceKind === 'MODEL_STATE' && !s.tableOnly);
    const pick = preferred.filter((s) => /_true_(kW|A|Hz)$/.test(s.id))[0] || preferred[0];
    if (pick && signals[pick.id]) { id = pick.id; arr = signals[pick.id]; }
    if (!arr) return;
    const times = run.timeseries.t;
    let min = Infinity, max = -Infinity;
    for (let i = 0; i < arr.length; i++) { if (arr[i] < min) min = arr[i]; if (arr[i] > max) max = arr[i]; }
    if (!isFinite(min) || !isFinite(max)) return;
    if (max - min < 1e-9) { max = min + 1; }
    const pad = 3;
    ctx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const x = (times[i] / (run.config.duration_s || 60)) * w;
      const y = hgt - pad - ((arr[i] - min) / (max - min)) * (hgt - pad * 2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(200, 244, 90, .55)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // fault vertical lines
    const d = run.config.duration_s || 60;
    (run.events || []).filter((e) => e.event_type && e.event_type !== 'healthy').forEach((ev) => {
      const x = (ev.trigger_s / d) * w;
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x, hgt);
      ctx.strokeStyle = 'rgba(255, 95, 109, .35)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  }

  /* ===================================================================
     page mounting
     =================================================================== */
  function renderPage(state, reason) {
    const pageId = state.page;
    const def = FL.pages && FL.pages[pageId];
    if (!def) {
      ui.clear(refs.viewRoot);
      refs.viewRoot.appendChild(ui.emptyState({
        icon: 'warning', title: '页面未加载', desc: '页面模块 ' + pageId + ' 缺失，请检查 index.html 的脚本加载。'
      }));
      return;
    }
    let root = pageRoots[pageId];
    if (!root) {
      root = h('section', {
        class: 'page page-' + pageId, id: 'page-' + pageId,
        'aria-label': def.label || pageId
      });
      pageRoots[pageId] = root;
      refs.viewRoot.appendChild(root);
      try {
        def.mount(root, api);
      } catch (err) {
        console.error('[shell] mount failed for page', pageId, err);
        root.appendChild(ui.emptyState({
          icon: 'warning', title: '页面初始化失败', desc: String(err && err.message ? err.message : err)
        }));
      }
    }
    if (lastPage !== pageId) {
      Object.keys(pageRoots).forEach((id) => {
        pageRoots[id].classList.toggle('is-active', id === pageId);
      });
      root.classList.add('is-active');
      lastPage = pageId;
      refs.viewRoot.scrollTop = 0;
    }
    try {
      if (def.update) def.update(state, reason || 'nav');
    } catch (err) {
      console.error('[shell] update failed for page', pageId, err);
    }
  }

  /* ===================================================================
     system switcher popover
     =================================================================== */
  function toggleSystemPopover() {
    if (popover) { closePopover(); return; }
    const list = (function () {
      try { return FL.systems.list(); } catch (e) { return []; }
    })();
    const panel = h('div', { class: 'popover', role: 'menu', 'aria-label': '选择实验系统' });
    list.forEach((sys) => {
      const state = FL.store.getState();
      const item = h('button', {
        class: 'popover-item', type: 'button', role: 'menuitemradio',
        'aria-checked': String(sys.id === state.systemId),
        on: {
          click: () => {
            closePopover();
            if (sys.id !== state.systemId) FL.store.actions.startExperiment(sys.id);
          }
        }
      }, [
        h('span', { class: 'pi-code' }, sys.experimentCode),
        h('span', {}, [
          h('span', { class: 'pi-title' }, sys.title),
          h('span', { class: 'pi-sub' }, sys.tagline || '')
        ])
      ]);
      panel.appendChild(item);
    });
    const backdrop = h('div', { class: 'popover-backdrop', on: { click: closePopover } });
    document.body.appendChild(backdrop);
    document.body.appendChild(panel);
    const rect = refs.systemSwitch.getBoundingClientRect();
    const pw = Math.min(400, window.innerWidth - 24);
    panel.style.width = pw + 'px';
    panel.style.top = (rect.bottom + 7) + 'px';
    panel.style.left = Math.max(12, Math.min(rect.left, window.innerWidth - pw - 12)) + 'px';
    popover = { panel, backdrop, onKey: null };
    popover.onKey = (e) => { if (e.key === 'Escape') closePopover(); };
    document.addEventListener('keydown', popover.onKey, true);
    const first = panel.querySelector('.popover-item');
    if (first) first.focus();
  }

  function closePopover() {
    if (!popover) return;
    if (popover.panel.parentNode) popover.panel.parentNode.removeChild(popover.panel);
    if (popover.backdrop.parentNode) popover.backdrop.parentNode.removeChild(popover.backdrop);
    document.removeEventListener('keydown', popover.onKey, true);
    popover = null;
    if (refs.systemSwitch && refs.systemSwitch.focus) refs.systemSwitch.focus();
  }

  /* ===================================================================
     help
     =================================================================== */
  function openHelp() {
    const content = h('div', {}, [
      h('div', { class: 'eyebrow mb-8' }, '操作'),
      h('div', { class: 'kv' }, [
        h('dt', {}, '空格'), h('dd', {}, '播放 / 暂停'),
        h('dt', {}, '← / →'), h('dd', {}, '后退 / 前进 0.1 s'),
        h('dt', {}, 'Shift + ←/→'), h('dd', {}, '后退 / 前进 1 s'),
        h('dt', {}, 'Home / End'), h('dd', {}, '跳到 0 s / 60 s'),
        h('dt', {}, '?'), h('dd', {}, '打开这个帮助')
      ]),
      h('hr', { class: 'hr' }),
      h('div', { class: 'eyebrow mb-8' }, '页面'),
      h('p', { class: 'muted' },
        '首页选择系统并创建运行；系统页注入故障并观察能量流；曲线页同步查看真实/测量/派生信号；' +
        '因果页解释"为什么变化"；对比页比较故障组与无故障基准；竞技场让诊断 Agent 在封存真值条件下比赛。'),
      h('hr', { class: 'hr' }),
      h('div', { class: 'eyebrow mb-8' }, '数据可信度'),
      h('p', { class: 'muted' },
        'FaultLab V0.1 是离线可运行的行为级（L0）解析模型演示：FL-001 的数值由规格中的解析式精确生成，' +
        '并非 Simulink、现场数据或实测结论。所有数字都带来源标签（配置 / 模型状态 / 观测 / 控制器 / 故障事件 / 派生 / 模型假设），' +
        '说明文本不作为计算数据源。观测残差（如 +4 kW）是测量一致性残差，不代表实际能量损失。'),
      h('hr', { class: 'hr' }),
      h('div', { class: 'eyebrow mb-8' }, '版本'),
      h('p', { class: 'muted' }, 'FaultLab V0.1 / FL-001 · 基准日期 2026-10-27 · 离线单页应用 · 模型层级 L0')
    ]);
    ui.modal({ title: '帮助与快捷键', subtitle: 'FaultLab — Virtual Energy Lab', content, wide: false });
  }

  /* ===================================================================
     wiring
     =================================================================== */
  function wireGlobal() {
    window.addEventListener('hashchange', () => {
      const m = /^#\/([a-z]+)/.exec(location.hash || '');
      if (!m) return;
      const pageId = m[1];
      if (FL.pages && FL.pages[pageId]) FL.store.actions.navigate(pageId);
    });

    document.addEventListener('keydown', (e) => {
      const target = e.target;
      if (target && (target.closest && target.closest('input, textarea, select, [contenteditable="true"]'))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const state = FL.store.getState();
      if (e.code === 'Space' && !e.repeat) {
        if (target && target.closest && target.closest('button, a')) return;
        e.preventDefault();
        FL.store.actions.togglePlay();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        FL.store.actions.setTime(state.currentTime - (e.shiftKey ? 1 : 0.1), { pause: true });
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        FL.store.actions.setTime(state.currentTime + (e.shiftKey ? 1 : 0.1), { pause: true });
      } else if (e.key === 'Home') {
        e.preventDefault();
        FL.store.actions.setTime(0, { pause: true });
      } else if (e.key === 'End') {
        const d = state.activeRun ? state.activeRun.config.duration_s : 60;
        e.preventDefault();
        FL.store.actions.setTime(d, { pause: true });
      } else if (e.key === '?') {
        e.preventDefault();
        openHelp();
      }
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderMini(FL.store.getState().activeRun), 120);
    });
  }

  function boot() {
    if (!FL.store) {
      document.getElementById('app').appendChild(ui.emptyState({
        icon: 'warning', title: '初始化失败', desc: 'store 模块缺失，请检查 index.html 脚本顺序。'
      }));
      return;
    }
    buildShell();
    FL.store.subscribe(onState);
    wireGlobal();
    FL.store.init();
    booted = true;
    const state = FL.store.getState();
    renderHeader(state);
    renderNav(state);
    renderTimeline(state, 'boot');
    renderToasts(state);
    renderPage(state, 'boot');
  }

  FL.shell = { boot, api, openHelp };
})();

</script>
  <script>
/* ===== src/main.js ===== */
/* owner: lead | module: main | contract: docs/CONTRACT.md */
(function () {
  'use strict';
  const FL = window.FL = window.FL || {};
  const VERSION = '0.1.0';
  FL.app = { version: VERSION };

  const REQUIRED = [
    ['protocol', 'FL.protocol'],
    ['systems', 'FL.systems'],
    ['core', 'FL.core'],
    ['ui', 'FL.ui'],
    ['store', 'FL.store'],
    ['shell', 'FL.shell']
  ];

  window.addEventListener('error', (e) => {
    console.error('[FaultLab] uncaught error:', e.error || e.message, e.filename ? e.filename + ':' + e.lineno : '');
  });
  window.addEventListener('unhandledrejection', (e) => {
    console.error('[FaultLab] unhandled rejection:', e.reason);
  });

  function fatal(title, detail) {
    const app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = '';
    const box = document.createElement('div');
    box.style.cssText = 'max-width:720px;margin:12vh auto;padding:28px;border:1px solid #2f3945;border-radius:10px;background:#0e141b;font-family:"Microsoft YaHei UI",sans-serif;color:#c2ccd0;line-height:1.7';
    box.innerHTML = '<div style="font-family:Consolas,monospace;font-size:11px;letter-spacing:.16em;color:#ff5f6d;text-transform:uppercase">FaultLab 启动失败</div>'
      + '<h1 style="font-size:20px;color:#eef3f2;margin:10px 0 8px">' + title + '</h1>'
      + '<p style="font-size:13px">' + detail + '</p>'
      + '<p style="font-size:12px;color:#8b98a5">请确认通过本地服务器打开（python tools/serve.py），并检查 index.html 中脚本是否全部加载成功；浏览器控制台有更详细的错误。</p>';
    app.appendChild(box);
  }

  function boot() {
    const missing = REQUIRED.filter(([, path]) => {
      const parts = path.split('.');
      let cur = window;
      for (let i = 0; i < parts.length; i++) {
        if (cur == null) return true;
        cur = cur[parts[i]];
      }
      return cur == null;
    }).map(([name]) => name);
    if (missing.length) {
      fatal('模块未就绪', '缺少核心模块：' + missing.join(' / ') + '。这通常意味着某个脚本文件缺失或加载失败。');
      return;
    }
    try {
      FL.shell.boot();
      FL.__ready = true;
      document.body.classList.add('fl-ready');
      console.info('[FaultLab] V' + VERSION + ' ready');
    } catch (err) {
      console.error('[FaultLab] boot failed', err);
      fatal('启动异常', String(err && err.message ? err.message : err));
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
